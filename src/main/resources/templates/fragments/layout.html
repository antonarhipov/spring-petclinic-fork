<!DOCTYPE html>
<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic</title>
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" role="navigation" th:aria-label="#{scheduling.navigation}">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/}" th:title="#{scheduling.navigation.home}"><span></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
              th:aria-label="#{scheduling.navigation.toggle}">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">
        <ul class="nav navbar-nav me-auto" th:if="${navigationRole == 'OWNER'}">
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'pets'} ? 'active'" th:href="@{/my/pets}" th:text="#{scheduling.my.pets}">My pets</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'appointments'} ? 'active'" th:href="@{/my/appointments}" th:text="#{scheduling.my.appointments}">My appointments</a></li>
        </ul>
        <ul class="nav navbar-nav me-auto" th:if="${navigationRole == 'STAFF'}">
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'home'} ? 'active'" th:href="@{/}" th:text="#{home}">Home</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'owners'} ? 'active'" th:href="@{/owners/find}" th:text="#{findOwners}">Find owners</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'vets'} ? 'active'" th:href="@{/vets.html}" th:text="#{vets}">Veterinarians</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'queue'} ? 'active'" th:href="@{/staff/queue}" th:text="#{scheduling.queue}">Scheduling queue</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'calendar'} ? 'active'" th:href="@{/staff/calendar}" th:text="#{scheduling.calendar}">Calendar</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'settings'} ? 'active'" th:href="@{/staff/settings}" th:text="#{scheduling.settings}">Clinic settings</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${menu == 'error'} ? 'active'" th:href="@{/oups}" th:text="#{error}">Error</a></li>
        </ul>
        <div class="navbar-nav" th:if="${navigationUsername != null}">
          <span class="navbar-text" th:text="${navigationUsername}">username</span>
          <form class="navbar-form" th:action="@{/logout}" method="post">
            <button class="btn btn-link nav-link" type="submit" th:text="#{scheduling.logout}">Logout</button>
          </form>
        </div>
      </div>
    </div>
  </nav>
  <main class="container-fluid">
    <div class="container xd-container">
      <th:block th:insert="${template}" />
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <img th:src="@{/resources/images/spring-logo.svg}" th:alt="#{scheduling.logo.alt}" class="logo">
          </div>
        </div>
      </div>
    </div>
  </main>
  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
