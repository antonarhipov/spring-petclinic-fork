<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic :: a Spring Framework demonstration</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark" role="navigation">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/}"><span></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar" style>

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">

          <li th:fragment="menuItem (link,active,title,glyph,text)" th:class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}" th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" class="fa fa-home"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

        </ul>

        <ul class="nav navbar-nav me-auto">

          <li th:replace="~{::menuItem ('/','home','home page','home',#{home})}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span th:text="#{home}">Home</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/owners/find','owners','find owners','search',#{findOwners})}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span th:text="#{findOwners}">Find owners</span>
          </li>

          <li sec:authorize="hasRole('OWNER')"
            th:replace="~{::menuItem ('/my-profile','my-profile','my profile','user',#{myProfile})}">
            <span class="fa fa-user" aria-hidden="true"></span>
            <span th:text="#{myProfile}">My Profile</span>
          </li>

          <li sec:authorize="hasRole('OWNER')"
            th:replace="~{::menuItem ('/scheduling/notifications','notifications','notifications','bell',#{notifications} + (${unreadNotificationCount != null && unreadNotificationCount > 0} ? ' (' + ${unreadNotificationCount} + ')' : ''))}">
            <span class="fa fa-bell" aria-hidden="true"></span>
            <span th:text="#{notifications}">Notifications</span>
          </li>

          <li th:replace="~{::menuItem ('/vets.html','vets','veterinarians','th-list',#{vets})}">
            <span class="fa fa-th-list" aria-hidden="true"></span>
            <span th:text="#{vets}">Veterinarians</span>
          </li>

          <li th:replace="~{::menuItem ('/guidance/urgent-care','urgent-care','urgent care','heartbeat',#{urgentCare})}">
            <span class="fa fa-heartbeat" aria-hidden="true"></span>
            <span th:text="#{urgentCare}">Urgent Care</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/scheduling/staff/calendar','calendar','calendar','calendar',#{calendar})}">
            <span class="fa fa-calendar" aria-hidden="true"></span>
            <span th:text="#{calendar}">Calendar</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/scheduling/staff/queue','staff-queue','fallback queue','inbox',#{fallbackQueue})}">
            <span class="fa fa-inbox" aria-hidden="true"></span>
            <span th:text="#{fallbackQueue}">Fallback Queue</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/scheduling/admin/settings','settings','settings','cogs',#{clinicSettings})}">
            <span class="fa fa-cogs" aria-hidden="true"></span>
            <span th:text="#{clinicSettings}">Clinic Settings</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/admin/accounts','accounts','accounts','users',#{accounts})}">
            <span class="fa fa-users" aria-hidden="true"></span>
            <span th:text="#{accounts}">Accounts</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/scheduling/staff/audit','audit','audit log','list-alt',#{auditLog})}">
            <span class="fa fa-list-alt" aria-hidden="true"></span>
            <span th:text="#{auditLog}">Audit Log</span>
          </li>

          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/scheduling/staff/diagnostics','diagnostics','diagnostics','stethoscope',#{diagnostics})}">
            <span class="fa fa-stethoscope" aria-hidden="true"></span>
            <span th:text="#{diagnostics}">Diagnostics</span>
          </li>

          <li
            th:replace="~{::menuItem ('/oups','error','trigger a RuntimeException to see how it is handled','exclamation-triangle',#{error})}">
            <span class="fa exclamation-triangle" aria-hidden="true"></span>
            <span th:text="#{error}">Error</span>
          </li>

        </ul>

        <ul class="nav navbar-nav navbar-right">
          <li sec:authorize="!isAuthenticated()">
            <a class="nav-link" th:href="@{/login}">
              <span class="fa fa-sign-in"></span>
              <span th:text="#{login}">Login</span>
            </a>
          </li>
          <li sec:authorize="isAuthenticated()" class="nav-item">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="btn btn-link nav-link">
                <span class="fa fa-sign-out"></span>
                <span sec:authentication="name">User</span> (<span th:text="#{logout}">Logout</span>)
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="container xd-container">

      <div th:if="${@environment.matchesProfiles('demo-data')}" class="alert alert-warning text-center" role="alert">
        <strong th:text="#{demoModeWarning}">Demo Mode: Using pre-seeded demonstration data.</strong>
      </div>

      <th:block th:insert="${template}" />

      <br />
      <br />
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <img src="../static/images/spring-logo.svg" th:src="@{/resources/images/spring-logo.svg}"
              alt="VMware Tanzu Logo" class="logo">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
