<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b63">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{app.name}">PetClinic</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}">
</head>

<body>
  <nav class="navbar navbar-expand-lg app-navbar" aria-label="Primary navigation">
    <div class="container-xl">
      <a class="navbar-brand" th:href="@{/}" th:aria-label="#{app.name}">
        <span class="brand-mark" aria-hidden="true"><span class="fa fa-paw"></span></span>
        <span th:text="#{app.name}">PetClinic</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
        aria-controls="main-navbar" aria-expanded="false" th:aria-label="#{navigation.toggle}">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="main-navbar">
        <ul class="navbar-nav me-auto" th:remove="all">
          <li th:fragment="menuItem (link,active,title,glyph,text)" class="nav-item">
            <a th:class="${active == menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}"
              th:title="${title}" th:aria-current="${active == menu ? 'page' : null}">
              <span th:class="'fa fa-' + ${glyph}" aria-hidden="true"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>
        </ul>

        <ul class="navbar-nav me-auto">
          <li th:replace="~{::menuItem ('/','home','home page','home',#{home})}"></li>
          <li sec:authorize="hasRole('OWNER')"
            th:replace="~{::menuItem ('/my/appointments','appointments','my appointments','calendar',#{appointment.nav.appointments})}"></li>
          <li sec:authorize="hasRole('OWNER')"
            th:replace="~{::menuItem ('/my/pets','pets','my pets','paw',#{pets})}"></li>
          <li sec:authorize="hasRole('OWNER')"
            th:replace="~{::menuItem ('/my/profile','profile','my profile','user',#{owner.profile})}"></li>
          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/owners/find','owners','find owners','search',#{findOwners})}"></li>
          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/vets.html','vets','veterinarians','user-md',#{vets})}"></li>
          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/staff/calendar','calendar','clinic calendar','calendar',#{appointment.nav.calendar})}"></li>
          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/staff/availability','availability','veterinarian schedules','clock-o',#{appointment.nav.availability})}"></li>
          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/staff/queue','queue','scheduling queue','tasks',#{appointment.nav.queue})}"></li>
          <li sec:authorize="hasRole('STAFF')"
            th:replace="~{::menuItem ('/staff/settings/scheduling','settings','scheduling settings','cog',#{appointment.nav.settings})}"></li>
        </ul>

        <div class="account-nav" sec:authorize="isAnonymous()">
          <a class="btn btn-primary" th:href="@{/login}" th:text="#{auth.signIn}">Sign in</a>
        </div>
        <div class="account-nav" sec:authorize="isAuthenticated()">
          <span class="account-name">
            <span class="fa fa-user-circle" aria-hidden="true"></span>
            <span th:text="${#authentication.name}">username</span>
          </span>
          <form class="logout-form" th:action="@{/logout}" method="post"
            th:attr="data-loading-message=#{loading.signOut}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-primary" type="submit" th:text="#{auth.signOut}">Sign out</button>
          </form>
        </div>
      </div>
    </div>
  </nav>

  <div id="global-submit-status" class="submit-status" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="submit-spinner" aria-hidden="true"></span>
    <span id="global-submit-message" th:text="#{loading.default}">Working...</span>
  </div>

  <main class="app-main">
    <div class="container-xl content-shell">
      <th:block th:insert="${template}"></th:block>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container-xl">
      <span th:text="#{footer.attribution}">PetClinic, built with Spring Boot</span>
    </div>
  </footer>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/resources/js/petclinic.js}"></script>
</body>

</html>
