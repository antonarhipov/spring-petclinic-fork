<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic :: a Spring Framework demonstration</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark" role="navigation">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/}"><span></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar" style>

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">

          <li th:fragment="menuItem (link,active,title,glyph,text)" th:class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}" th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" class="fa fa-home"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

        </ul>

        <ul class="nav navbar-nav me-auto">

          <li th:replace="~{::menuItem ('/','home','home page','home',#{home})}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span th:text="#{home}">Home</span>
          </li>

          <li th:replace="~{::menuItem ('/owners/find','owners','find owners','search',#{findOwners})}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span th:text="#{findOwners}">Find owners</span>
          </li>

          <li th:replace="~{::menuItem ('/vets.html','vets','veterinarians','th-list',#{vets})}">
            <span class="fa fa-th-list" aria-hidden="true"></span>
            <span th:text="#{vets}">Veterinarians</span>
          </li>

          <th:block th:if="${currentUserIsOwner}">
            <li
              th:replace="~{::menuItem ('/my-profile','myprofile','my profile and pets','user',#{myProfile})}">
              <span class="fa fa-user" aria-hidden="true"></span>
              <span th:text="#{myProfile}">My Profile</span>
            </li>
            <li
              th:replace="~{::menuItem ('/my-appointments','myappointments','my upcoming appointments','calendar',#{myAppointments})}">
              <span class="fa fa-calendar" aria-hidden="true"></span>
              <span th:text="#{myAppointments}">My Appointments</span>
            </li>
          </th:block>

          <th:block th:if="${currentUserIsStaff}">
            <li
              th:replace="~{::menuItem ('/staff/queue','staffqueue','staff scheduling queue','inbox',#{staffQueue})}">
              <span class="fa fa-inbox" aria-hidden="true"></span>
              <span th:text="#{staffQueue}">Queue</span>
            </li>
            <li
              th:replace="~{::menuItem ('/staff/appointments','staffappointments','manage appointments','calendar',#{staffAppointments})}">
              <span class="fa fa-calendar" aria-hidden="true"></span>
              <span th:text="#{staffAppointments}">Appointments</span>
            </li>
            <li
              th:replace="~{::menuItem ('/staff/clinic/settings','clinic','clinic configuration','cog',#{clinicSetup})}">
              <span class="fa fa-cog" aria-hidden="true"></span>
              <span th:text="#{clinicSetup}">Clinic Setup</span>
            </li>
            <li
              th:replace="~{::menuItem ('/staff/accounts','accounts','user accounts','users',#{accounts})}">
              <span class="fa fa-users" aria-hidden="true"></span>
              <span th:text="#{accounts}">Accounts</span>
            </li>
          </th:block>

        </ul>

        <ul class="nav navbar-nav ms-auto">

          <li class="nav-item" th:if="${currentUserAuthenticated}">
            <span class="nav-link disabled" th:text="#{loggedInAs} + ' ' + ${currentUsername}">Signed in</span>
          </li>

          <li class="nav-item" th:if="${currentUserAuthenticated}">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="nav-link btn btn-link" th:text="#{logout}">Logout</button>
            </form>
          </li>

          <li class="nav-item" th:unless="${currentUserAuthenticated}">
            <a class="nav-link" th:href="@{/login}" th:text="#{login}">Login</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="container xd-container">

      <th:block th:insert="${template}" />

      <br />
      <br />
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <img src="../static/images/spring-logo.svg" th:src="@{/resources/images/spring-logo.svg}"
              alt="VMware Tanzu Logo" class="logo">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
