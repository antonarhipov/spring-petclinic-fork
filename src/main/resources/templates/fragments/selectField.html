<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">
<body>
  <th:block th:fragment="select (label, name, items)">
    <div th:with="valid=${!#fields.hasErrors(name)}" th:class="${valid ? 'form-group' : 'form-group has-error'}">
      <label th:for="${name}" class="form-label" th:text="${label}">Label</label>
      <select class="form-select" th:field="*{__${name}__}" th:attr="aria-invalid=${!valid}">
        <option th:each="item : ${items}" th:value="${item}" th:text="${item}">dog</option>
      </select>
      <span th:if="${!valid}" class="help-inline" th:errors="*{__${name}__}" th:text="#{error}">Error</span>
    </div>
  </th:block>
</body>
</html>
