<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <h2 th:text="#{login}">Login</h2>

  <div th:if="${param.error}" class="alert alert-danger" th:text="#{invalidCredentials}">
    Invalid username or password.
  </div>

  <div th:if="${param.logout}" class="alert alert-success" th:text="#{loggedOut}">
    You have been logged out.
  </div>

  <form th:action="@{/login}" method="post" class="form-horizontal">
    <div class="form-group mb-3">
      <label for="username" class="col-sm-2 control-label" th:text="#{username}">Username</label>
      <div class="col-sm-10">
        <input type="text" id="username" name="username" class="form-control" autofocus="autofocus" />
      </div>
    </div>
    <div class="form-group mb-3">
      <label for="password" class="col-sm-2 control-label" th:text="#{password}">Password</label>
      <div class="col-sm-10">
        <input type="password" id="password" name="password" class="form-control" />
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary" th:text="#{login}">Login</button>
      </div>
    </div>
  </form>

</body>

</html>
