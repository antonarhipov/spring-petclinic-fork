<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'login')}">
<body>
<div class="row"><div class="col-md-6">
  <h2 th:text="#{scheduling.login.title}">Sign in</h2>
  <div class="alert alert-danger" th:if="${param.error}" th:text="#{scheduling.login.error}">Sign-in failed</div>
  <form th:action="@{/login}" method="post">
    <div class="form-group"><label for="username" th:text="#{scheduling.login.username}">Username</label><input class="form-control" id="username" name="username" autocomplete="username"></div>
    <div class="form-group"><label for="password" th:text="#{scheduling.login.password}">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit" th:text="#{scheduling.login.submit}">Sign in</button>
  </form>
</div></div>
</body>
</html>
