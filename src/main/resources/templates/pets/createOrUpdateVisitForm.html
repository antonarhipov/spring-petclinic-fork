<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="${pet.name}">Pet</p>
      <h1 th:text="#{visit.add.title}">Add visit</h1>
      <p class="page-subtitle" th:text="${owner?.firstName + ' ' + owner?.lastName}">Owner</p>
    </div>
  </header>
  <form th:object="${visit}" class="form-card" method="post" th:attr="data-loading-message=#{loading.saving}">
    <input th:replace="~{fragments/inputField :: input (#{date}, 'date', 'date')}">
    <input th:replace="~{fragments/inputField :: input (#{description}, 'description', 'text')}">
    <input type="hidden" name="petId" th:value="${pet.id}">
    <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add visit</button>
  </form>

  <section class="section-card mt-4">
    <div class="section-heading"><h2 th:text="#{previousVisits}">Previous visits</h2></div>
    <ul class="item-list" th:if="${!#lists.isEmpty(pet.visits)}">
      <li class="item-row" th:each="previousVisit : ${pet.visits}">
        <strong th:text="${#temporals.format(previousVisit.date, 'yyyy-MM-dd')}">Date</strong>
        <span th:text="${previousVisit.description}">Description</span>
      </li>
    </ul>
    <div class="empty-state" th:if="${#lists.isEmpty(pet.visits)}" th:text="#{visits.empty}">No visits recorded.</div>
  </section>
</body>
</html>
