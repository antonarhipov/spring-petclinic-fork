<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="${owner?.firstName + ' ' + owner?.lastName}">Owner</p>
      <h1 th:text="${pet['new']} ? #{pet.add.title} : #{pet.edit.title}">Pet</h1>
    </div>
  </header>
  <form th:object="${pet}" class="form-card" method="post" th:attr="data-loading-message=#{loading.saving}">
    <input type="hidden" name="id" th:value="*{id}">
    <input th:replace="~{fragments/inputField :: input (#{name}, 'name', 'text')}">
    <input th:replace="~{fragments/inputField :: input (#{birthDate}, 'birthDate', 'date')}">
    <input th:replace="~{fragments/selectField :: select (#{type}, 'type', ${types})}">
    <div class="button-row">
      <button th:with="text=${pet['new']} ? #{addPet} : #{updatePet}" class="btn btn-primary" type="submit"
        th:text="${text}">Save pet</button>
      <a class="btn btn-link"
        th:href="${ownerPortal} ? @{/my/pets} : @{/owners/{id}(id=${owner.id})}"
        th:text="#{cancel}">Cancel</a>
    </div>
  </form>
</body>
</html>
