<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body th:data-request-id="${request.id}" th:data-current-state="${request.state}">
  <h2 th:text="#{scheduling.interpreting}">Interpreting request</h2>
  <div class="mb-3">
    <a th:href="@{/my/requests/{id}(id=${request.id})}" class="btn btn-secondary" th:text="#{scheduling.refresh}">Refresh</a>
  </div>
  <p th:if="${actionErrorKey}" th:text="#{${actionErrorKey}}">Unavailable</p>
  <div th:replace="~{fragments/urgent-care :: guidance}"></div>
  <script th:src="@{/resources/js/request-status.js}"></script>
</body>
</html>
