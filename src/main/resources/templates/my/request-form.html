<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'pets')}"><body>
<h2 th:text="#{scheduling.request.new}">Request appointment</h2><p class="alert alert-danger" th:if="${errorKey}" th:text="#{${errorKey}}">Error</p>
<form th:action="${request == null} ? @{/my/requests/new} : @{/my/requests/{id}/edit(id=${request.id})}" method="post">
<label for="petId" th:text="#{scheduling.request.pet}">Pet</label><select class="form-control" id="petId" name="petId" th:if="${owner != null}"><option th:each="pet : ${owner.pets}" th:value="${pet.id}" th:selected="${pet.id == selectedPetId}" th:text="${pet.name}">Pet</option></select>
<label for="requestText" th:text="#{scheduling.request.text}">Request</label><textarea class="form-control" id="requestText" name="requestText" required minlength="1" maxlength="2000" th:placeholder="#{scheduling.request.hint}" th:text="${request != null ? request.requestText : requestText}"></textarea><button class="btn btn-primary" th:text="#{scheduling.save}">Save</button>
</form><div th:replace="~{fragments/urgent-care :: guidance}"></div></body></html>
