<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>
  <h2 th:text="#{scheduling.failed}">The request could not be interpreted</h2>
  <p th:if="${actionErrorKey}" th:text="#{${actionErrorKey}}">Unavailable</p>

  <div th:if="${request.failureCount >= 3}" id="staff-recommendation" class="alert alert-info">
    <strong th:text="#{scheduling.queue.needsStaff}">Needs staff</strong>:
	    <span th:text="#{scheduling.failed.staffRecommendation}">Contact clinic staff for help.</span>
  </div>

  <div class="btn-toolbar gap-2 mb-3">
    <a th:href="@{/my/requests/{id}/edit(id=${request.id})}" class="btn btn-primary" th:text="#{scheduling.edit}">Edit</a>
    <form th:action="@{/my/requests/{id}/staff-assistance(id=${request.id})}" method="post" class="d-inline">
      <button type="submit" class="btn btn-secondary" th:text="#{scheduling.with-staff}">With clinic staff</button>
    </form>
    <form th:action="@{/my/requests/{id}/abandon(id=${request.id})}" method="post" class="d-inline">
      <button type="submit" class="btn btn-danger" th:text="#{scheduling.cancel}">Cancel</button>
    </form>
  </div>

  <div th:replace="~{fragments/urgent-care :: guidance}"></div>
</body>
</html>
