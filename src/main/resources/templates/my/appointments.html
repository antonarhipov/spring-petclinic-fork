<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'myAppointments')}">
<body>
  <h2 th:text="#{myAppointments}">My Appointments</h2>
  <div th:if="${appointmentCancelled}" class="alert alert-info" th:text="#{appointmentCancelled}"></div>
  <div th:if="${appointmentActionNotAllowed}" class="alert alert-danger" th:text="#{appointmentActionNotAllowed}"></div>
	  <p th:if="${#lists.isEmpty(appointments)}" th:text="#{noAppointments}">No appointments</p>
	  <h3 th:text="#{upcomingAppointments}">Upcoming</h3>
	  <table id="upcoming-appointments" th:unless="${#lists.isEmpty(upcomingAppointments)}" class="table table-striped">
	    <thead><tr><th th:text="#{pet}">Pet</th><th th:text="#{date}">Date</th><th th:text="#{status}">Status</th><th th:text="#{actions}">Actions</th></tr></thead>
	    <tbody><tr th:each="appointment : ${upcomingAppointments}"><td><a th:href="@{/my/appointments/{id}(id=${appointment.id})}" th:text="${appointment.pet.name}"></a></td><td th:text="${appointment.startTime}"></td><td><span th:text="${appointment.status}"></span><div th:if="${latestStaffChanges[appointment.id] != null}" class="clinic-change"><span th:text="#{changedByClinic}">Changed by the clinic</span>: <span th:text="${latestStaffChanges[appointment.id].reason}">Reason</span>; <span th:text="#{originalTime}">Original time</span>: <span th:text="${latestStaffChanges[appointment.id].originalStartTime}">Original</span></div></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/my/appointments/{id}(id=${appointment.id})}" th:text="#{appointmentDetails}">Details</a> <form th:action="@{/my/appointments/{id}/cancel(id=${appointment.id})}" method="post" style="display:inline"><button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{cancelAppointment}">Cancel</button></form></td></tr></tbody>
	  </table>
	  <h3 th:text="#{pastAppointments}">Past</h3>
	  <table id="past-appointments" th:unless="${#lists.isEmpty(pastAppointments)}" class="table table-striped">
	    <thead><tr><th th:text="#{pet}">Pet</th><th th:text="#{date}">Date</th><th th:text="#{status}">Status</th><th th:text="#{actions}">Actions</th></tr></thead>
	    <tbody><tr th:each="appointment : ${pastAppointments}"><td><a th:href="@{/my/appointments/{id}(id=${appointment.id})}" th:text="${appointment.pet.name}"></a></td><td th:text="${appointment.startTime}"></td><td><span th:text="${appointment.status}"></span><div th:if="${latestStaffChanges[appointment.id] != null}" class="clinic-change"><span th:text="#{changedByClinic}">Changed by the clinic</span>: <span th:text="${latestStaffChanges[appointment.id].reason}">Reason</span>; <span th:text="#{originalTime}">Original time</span>: <span th:text="${latestStaffChanges[appointment.id].originalStartTime}">Original</span></div></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/my/appointments/{id}(id=${appointment.id})}" th:text="#{appointmentDetails}">Details</a></td></tr></tbody>
	  </table>
  <a class="btn btn-primary" th:href="@{/my/requests/new}" th:text="#{startRequest}">Start a request</a>
</body>
</html>
