<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>
  <h2 th:text="#{appointment.offer.title}">Your appointment offer</h2>
  <p><strong th:text="${offer.vet.firstName + ' ' + offer.vet.lastName}">Veterinarian</strong></p>
  <p th:text="${offer.startAt}">Time</p>
  <p th:text="${offer.durationMinutes + ' minutes'}">Duration</p>
  <p th:text="${offer.rationale}">Rationale</p>
  <p>Available until <strong th:text="${offer.expiresAt}">Expiry</strong>.</p>
  <form th:action="@{/my/scheduling/offers/{id}/accept(id=${offer.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" th:text="#{appointment.offer.accept}">Accept offer</button></form>
  <form th:action="@{/my/scheduling/offers/{id}/reject(id=${offer.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label><span th:text="#{appointment.reason.optional}">Reason (optional)</span> <input name="reason" maxlength="255"></label><button type="submit" th:text="#{appointment.offer.reject}">Reject offer</button></form>
</body>
</html>
