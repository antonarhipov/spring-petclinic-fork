<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'my-profile')}">

<body>

  <h2 th:text="#{upcomingAppointments}">Upcoming Appointments</h2>

  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}">Success</span>
  </div>

  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}">Error</span>
  </div>

  <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info" role="alert">
    <span th:text="#{noUpcomingAppointments}">No upcoming appointments found.</span>
  </div>

  <table th:if="${not #lists.isEmpty(appointments)}" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{pet}">Pet</th>
        <th th:text="#{veterinarian}">Veterinarian</th>
        <th th:text="#{careType}">Care Type</th>
        <th th:text="#{specialty}">Specialty</th>
        <th th:text="#{startTime}">Start Time</th>
        <th th:text="#{duration}">Duration</th>
        <th th:text="#{status}">Status</th>
        <th th:text="#{actions}">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="appt : ${appointments}">
        <td th:text="${appt.petName}">Leo</td>
        <td th:text="${appt.vetName}">Dr. James Carter</td>
        <td th:text="${appt.careType}">GENERAL</td>
        <td th:text="${appt.requiredSpecialtyName != null ? appt.requiredSpecialtyName : '-'}">-</td>
        <td th:text="${appt.startTime}">2026-08-28T14:00:00Z</td>
        <td><span th:text="${appt.durationMinutes}">30</span> <span th:text="#{minutes}">minutes</span></td>
        <td><span class="badge bg-success" th:text="${appt.status}">BOOKED</span></td>
        <td>
          <a th:href="@{/scheduling/appointments/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-primary" th:text="#{details}">Details</a>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="mt-4">
    <a th:href="@{/my-profile}" class="btn btn-secondary" th:text="#{backToProfile}">Back to Profile</a>
  </div>

</body>
</html>
