<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="#{appointment.owner.eyebrow}">Your pet care</p>
      <h1 th:text="#{appointment.requests.history}">Request history</h1>
    </div>
    <a class="btn btn-outline-primary" th:href="@{/my/appointments}" th:text="#{appointment.dashboard.title}">My appointments</a>
  </header>
  <section class="section-card">
    <ul class="item-list" th:if="${!#lists.isEmpty(requests)}">
      <li class="section-card" th:each="entry : ${requests}">
        <div class="section-heading">
          <span class="item-row-title" th:text="${entry.request.pet.name}">Pet</span>
          <div class="d-flex align-items-center gap-2 flex-wrap">
          <span class="status-badge"
              th:classappend="${'status-' + #strings.toLowerCase(#strings.replace(entry.request.state.name(), '_', '-'))}"
              th:text="${entry.request.state}">Request</span>
            <form th:if="${entry.request.state.name() != 'CONFIRMED' and entry.request.state.name() != 'CLOSED'}"
              th:action="@{/my/scheduling/requests/{id}/withdraw(id=${entry.request.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-outline-danger" type="submit" th:text="#{appointment.request.cancel}">Cancel request</button>
            </form>
          </div>
        </div>
        <div th:replace="~{fragments/schedulingRequestDetails :: details (${entry},true)}"></div>
      </li>
    </ul>
    <div class="empty-state" th:if="${#lists.isEmpty(requests)}">
      <span class="fa fa-inbox" aria-hidden="true"></span>
      <span th:text="#{appointment.requests.empty}">No scheduling requests yet.</span>
    </div>
  </section>
</body>
</html>
