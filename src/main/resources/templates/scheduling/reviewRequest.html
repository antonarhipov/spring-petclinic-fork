<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="#{appointment.review.step}">Review</p>
      <h1 th:text="#{appointment.review.title}">Review your request</h1>
      <p class="page-subtitle" th:text="#{appointment.review.subtitle}">Check the details before we search for an appointment.</p>
    </div>
  </header>

  <div class="alert alert-info" role="status" th:if="${request.state.name() == 'STAFF_HANDLING'}"
    th:text="#{appointment.staff.handling}">Our staff will help with this request.</div>

  <form class="form-card" th:action="@{/my/scheduling/requests/{id}/confirm(id=${request.id})}" method="post"
    th:if="${request.state.name() != 'STAFF_HANDLING'}" th:attr="data-loading-message=#{loading.findingAppointment}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-4">
      <label class="form-label" for="visitReason" th:text="#{appointment.reason}">Reason</label>
      <input class="form-control" id="visitReason" name="visitReason"
        th:value="${request.currentRevision.visitReason}" required>
    </div>
    <div class="mb-4">
      <label class="form-label" for="duration" th:text="#{appointment.duration}">Duration</label>
      <select class="form-select" id="duration" name="duration">
        <option th:each="d : ${ {15,30,45,60} }" th:value="${d}"
          th:selected="${d == request.currentRevision.durationMinutes}" th:text="#{appointment.duration.minutes(${d})}">15 minutes</option>
      </select>
    </div>
    <div class="mb-4" th:if="${!#lists.isEmpty(request.currentRevision.availabilityWindows)}">
      <span class="form-label" th:text="#{appointment.preferredIntervals}">Preferred interval</span>
      <ul class="mb-0">
        <li th:each="window : ${request.currentRevision.availabilityWindows}">
          <span th:if="${window.applicableDate}" th:text="${@clinicDateTime.formatDate(window.applicableDate)}">Tuesday</span>
          <span th:unless="${window.applicableDate}" th:text="${window.dayOfWeek}">2</span>
          <span th:text="${@clinicDateTime.formatTime(window.startTime)}">1:00 PM</span>
          <span aria-hidden="true" th:text="${'–'}">–</span>
          <span th:text="${@clinicDateTime.formatTime(window.endTime)}">5:00 PM</span>
        </li>
      </ul>
    </div>
    <button class="btn btn-primary" type="submit" th:text="#{appointment.offer.find}">Find one appointment</button>
  </form>

  <form class="form-card" th:action="@{/my/scheduling/requests/{id}/revise(id=${request.id})}" method="post"
    th:attr="data-loading-message=#{loading.interpreting}">
    <div class="section-heading">
      <h2 th:text="#{appointment.revise.title}">Revise request</h2>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-4">
      <label class="form-label" for="revisedSourceText" th:text="#{appointment.request.text}">Tell us what your pet needs</label>
      <textarea class="form-control" id="revisedSourceText" name="sourceText" minlength="10" maxlength="2000"
        required th:text="${request.currentRevision.sourceText}"></textarea>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" id="revisedConsent" type="checkbox" name="consent" value="true">
      <label class="form-check-label" for="revisedConsent" th:text="#{appointment.request.consent.short}">I consent to automated interpretation.</label>
    </div>
    <button class="btn btn-outline-primary" type="submit" th:text="#{appointment.revise}">Revise</button>
  </form>

  <form class="button-row" th:action="@{/my/scheduling/requests/{id}/withdraw(id=${request.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-outline-danger" type="submit" th:text="#{appointment.request.cancel}">Cancel request</button>
  </form>
</body>
</html>
