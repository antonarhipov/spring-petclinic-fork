<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">
<body>
  <h2 th:text="#{appointment.review.title}">Review your request</h2>
  <p th:if="${request.state.name() == 'STAFF_HANDLING'}" th:text="#{appointment.staff.handling}">Our staff will help with this request.</p>
  <form th:action="@{/my/scheduling/requests/{id}/confirm(id=${request.id})}" method="post" th:if="${request.state.name() != 'STAFF_HANDLING'}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label><span th:text="#{appointment.reason}">Reason</span> <input name="visitReason" th:value="${request.currentRevision.visitReason}" required></label>
    <label>Duration <select name="duration"><option th:each="d : ${ {15,30,45,60} }" th:value="${d}" th:text="${d}" th:selected="${d == request.currentRevision.durationMinutes}">15</option></select></label>
    <button type="submit" th:text="#{appointment.offer.find}">Find one appointment</button>
  </form>
  <form th:action="@{/my/scheduling/requests/{id}/revise(id=${request.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Revise request <textarea name="sourceText" minlength="10" maxlength="2000" required th:text="${request.currentRevision.sourceText}"></textarea></label>
    <label><input type="checkbox" name="consent" value="true"> <span th:text="#{appointment.request.consent.short}">I consent to automated interpretation.</span></label>
    <button type="submit" th:text="#{appointment.revise}">Revise</button>
  </form>
</body>
</html>
