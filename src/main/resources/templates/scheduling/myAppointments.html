<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>

  <h2 th:text="'My Appointments'">My Appointments</h2>

  <div th:if="${message}" class="alert alert-success">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th th:text="'When'">When</th>
        <th th:text="'Pet'">Pet</th>
        <th th:text="'Vet / Summary'">Vet / Summary</th>
        <th th:text="'Status'">Status</th>
        <th th:text="'Actions'">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${scheduleItems}" th:classappend="${item.actionable} ? 'table-warning' : ''">
        <td th:if="${item.when != null}" th:text="${#temporals.format(item.when, 'yyyy-MM-dd HH:mm')}">2026-08-26 09:00</td>
        <td th:if="${item.when == null}" class="text-muted" th:text="'—'">—</td>
        <td th:text="${item.petName != null ? item.petName : '-'}">Leo</td>
        <td th:text="${item.vetOrSummary != null ? item.vetOrSummary : '-'}">James Carter</td>
        <td>
          <span class="badge" th:classappend="${item.badgeClass}" th:text="${item.statusLabel}">Booked</span>
        </td>
        <td>
          <!-- Appointment row: Details + Cancel -->
          <th:block th:if="${item.kind.name() == 'APPOINTMENT'}">
            <a th:href="@{__${item.detailUrl}__}" class="btn btn-sm btn-info" th:text="'Details'">Details</a>
            <form th:if="${item.cancelUrl != null}" th:action="@{__${item.cancelUrl}__}" method="post" style="display:inline;">
              <button type="submit" class="btn btn-sm btn-outline-danger ms-1"
                      onclick="return confirm('Are you sure you want to cancel this appointment?');"
                      th:text="'Cancel'">Cancel</button>
            </form>
          </th:block>
          <!-- Request row: View + Cancel request -->
          <th:block th:if="${item.kind.name() == 'REQUEST'}">
            <a th:href="@{__${item.detailUrl}__}" class="btn btn-sm btn-info" th:text="'View'">View</a>
            <form th:if="${item.cancelUrl != null}" th:action="@{__${item.cancelUrl}__}" method="post" style="display:inline;">
              <button type="submit" class="btn btn-sm btn-outline-danger ms-1"
                      onclick="return confirm('Are you sure you want to cancel this request?');"
                      th:text="'Cancel request'">Cancel request</button>
            </form>
          </th:block>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(scheduleItems)}">
        <td colspan="5" class="text-center text-muted" th:text="'You have no appointments or scheduling requests yet.'">You have no appointments or scheduling requests yet.</td>
      </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <a th:href="@{/my-profile}" class="btn btn-secondary" th:text="'Back to My Profile'">Back to My Profile</a>
  </div>

</body>
</html>
