<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>

  <h2 th:text="'My Upcoming Appointments'">My Upcoming Appointments</h2>

  <div th:if="${message}" class="alert alert-success">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th th:text="'Date &amp; Time'">Date &amp; Time</th>
        <th th:text="'Pet'">Pet</th>
        <th th:text="'Veterinarian'">Veterinarian</th>
        <th th:text="'Reason'">Reason</th>
        <th th:text="'Status'">Status</th>
        <th th:text="'Actions'">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="appt : ${appointments}">
        <td th:text="${#temporals.format(appt.startTime, 'yyyy-MM-dd HH:mm') + ' - ' + #temporals.format(appt.endTime, 'HH:mm')}">2026-08-26 09:00 - 09:30</td>
        <td th:text="${appt.pet != null ? appt.pet.name : '-'}">Leo</td>
        <td th:text="${appt.vet != null ? (appt.vet.firstName + ' ' + appt.vet.lastName) : '-'}">James Carter</td>
        <td th:text="${appt.reason}">Annual Checkup</td>
        <td>
          <span class="badge bg-primary" th:text="${appt.status}">BOOKED</span>
        </td>
        <td>
          <a th:href="@{/my-appointments/__${appt.id}__}" class="btn btn-sm btn-info" th:text="'Details'">Details</a>
          <form th:action="@{/my-appointments/__${appt.id}__/cancel}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-sm btn-outline-danger ms-1"
                    onclick="return confirm('Are you sure you want to cancel this appointment?');"
                    th:text="'Cancel'">Cancel</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(appointments)}">
        <td colspan="6" class="text-center text-muted" th:text="'You have no upcoming appointments scheduled.'">You have no upcoming appointments scheduled.</td>
      </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <a th:href="@{/my-profile}" class="btn btn-secondary" th:text="'Back to My Profile'">Back to My Profile</a>
  </div>

</body>
</html>
