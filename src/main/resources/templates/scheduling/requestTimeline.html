<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'my-profile')}">

<body>

  <h2><span th:text="#{requestTimeline}">Request Timeline</span> (Request #<span th:text="${requestId}">1</span>)</h2>

  <div th:if="${#lists.isEmpty(auditRecords)}" class="alert alert-info" role="alert">
    <span th:text="#{noTimelineEvents}">No timeline events recorded.</span>
  </div>

  <table th:if="${not #lists.isEmpty(auditRecords)}" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{date}">Date</th>
        <th th:text="#{event}">Event</th>
        <th th:text="#{actor}">Actor</th>
        <th th:text="#{reason}">Reason</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${auditRecords}">
        <td th:text="${r.occurredAt}">2026-08-27T10:00:00Z</td>
        <td><span class="badge bg-secondary" th:text="${r.eventType}">REQUEST_SUBMITTED</span></td>
        <td th:text="${r.actorUsername}">owner1</td>
        <td th:text="${r.reasonCode}">-</td>
      </tr>
    </tbody>
  </table>

  <div class="mt-4">
    <a th:href="@{/scheduling/requests/{id}(id=${requestId})}" class="btn btn-secondary" th:text="#{backToRequest}">Back to Request</a>
  </div>

</body>
</html>
