<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owner')}">
<body>
<h2 th:text="#{scheduling.suggestion.title}">Request a suggestion</h2>
<form th:action="@{/owner/scheduling-requests/{id}/suggestions(id=${request.id})}" method="post">
<input type="hidden" name="expectedVersion" th:value="${request.version}"/>
<button type="submit" th:text="#{scheduling.suggestion.request}">Request suggestion</button>
</form>
</body>
</html>
