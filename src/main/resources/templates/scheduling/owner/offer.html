<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owner')}">
<body>
<h2 th:text="#{scheduling.offer.title}">Suggested appointment</h2>
<p th:text="${veterinarianName}">Veterinarian</p>
<p th:text="${offer.startAt}">start</p>
<p th:text="${offer.endAt}">end</p>
<div id="hold-status" th:attr="data-expires-at=${hold.expiresAt},data-clinic-zone=${clinicZone}">
<p><span th:text="#{scheduling.offer.expiresAtLabel}">Hold expires at</span>
   <strong id="hold-expiry-exact" th:text="${hold.expiresAt}">expires</strong></p>
<p><span th:text="#{scheduling.offer.countdownLabel}">Time remaining</span>
   <strong id="hold-countdown" th:text="#{scheduling.offer.countdownPlaceholder}">--:--</strong></p>
<p id="hold-warning" class="alert alert-warning" hidden th:text="#{scheduling.offer.warningMessage}">Less than two minutes remain.</p>
<p id="hold-expired-message" class="alert alert-danger" hidden th:text="#{scheduling.offer.expiredMessage}">This offer has expired.</p>
</div>
<form id="accept-form" th:action="@{/owner/scheduling-requests/{id}/offers/{offerId}/accept(id=${request.id},offerId=${offer.id})}" method="post">
<input type="hidden" name="expectedVersion" th:value="${request.version}"/>
<button id="accept-button" type="submit" th:text="#{scheduling.offer.accept}">Accept</button>
</form>
<form th:action="@{/owner/scheduling-requests/{id}/offers/{offerId}/reject(id=${request.id},offerId=${offer.id})}" method="post"
      data-offer-reject="true">
<input type="hidden" name="expectedVersion" th:value="${request.version}"/>
<div id="reject-step-1">
<button type="button" id="reject-start-button" th:text="#{scheduling.offer.reject}">This time does not work</button>
</div>
<div id="reject-step-2" hidden>
<p th:text="#{scheduling.offer.rejectConfirm}">Decline this time? After you confirm, you cannot undo the rejection.</p>
<label th:text="#{scheduling.offer.reject.reasonLabel}">Reason (optional)</label>
<input type="text" name="reason" id="reject-reason"/>
<button type="submit" id="reject-confirm-button" th:text="#{scheduling.offer.reject.confirmButton}">Confirm decline</button>
<button type="button" id="reject-cancel-button" th:text="#{scheduling.offer.reject.cancelButton}">Cancel</button>
</div>
</form>
<p id="hold-next-actions" hidden>
<a th:href="@{/owner/scheduling-requests/{id}/suggestion(id=${request.id})}" th:text="#{scheduling.offer.requestAnother}">Request another suggestion</a>
</p>
<p>
<a th:href="@{/owner/scheduling-requests/{id}/revise-request(id=${request.id})}" th:text="#{scheduling.revise.availability}">Revise availability or duration</a>
</p>
<script th:src="@{/resources/js/offer-rejection.js}"></script>
<script th:src="@{/resources/js/offer-countdown.js}"></script>
</body>
</html>
