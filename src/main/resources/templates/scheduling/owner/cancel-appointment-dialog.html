<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>
  <h2 th:text="#{scheduling.owner.appointment.cancel}">Cancel</h2>
  <form method="post" th:action="@{/owner/appointments/{id}/cancel(id=${appointment.id})}" th:object="${form}">
    <textarea th:field="*{reason}"></textarea>
    <button type="submit" th:text="#{scheduling.owner.appointment.confirmCancel}">Confirm</button>
  </form>
</body>
</html>
