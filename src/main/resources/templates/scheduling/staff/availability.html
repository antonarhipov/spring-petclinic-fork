<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>
  <h2 th:text="#{scheduling.staff.availability.title}">Availability</h2>
  <p th:text="#{scheduling.staff.availability.zone(${policy.zoneId})}">Zone</p>
  <form method="post" th:action="@{/staff/availability/leave}" th:object="${form}">
    <input type="hidden" th:field="*{expectedVersion}"/>
    <label th:text="#{scheduling.staff.availability.vet}">Vet</label>
    <input th:field="*{veterinarianId}"/>
    <label th:text="#{scheduling.staff.availability.startDate}">Start</label>
    <input type="date" th:field="*{startLocalDate}"/>
    <label th:text="#{scheduling.staff.availability.endDate}">End</label>
    <input type="date" th:field="*{endLocalDate}"/>
    <button type="submit" th:text="#{scheduling.staff.availability.addLeave}">Add leave</button>
  </form>
  <form method="post" th:action="@{/staff/availability/closures}" th:object="${form}">
    <input type="hidden" th:field="*{expectedVersion}"/>
    <label th:text="#{scheduling.staff.availability.startDate}">Start</label>
    <input type="date" th:field="*{startLocalDate}"/>
    <label th:text="#{scheduling.staff.availability.endDate}">End</label>
    <input type="date" th:field="*{endLocalDate}"/>
    <button type="submit" th:text="#{scheduling.staff.availability.addClosure}">Add closure</button>
  </form>
</body>
</html>
