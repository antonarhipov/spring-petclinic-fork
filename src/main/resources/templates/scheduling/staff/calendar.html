<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>
  <h2 th:text="#{scheduling.staff.calendar.title}">Calendar</h2>
  <table>
    <tr th:each="appointment : ${appointments}">
      <td th:text="${appointment.status}">CONFIRMED</td>
      <td><a th:href="@{/staff/appointments/{id}(id=${appointment.id})}" th:text="#{scheduling.staff.calendar.open}">Open</a></td>
    </tr>
  </table>
</body>
</html>
