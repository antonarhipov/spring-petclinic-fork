<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'scheduling')}">
<body>
  <nav th:replace="~{fragments/staff-navigation :: staffNav('queue')}"></nav>
  <h2 th:text="#{scheduling.queue.title}">Staff queue</h2>
  <table>
    <tr th:each="item : ${items}">
      <td th:text="${item.priority}">NORMAL</td>
      <td th:text="${item.reasonCode}">reason</td>
      <td><a th:href="@{/staff/queue/{id}(id=${item.id})}" th:text="#{scheduling.queue.open}">Open</a></td>
    </tr>
  </table>
</body>
</html>
