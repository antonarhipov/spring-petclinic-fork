<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>
  <h2 th:text="#{scheduling.staff.appointment.correction}">Correction</h2>
  <form method="post" th:action="@{/staff/appointments/{id}/correction(id=${appointment.id})}" th:object="${form}">
    <input th:field="*{targetStatus}"/>
    <textarea th:field="*{note}"></textarea>
    <button type="submit" th:text="#{scheduling.staff.appointment.save}">Save</button>
  </form>
</body>
</html>
