<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>

  <h2 th:text="'My Appointment Details'">My Appointment Details</h2>

  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>
        <span th:text="'Appointment Details'">Appointment Details</span>
      </span>
      <span th:class="'badge ' + (${appointment.status.name() == 'BOOKED'} ? 'bg-primary' : (${appointment.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary'))"
            th:text="${appointment.status}">BOOKED</span>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <p><strong th:text="'Pet:'">Pet:</strong> <span th:text="${appointment.pet.name}">Leo</span> (<span th:text="${appointment.pet.type}">dog</span>)</p>
          <p><strong th:text="'Veterinarian:'">Veterinarian:</strong> <span th:text="${appointment.vet.firstName + ' ' + appointment.vet.lastName}">James Carter</span></p>
          <p><strong th:text="'Reason:'">Reason:</strong> <span th:text="${appointment.reason}">Annual Checkup</span></p>
        </div>
        <div class="col-md-6">
          <p><strong th:text="'Date:'">Date:</strong> <span th:text="${#temporals.format(appointment.startTime, 'yyyy-MM-dd')}">2026-08-26</span></p>
          <p><strong th:text="'Time:'">Time:</strong> <span th:text="${#temporals.format(appointment.startTime, 'HH:mm') + ' - ' + #temporals.format(appointment.endTime, 'HH:mm')}">09:00 - 09:30</span></p>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${appointment.status.name() == 'BOOKED'}" class="mb-4">
    <form th:action="@{/my-appointments/__${appointment.id}__/cancel}" method="post" style="display:inline;">
      <button type="submit" class="btn btn-danger"
              onclick="return confirm('Are you sure you want to cancel this appointment? This action cannot be undone.');"
              th:text="'Cancel This Appointment'">Cancel This Appointment</button>
    </form>
  </div>

  <a th:href="@{/my-appointments}" class="btn btn-secondary" th:text="'Back to My Appointments'">Back to My Appointments</a>

</body>
</html>
