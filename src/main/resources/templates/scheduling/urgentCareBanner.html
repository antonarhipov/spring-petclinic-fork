<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
  <div th:fragment="urgentCareBanner" class="alert alert-warning mb-4" role="alert" id="urgent-care-banner" style="border-left: 5px solid #d9534f;">
    <div class="d-flex align-items-center">
      <div class="me-3">
        <span class="fa fa-ambulance fa-2x text-danger" aria-hidden="true"></span>
      </div>
      <div>
        <h5 class="alert-heading text-danger mb-1"><strong th:text="'Urgent & Emergency Care Notice'">Urgent & Emergency Care Notice</strong></h5>
        <p class="mb-0" th:utext="'If your pet is experiencing a life-threatening medical emergency (e.g., collapse, severe bleeding, difficulty breathing, poisoning, or seizures), &lt;strong&gt;do not wait for an online appointment&lt;/strong&gt;. Please call our 24/7 Emergency Line immediately at &lt;strong&gt;(555) 123-PETS&lt;/strong&gt; or proceed to the nearest Emergency Veterinary Hospital.'">
        </p>
      </div>
    </div>
  </div>
</body>
</html>
