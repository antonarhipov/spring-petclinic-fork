<!DOCTYPE html>
<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title>PetClinic :: Smart Appointment Scheduling</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" role="navigation">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/}"><span></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#public-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="public-navbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a th:class="${menu == 'home' ? 'nav-link active' : 'nav-link'}" th:href="@{/}">
              <span class="fa fa-home"></span> Home
            </a>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="nav-link" th:href="@{/auth/login}">
              <span class="fa fa-sign-in"></span> Login
            </a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('OWNER')">
            <a class="nav-link" th:href="@{/owner/dashboard}">
              <span class="fa fa-user"></span> Owner Dashboard
            </a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('STAFF')">
            <a class="nav-link" th:href="@{/staff/calendar/week}">
              <span class="fa fa-calendar"></span> Staff Calendar
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="container xd-container mt-4">
      <th:block th:insert="${template}" />
      <div th:replace="~{fragments/branding :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
