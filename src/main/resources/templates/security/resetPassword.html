<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'accounts')}" xmlns:th="https://www.thymeleaf.org">
<body>
  <h2 th:text="'Reset Password'">Reset Password</h2>

  <p><span th:text="'Reset password for user: '">Reset password for user: </span><strong th:text="${account.username}">username</strong></p>

  <form th:action="@{/staff/accounts/{id}/reset-password(id=${account.id})}" method="post" class="form-horizontal">
    <div class="form-group row mb-3">
      <label for="temporaryPassword" class="col-sm-2 col-form-label" th:text="'Temporary Password'">Temporary Password</label>
      <div class="col-sm-10">
        <input type="password" id="temporaryPassword" name="temporaryPassword" class="form-control" required />
      </div>
    </div>
    <div class="form-group row">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-warning" th:text="'Reset Password'">Reset Password</button>
        <a th:href="@{/staff/accounts}" class="btn btn-secondary" th:text="'Cancel'">Cancel</a>
      </div>
    </div>
  </form>
</body>
</html>
