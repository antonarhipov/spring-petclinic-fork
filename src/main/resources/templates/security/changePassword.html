<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <h2 th:text="'Change Password'">Change Password</h2>
  <p class="text-muted" th:text="'You are required to change your password before proceeding.'">You are required to change your password before proceeding.</p>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}">
    Error changing password.
  </div>

  <form th:action="@{/change-password}" method="post" class="form-horizontal" style="max-width: 400px;">
    <div class="form-group mb-3">
      <label for="newPassword" class="form-label" th:text="'New Password'">New Password</label>
      <input type="password" id="newPassword" name="newPassword" class="form-control" autofocus required />
    </div>

    <div class="form-group mb-3">
      <label for="confirmPassword" class="form-label" th:text="'Confirm Password'">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required />
    </div>

    <div class="form-group mb-3">
      <button type="submit" class="btn btn-primary" th:text="'Update Password'">Update Password</button>
    </div>
  </form>

</body>

</html>
