<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'change-password')}">

<body>

  <div class="row">
    <div class="col-md-6 offset-md-3">
      <h2 th:text="#{changePassword}">Change Password</h2>

      <div class="alert alert-warning" role="alert">
        <span th:text="#{passwordChangeRequiredMessage}">You must change your password before continuing.</span>
      </div>

      <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Error message</span>
      </div>

      <form th:action="@{/change-password}" method="post">
        <div class="form-group mb-3">
          <label for="oldPassword" th:text="#{oldPassword}">Current Password</label>
          <input type="password" id="oldPassword" name="oldPassword" class="form-control" required autofocus />
        </div>
        <div class="form-group mb-3">
          <label for="newPassword" th:text="#{newPassword}">New Password</label>
          <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="8" required />
        </div>
        <div class="form-group mb-3">
          <label for="confirmPassword" th:text="#{confirmPassword}">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{changePassword}">Change Password</button>
      </form>
    </div>
  </div>

</body>
</html>
