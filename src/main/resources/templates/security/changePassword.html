<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'home')}" xmlns:th="https://www.thymeleaf.org">
<body>
  <h2 th:text="'Change Password'">Change Password</h2>
  <p class="text-muted" th:text="'You must change your password before continuing.'">You must change your password before continuing.</p>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
    Error changing password.
  </div>
  <form th:action="@{/change-password}" method="post" class="form-horizontal">
    <div class="form-group row mb-3">
      <label for="newPassword" class="col-sm-2 col-form-label" th:text="'New Password'">New Password</label>
      <div class="col-sm-10">
        <input type="password" id="newPassword" name="newPassword" class="form-control" autofocus required />
      </div>
    </div>
    <div class="form-group row mb-3">
      <label for="confirmPassword" class="col-sm-2 col-form-label" th:text="'Confirm Password'">Confirm Password</label>
      <div class="col-sm-10">
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required />
      </div>
    </div>
    <div class="form-group row">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary" th:text="'Change Password'">Change Password</button>
      </div>
    </div>
  </form>
</body>
</html>
