<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'calendar')}">
<body>
<h2 th:text="#{calendar}">Calendar</h2>

<th:block th:if="${calendarView != null}">
<div class="calendar-header mb-3 d-flex align-items-center justify-content-between">
	<div class="btn-group">
		<a th:if="${pickingRequestId == null}" th:href="@{/staff/calendar(date=${calendarView.prevDateIso})}" class="btn btn-outline-secondary" th:text="#{previous}">Previous</a>
		<a th:if="${pickingRequestId != null}" th:href="@{/staff/calendar/pick/{requestId}(requestId=${pickingRequestId},date=${calendarView.prevDateIso})}" class="btn btn-outline-secondary" th:text="#{previous}">Previous</a>
		<a th:if="${pickingRequestId == null}" th:href="@{/staff/calendar(date=${calendarView.todayIso})}" class="btn btn-outline-secondary" th:text="#{calendar}">Today</a>
		<a th:if="${pickingRequestId != null}" th:href="@{/staff/calendar/pick/{requestId}(requestId=${pickingRequestId},date=${calendarView.todayIso})}" class="btn btn-outline-secondary" th:text="#{calendar}">Today</a>
		<a th:if="${pickingRequestId == null}" th:href="@{/staff/calendar(date=${calendarView.nextDateIso})}" class="btn btn-outline-secondary" th:text="#{next}">Next</a>
		<a th:if="${pickingRequestId != null}" th:href="@{/staff/calendar/pick/{requestId}(requestId=${pickingRequestId},date=${calendarView.nextDateIso})}" class="btn btn-outline-secondary" th:text="#{next}">Next</a>
	</div>
	<form th:action="${pickingRequestId == null} ? @{/staff/calendar} : @{/staff/calendar/pick/{requestId}(requestId=${pickingRequestId})}" method="get" class="d-inline-flex align-items-center">
		<input type="date" name="date" th:value="${calendarView.dateIso}" th:min="${calendarView.minDateIso}" th:max="${calendarView.maxDateIso}" class="form-control" onchange="this.form.submit()" />
	</form>
</div>

<div class="mb-3">
	<strong th:text="${calendarView.date} + ' (' + ${calendarView.clinicHoursSummary} + ')'"></strong>
</div>

<table class="table table-bordered calendar-grid">
	<thead>
		<tr>
			<th th:text="#{startTime}">Time</th>
			<th th:each="col : ${calendarView.vetColumns}">
				<div class="vet-name" th:text="${col.vetName}"></div>
				<small class="text-muted" th:text="${col.specialties}"></small>
				<div class="capacity-layers small text-muted mt-1">
					<div class="layer-opening" th:text="${col.openingHoursLayer}"></div>
					<div class="layer-working" th:text="${col.effectiveBlocksLayer}"></div>
					<div class="layer-booked" th:text="${col.bookedCount} + ' (' + ${col.bookedMinutes} + 'm)'"></div>
					<div class="layer-held" th:text="${col.heldCount} + ' (' + ${col.heldMinutes} + 'm)'"></div>
					<div class="layer-free" th:text="${col.remainingCapacityMinutes} + 'm'"></div>
				</div>
			</th>
		</tr>
	</thead>
	<tbody>
		<tr th:each="row : ${calendarView.gridRows}">
			<td class="time-cell" th:text="${row.timeLabel}">09:00</td>
			<td th:each="cell : ${row.cells}" th:class="${cell.state}">
				<form th:if="${pickingRequestId != null and cell.state == 'free'}" th:action="@{/staff/calendar/pick/{requestId}(requestId=${pickingRequestId})}" method="post">
					<input type="hidden" name="vetId" th:value="${cell.vetId}" />
					<input type="hidden" name="appointmentDate" th:value="${calendarView.dateIso}" />
					<input type="hidden" name="startTime" th:value="${cell.timeLabel}" />
					<input type="hidden" name="durationMinutes" value="30" />
					<button type="submit" class="btn btn-link p-0" th:text="${cell.label}">Free</button>
				</form>
				<a th:if="${pickingRequestId == null and cell.state == 'free'}"
				   th:href="@{/staff/appointments/new(vetId=${cell.vetId},start=${calendarView.dateIso + 'T' + cell.timeLabel})}"
				   th:text="${cell.label}">Free</a>
				<span th:if="${cell.state != 'free'}" th:text="${cell.label}">Unavailable</span>
			</td>
		</tr>
	</tbody>
</table>
</th:block>

</body>
</html>
