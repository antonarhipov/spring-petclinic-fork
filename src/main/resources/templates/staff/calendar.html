<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'calendar')}">
<body><h2>Clinic calendar</h2><h3>Appointments</h3><ul><li th:each="appointment : ${appointments}" th:text="${appointment.startAt + ' - ' + appointment.status}">Appointment</li></ul><h3>Held offers</h3><ul><li th:each="offer : ${holds}" th:text="${offer.startAt}">Hold</li></ul></body>
</html>
