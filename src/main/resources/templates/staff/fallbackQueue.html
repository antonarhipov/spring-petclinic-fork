<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
	th:replace="~{fragments/layout :: layout (~{::body},'staff-fallback')}">

<body>
  <h2 th:text="#{staffFallbackQueue}">Staff Fallback Queue</h2>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${queue.empty}" class="alert alert-info" th:text="#{noStaffRequests}">No requests currently need staff assistance.</div>

  <table th:if="${!queue.empty}" class="table table-striped align-middle">
	<thead>
	  <tr><th th:text="#{priority}">Priority</th><th th:text="#{ownerAndPet}">Owner / Pet</th><th th:text="#{trigger}">Trigger</th><th th:text="#{request}">Request</th><th th:text="#{partialInterpretation}">Partial interpretation</th><th th:text="#{actions}">Actions</th></tr>
	</thead>
	<tbody>
	  <tr th:each="item : ${queue}" th:classappend="${item.suspectedEmergency} ? 'table-danger'">
		<td><strong th:if="${item.suspectedEmergency}" th:text="#{suspectedEmergency}">Suspected emergency</strong><span th:unless="${item.suspectedEmergency}" th:text="#{normalPriority}">Normal</span></td>
		<td><a th:href="@{/owners/__${item.ownerId}__}" th:text="${item.ownerName}"></a><br /><span th:text="${item.petName}"></span></td>
		<td th:text="${item.fallbackReason != null ? item.fallbackReason : 'UNSPECIFIED'}"></td>
		<td th:text="${item.freeText}"></td>
		<td><pre class="mb-0 text-wrap" th:text="${item.interpretationJson != null ? item.interpretationJson : 'None'}"></pre></td>
		<td>
		  <form th:if="${item.interpretationJson != null}" th:action="@{/staff/fallback/__${item.requestId}__/unblock}" method="post" class="mb-2">
			<button class="btn btn-sm btn-primary" type="submit" th:text="#{unblockForOwner}">Unblock for owner</button>
		  </form>
		  <a class="btn btn-sm btn-secondary" th:href="@{/owners/__${item.ownerId}__/pets/__${item.petId}__/appointments/new(requestId=${item.requestId})}" th:text="#{bookDirectly}">Book directly</a>
		</td>
	  </tr>
	</tbody>
  </table>
</body>
</html>
