<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'queue')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="#{appointment.queue.title}">Scheduling queue</p>
      <h1 th:text="#{appointment.queue.item(${item.id})}">Queue item</h1>
      <p class="page-subtitle">
        <span class="status-badge"
          th:classappend="${'status-' + #strings.toLowerCase(#strings.replace(item.state.name(), '_', '-'))}"
          th:text="${item.state}">State</span>
      </p>
    </div>
    <form th:action="@{/staff/queue/{id}/claim(id=${item.id})}" method="post"
      th:attr="data-loading-message=#{loading.claiming}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-primary" type="submit" th:text="#{appointment.queue.claim}">Claim</button>
    </form>
  </header>

  <section class="section-card">
    <div class="section-heading">
      <h2 th:text="#{appointment.requestedBy}">Requested by</h2>
    </div>
    <dl class="definition-list">
      <dt th:text="#{owner}">Owner</dt>
      <dd>
        <a th:href="@{/owners/{id}(id=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}">Owner</a>
      </dd>
      <dt th:text="#{pet}">Pet</dt>
      <dd th:text="${item.request.pet.name}">Pet</dd>
      <dt th:text="#{telephone}">Telephone</dt>
      <dd th:text="${owner.telephone}">Telephone</dd>
    </dl>
  </section>

  <form class="form-card" th:action="@{/staff/queue/{id}/interpretation(id=${item.id})}" method="post"
    th:attr="data-loading-message=#{loading.saving}">
    <div class="section-heading">
      <h2 th:text="#{appointment.interpretation.title}">Interpretation</h2>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label class="form-label" for="visitReason" th:text="#{appointment.reason}">Reason</label>
      <input class="form-control" id="visitReason" name="visitReason" required>
    </div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="duration" th:text="#{appointment.duration}">Duration</label>
        <select class="form-select" id="duration" name="duration">
          <option value="15" th:text="#{appointment.duration.15}">15</option>
          <option value="30" th:text="#{appointment.duration.30}">30</option>
          <option value="45" th:text="#{appointment.duration.45}">45</option>
          <option value="60" th:text="#{appointment.duration.60}">60</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="careType" th:text="#{appointment.careType}">Care type</label>
        <input class="form-control" id="careType" name="careType" value="GENERAL" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="specialty" th:text="#{specialty}">Specialty</label>
        <input class="form-control" id="specialty" name="specialty">
      </div>
    </div>
    <button class="btn btn-primary mt-4" type="submit" th:text="#{appointment.interpretation.save}">Save interpretation</button>
  </form>

  <section class="section-card">
    <div class="section-heading">
      <div>
        <h2 th:text="#{appointment.offer.ownerFacing}">Owner-facing offer</h2>
        <p class="item-row-meta" th:text="#{appointment.offer.ownerFacing.help}">Search for a suitable time and hold it for the owner.</p>
      </div>
    </div>
    <form th:action="@{/staff/queue/{id}/offers(id=${item.id})}" method="post"
      th:attr="data-loading-message=#{loading.findingAppointment}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-primary" type="submit" th:text="#{appointment.offer.make}">Make offer</button>
    </form>
  </section>
</body>
</html>
