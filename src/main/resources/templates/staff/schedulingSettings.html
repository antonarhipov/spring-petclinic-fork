<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'settings')}">
<body><h2>Scheduling settings</h2><form th:action="@{/staff/settings/scheduling}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Time zone <input name="zone" th:value="${settings.clinicZone}"></label><label>Horizon <input name="horizon" th:value="${settings.bookingHorizonDays}"></label><label>Notice <input name="notice" th:value="${settings.ownerMinimumNoticeMinutes}"></label><label>Hold <input name="hold" th:value="${settings.offerHoldMinutes}"></label><textarea name="guidance" th:text="${settings.urgentCareGuidance}"></textarea><button>Save</button></form></body>
</html>
