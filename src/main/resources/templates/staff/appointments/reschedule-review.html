<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{staff/layout :: layout(~{::main}, 'calendar')}">
<body>
<main>
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Review Appointment Reschedule</h4>
    </div>
    <div class="card-body">
      <p><strong>Current interval:</strong>
        <span th:text="${appointment.startAt + ' - ' + appointment.endAt}">Current interval</span>
      </p>
      <p><strong>New veterinarian:</strong>
        <span th:text="${vet != null ? vet.firstName + ' ' + vet.lastName : 'Veterinarian #' + form.vetId}">Veterinarian</span>
      </p>
      <p><strong>New interval:</strong> <span th:text="${startAt + ' - ' + endAt}">New interval</span></p>
      <p><strong>Reason category:</strong> <span th:text="${form.reasonCategory}">OWNER_REQUEST</span></p>
      <p><strong>Internal reason:</strong> <span th:text="${form.internalReason}">Reason</span></p>
      <p><strong>Owner-facing explanation:</strong> <span th:text="${form.ownerExplanation}">Explanation</span></p>

      <form th:action="@{/staff/appointments/{id}/reschedule-review(id=${appointment.id})}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{vetId}" />
        <input type="hidden" th:field="*{date}" />
        <input type="hidden" th:field="*{startTime}" />
        <input type="hidden" th:field="*{durationMinutes}" />
        <input type="hidden" th:field="*{ownerAgreementRecorded}" />
        <input type="hidden" th:field="*{agreementMedium}" />
        <input type="hidden" th:field="*{reasonCategory}" />
        <input type="hidden" th:field="*{internalReason}" />
        <input type="hidden" th:field="*{ownerExplanation}" />
        <button type="submit" class="btn btn-primary">Confirm Reschedule</button>
        <a th:href="@{/staff/appointments/{id}/reschedule(id=${appointment.id})}" class="btn btn-outline-secondary ms-2">Back to Edit</a>
      </form>
    </div>
  </div>
</main>
</body>
</html>
