<!DOCTYPE html>
<html th:replace="~{staff/layout :: layout (~{::body},'queue')}" xmlns:th="https://www.thymeleaf.org">
<body>
  <h2>Direct Book Appointment from Queue Item <span th:text="${'#' + queueItem.id}">#1</span></h2>

  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <div class="card mb-4">
    <div class="card-header bg-light"><strong>Patient Summary</strong></div>
    <div class="card-body">
      <p class="mb-2"><strong>Owner:</strong> <span th:text="${queueItem.ownerName}">George Franklin</span> (<span th:text="${queueItem.ownerTelephone}">555-1234</span>)</p>
      <p class="mb-2"><strong>Pet:</strong> <span th:text="${queueItem.petName}">Leo</span> (<span th:text="${queueItem.petType}">Cat</span>)</p>
      <div class="p-3 bg-light rounded border" th:text="${queueItem.originalProse}">Prose text</div>
    </div>
  </div>

	<form th:action="@{'/staff/queue/' + ${queueItem.id} + '/direct-book'}" th:object="${directBookForm}" method="post">
	<input type="hidden" th:field="*{expectedRequestVersion}" /><input type="hidden" th:field="*{expectedWorkflowRevision}" /><input type="hidden" th:field="*{expectedQueueVersion}" />
    <div class="card mb-4">
      <div class="card-header bg-light"><strong>Appointment Slot</strong></div>
      <div class="card-body">
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Veterinarian</label>
          <div class="col-sm-6">
            <select th:field="*{vetId}" class="form-select" required>
              <option value="">-- Select Veterinarian --</option>
              <option th:each="v : ${allVets}" th:value="${v.id}" th:text="${v.firstName + ' ' + v.lastName}"></option>
            </select>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Date</label>
          <div class="col-sm-6">
            <input type="date" th:field="*{date}" class="form-control" required />
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Start Time</label>
          <div class="col-sm-6">
            <input type="time" th:field="*{startTime}" step="900" class="form-control" required />
            <small class="text-muted">Must align to 15-minute grid.</small>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Duration</label>
          <div class="col-sm-6">
            <select th:field="*{durationMinutes}" class="form-select" required>
              <option th:each="dur : ${allowedDurations}" th:value="${dur}" th:text="${dur + ' minutes'}">30 minutes</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header bg-light"><strong>Agreement & Internal Notes</strong></div>
      <div class="card-body">
        <div class="mb-3 row">
          <div class="col-sm-offset-3 col-sm-9">
            <div class="form-check">
              <input type="checkbox" th:field="*{ownerAgreementRecorded}" class="form-check-input" id="agreementCheck" required />
              <label class="form-check-label fw-bold" for="agreementCheck">
                Confirmed Owner Agreement: The owner has explicitly agreed to this appointment slot.
              </label>
            </div>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Agreement Medium</label>
          <div class="col-sm-6">
            <select th:field="*{agreementMedium}" class="form-select" required>
              <option value="PHONE">Phone Call</option>
              <option value="IN_PERSON">In-Person at Front Desk</option>
              <option value="PORTAL_CONSENT">Owner Portal</option>
            </select>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Reason Category</label>
          <div class="col-sm-6">
            <select th:field="*{reasonCategory}" class="form-select" required>
              <option value="OWNER_REQUEST">Owner Request</option>
              <option value="CLINICAL_NEED">Clinical Need</option>
              <option value="FOLLOW_UP">Follow-up</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Internal Reason / Notes</label>
          <div class="col-sm-6">
            <textarea th:field="*{internalReason}" rows="3" class="form-control" placeholder="Reason for booking and clinical circumstances (encrypted)" required></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="mb-3 row">
      <div class="col-sm-6">
        <button type="submit" class="btn btn-primary">Review Direct Booking</button>
        <a th:href="@{'/staff/queue/' + ${queueItem.id}}" class="btn btn-secondary ms-2">Cancel</a>
      </div>
    </div>
  </form>
</body>
</html>
