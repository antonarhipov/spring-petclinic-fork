<!DOCTYPE html>
<html th:replace="~{staff/layout :: layout (~{::body},'queue')}" xmlns:th="https://www.thymeleaf.org">
<body>
  <h2>Create Assisted Offer Hold for Queue Item <span th:text="${'#' + queueItem.id}">#1</span></h2>

  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <div class="card mb-4">
    <div class="card-header bg-light"><strong>Patient & Request Summary</strong></div>
    <div class="card-body">
      <p class="mb-2"><strong>Owner:</strong> <span th:text="${queueItem.ownerName}">George Franklin</span></p>
      <p class="mb-2"><strong>Pet:</strong> <span th:text="${queueItem.petName}">Leo</span></p>
      <p class="mb-2"><strong>Preferred Vet:</strong> <span th:text="${queueItem.preferredVetName != null ? queueItem.preferredVetName : 'Any'}">Any</span></p>
    </div>
  </div>

  <form th:action="@{'/staff/queue/' + ${queueItem.id} + '/offer'}" th:object="${offerForm}" method="post">
    <div class="card mb-4">
      <div class="card-header bg-light"><strong>Offer Slot Details</strong></div>
      <div class="card-body">
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Veterinarian</label>
          <div class="col-sm-6">
            <select th:field="*{vetId}" class="form-select" required>
              <option value="">-- Select Veterinarian --</option>
              <option th:each="v : ${allVets}" th:value="${v.id}" th:text="${v.firstName + ' ' + v.lastName}"></option>
            </select>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Date</label>
          <div class="col-sm-6">
            <input type="date" th:field="*{date}" class="form-control" required />
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Start Time</label>
          <div class="col-sm-6">
            <input type="time" th:field="*{startTime}" step="900" class="form-control" required />
            <small class="text-muted">Must align to 15-minute grid.</small>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Duration</label>
          <div class="col-sm-6">
            <select th:field="*{durationMinutes}" class="form-select" required>
              <option th:each="dur : ${allowedDurations}" th:value="${dur}" th:text="${dur + ' minutes'}">30 minutes</option>
            </select>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Explanation Note</label>
          <div class="col-sm-6">
            <textarea th:field="*{explanation}" rows="2" class="form-control" placeholder="Explanation for owner why this slot was selected"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="mb-3 row">
      <div class="col-sm-6">
        <button type="submit" class="btn btn-success">Hold Offer for 10 Minutes</button>
        <a th:href="@{'/staff/queue/' + ${queueItem.id}}" class="btn btn-secondary ms-2">Cancel</a>
      </div>
    </div>
  </form>
</body>
</html>
