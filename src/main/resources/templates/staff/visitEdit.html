<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'calendar')}">
<body>

<h2 th:text="#{editVisit}">Edit visit</h2>

<form th:action="@{/staff/visits/{id}/edit(id=${visit.id})}" method="post" class="form-horizontal">
	<div class="form-group">
		<label class="col-sm-2 control-label" th:text="#{appointmentDate}">Visit date</label>
		<div class="col-sm-6">
			<input type="text" name="date" th:value="${visit.date}" readonly="readonly" class="form-control" />
		</div>
	</div>
	<div class="form-group">
		<label class="col-sm-2 control-label" th:text="#{auditReason}">Description</label>
		<div class="col-sm-6">
			<textarea name="description" rows="4" class="form-control" th:text="${visit.description}"></textarea>
		</div>
	</div>
	<div class="form-group">
		<div class="col-sm-offset-2 col-sm-10">
			<button type="submit" class="btn btn-primary" th:text="#{saveVisit}">Save visit</button>
		</div>
	</div>
</form>

</body>
</html>
