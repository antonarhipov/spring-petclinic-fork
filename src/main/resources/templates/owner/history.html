<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{owner/layout :: layout(~{::main}, 'history')}">
<body>
<main>
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><span class="fa fa-history"></span> Account History & Activity Timeline</h4>
    </div>
    <div class="card-body">
      <div th:if="${#lists.isEmpty(events)}" class="alert alert-info">
        No past activity records found.
      </div>

      <div class="table-responsive" th:unless="${#lists.isEmpty(events)}">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th style="width: 20%;">Date & Time</th>
              <th style="width: 25%;">Activity</th>
              <th style="width: 55%;">Summary</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="event : ${events}">
              <td th:text="${#temporals.format(event.occurredAt, 'yyyy-MM-dd HH:mm:ss')}">2026-08-31 09:00:00</td>
              <td>
                <span class="badge bg-secondary" th:text="${event.displayType}">EVENT_TYPE</span>
              </td>
              <td th:text="${event.summary}">Event summary text</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="mt-3">
        <a th:href="@{/owner/dashboard}" class="btn btn-outline-secondary">
          <span class="fa fa-arrow-left"></span> Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
