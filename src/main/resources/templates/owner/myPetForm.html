<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'my-profile')}">

<body>

  <h2 th:text="${petForm.id == null ? 'Add New Pet' : 'Edit Pet'}">Pet Form</h2>

  <form th:object="${petForm}" method="post" class="form-horizontal">
    <div class="form-group has-feedback">
      <div th:replace="~{fragments/inputField :: input (#{name}, 'name', 'text')}" />
      <div th:replace="~{fragments/inputField :: input (#{birthDate}, 'birthDate', 'date')}" />
      
      <div class="form-group mb-3">
        <label class="col-sm-2 control-label" th:text="#{type}">Type</label>
        <div class="col-sm-10">
          <select th:field="*{typeId}" class="form-control">
            <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}">dog</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit" th:text="${petForm.id == null ? 'Add Pet' : 'Update Pet'}">Submit</button>
      </div>
    </div>
  </form>

</body>
</html>
