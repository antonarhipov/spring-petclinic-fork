<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{owner/layout :: layout(~{::main}, 'dashboard')}">
<body>
<main>
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0"><span class="fa fa-calendar-check-o"></span> Appointment Details</h4>
      <span class="badge bg-light text-dark" th:text="${appointment.bookingState}">CONFIRMED</span>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6 mb-3">
          <h6 class="text-muted">Pet</h6>
          <p class="fs-5 font-weight-bold" th:text="${pet != null ? pet.name : 'Pet'}">Pet Name</p>
        </div>
        <div class="col-md-6 mb-3">
          <h6 class="text-muted">Veterinarian</h6>
          <p class="fs-5 font-weight-bold" th:text="${vet != null ? 'Dr. ' + vet.firstName + ' ' + vet.lastName : 'Veterinarian'}">Dr. Vet</p>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <h6 class="text-muted">Appointment Date & Time</h6>
          <p class="fs-5" th:text="${#temporals.format(appointment.startAt, 'EEEE, MMMM d, yyyy HH:mm')}">Date Time</p>
        </div>
        <div class="col-md-6 mb-3">
          <h6 class="text-muted">Duration</h6>
          <p class="fs-5" th:text="${durationMinutes + ' minutes'}">30 minutes</p>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <h6 class="text-muted">Outcome Status</h6>
          <p class="fs-6" th:text="${appointment.outcomeState}">PENDING</p>
        </div>
      </div>

      <hr />

      <div class="d-flex justify-content-between">
        <a th:href="@{/owner/dashboard}" class="btn btn-outline-secondary">
          <span class="fa fa-arrow-left"></span> Back to Dashboard
        </a>
        <a th:if="${canCancel}" th:href="@{/owner/appointments/{id}/cancel(id=${appointment.id})}" class="btn btn-outline-danger">
          <span class="fa fa-times"></span> Cancel Appointment
        </a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
