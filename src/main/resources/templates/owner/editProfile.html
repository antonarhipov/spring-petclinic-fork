<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'my-profile')}">

<body>

  <h2 th:text="#{editOwner}">Edit Owner</h2>

  <form th:object="${ownerProfileForm}" th:action="@{/my-profile/edit}" method="post" class="form-horizontal">
    <div class="form-group has-feedback">
      <div th:replace="~{fragments/inputField :: input (#{firstName}, 'firstName', 'text')}" />
      <div th:replace="~{fragments/inputField :: input (#{lastName}, 'lastName', 'text')}" />
      <div th:replace="~{fragments/inputField :: input (#{address}, 'address', 'text')}" />
      <div th:replace="~{fragments/inputField :: input (#{city}, 'city', 'text')}" />
      <div th:replace="~{fragments/inputField :: input (#{telephone}, 'telephone', 'text')}" />
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" type="submit" th:text="#{updateOwner}">Update Owner</button>
      </div>
    </div>
  </form>

</body>
</html>
