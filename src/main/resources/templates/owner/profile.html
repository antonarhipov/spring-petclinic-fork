<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{owner/layout :: layout (~{::body}, 'profile')}">
<body>
  <h2>My Profile</h2>
  
  <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

  <div class="card mt-3">
    <div class="card-header bg-light">
      <h5 class="mb-0">Contact Information</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/owner/profile}" th:object="${form}" method="post">
        <div class="mb-3 row">
          <label for="firstName" class="col-sm-3 col-form-label">First name</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" maxlength="30" required />
            <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
          </div>
        </div>
        <div class="mb-3 row">
          <label for="lastName" class="col-sm-3 col-form-label">Last name</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" maxlength="30" required />
            <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
          </div>
        </div>
        <div class="mb-3 row">
          <label for="address" class="col-sm-3 col-form-label">Address</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="address" th:field="*{address}" required />
			<div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
          </div>
        </div>
        <div class="mb-3 row">
          <label for="city" class="col-sm-3 col-form-label">City</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="city" th:field="*{city}" required />
			<div class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
          </div>
        </div>
        <div class="mb-3 row">
          <label for="telephone" class="col-sm-3 col-form-label">Telephone</label>
          <div class="col-sm-9">
			<input type="text" class="form-control" id="telephone" th:field="*{telephone}" pattern="[0-9]{10}" required />
			<div class="text-danger" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></div>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-9 offset-sm-3">
			<button type="submit" class="btn btn-primary">Save Profile</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
