<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{owner/layout :: layout(~{::main}, 'dashboard')}">
<body>
<main>
  <div class="card shadow-sm">
    <div class="card-header bg-warning text-dark">
      <h4 class="mb-0"><span class="fa fa-times-circle"></span> Reject Appointment Offer</h4>
    </div>
    <div class="card-body">
      <p>Are you sure you want to decline this appointment offer? The held slot will be released and excluded from your future matching options.</p>
      
      <div class="alert alert-secondary" th:if="${offer != null}">
        <strong>Offer Time:</strong> <span th:text="${#temporals.format(offer.startAt, 'EEEE, MMMM d, yyyy HH:mm')}">Time</span>
      </div>

      <form th:action="@{/owner/requests/{reqId}/offers/{offerId}/reject(reqId=${requestId}, offerId=${offer.id})}" method="post">
        <div class="mb-3">
          <label class="form-label">Reason for declining (optional)</label>
          <input type="text" name="reason" class="form-control" placeholder="e.g. Inconvenient time, prefer mornings..." />
        </div>

        <div class="d-flex justify-content-between">
          <a th:href="@{/owner/requests/{reqId}/offers/{offerId}(reqId=${requestId}, offerId=${offer.id})}" class="btn btn-outline-secondary">Go Back</a>
          <button type="submit" class="btn btn-danger"><span class="fa fa-times"></span> Reject Offer</button>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
