<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{owner/layout :: layout(~{::main}, 'dashboard')}">
<body>
<main>
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><span class="fa fa-refresh"></span> Revise Request Text</h4>
    </div>
    <div class="card-body">
      <p class="text-muted">Describe your updated visit need and scheduling preferences in free-form English.</p>
      
      <form th:action="@{/owner/requests/{id}/text-revision(id=${requestId})}" th:object="${form}" method="post">
        <div class="mb-3">
          <label class="form-label font-weight-bold">Appointment Description</label>
          <textarea class="form-control" th:field="*{prose}" rows="4" minlength="10" maxlength="2000" placeholder="e.g. Leo needs a checkup next Tuesday afternoon after 2 PM..." required></textarea>
          <div class="form-text">Between 10 and 2000 characters.</div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" th:field="*{aiConsent}" id="aiConsentCheck">
          <label class="form-check-label" for="aiConsentCheck">
            I consent to using AI assistance to extract scheduling details from my description. (If unchecked, clinic staff will handle your request manually).
          </label>
        </div>

        <div class="d-flex justify-content-between">
          <a th:href="@{/owner/requests/{id}(id=${requestId})}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary"><span class="fa fa-paper-plane"></span> Submit Revision</button>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
