<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>
	<h2 th:text="#{login.signIn}">Please sign in</h2>
	<form th:action="@{/login}" method="post">
		<div th:if="${param.error}" th:text="#{login.invalid}">Invalid username or password.</div>
		<div class="mb-3">
			<label for="username" th:text="#{login.username}">Username</label>
			<input type="text" id="username" name="username" class="form-control"/>
		</div>
		<div class="mb-3">
			<label for="password" th:text="#{login.password}">Password</label>
			<input type="password" id="password" name="password" class="form-control"/>
		</div>
		<button type="submit" class="btn btn-primary" th:text="#{login.submit}">Sign in</button>
	</form>
</body>
</html>
