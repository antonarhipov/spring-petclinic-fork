<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>
	<h2 th:text="#{account.credential.title}">One-time password</h2>
	<p th:text="#{account.credential.once}">This password is shown once. It expires in seven days and must be changed at first use.</p>
	<p>
		<span th:text="#{login.username}">Username</span>:
		<strong th:text="${username}">username</strong>
	</p>
	<p>
		<span th:text="#{login.password}">Password</span>:
		<strong th:text="${oneTimePassword}">password</strong>
	</p>
	<p th:if="${expiresAt}" th:text="#{account.credential.expires(${expiresAt})}">Expires</p>
	<a class="btn btn-primary" th:href="@{/owners/{id}(id=${ownerId})}" th:text="#{account.credential.done}">Back to owner</a>
</body>
</html>
