<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">
<body>
	<h2 th:text="#{account.password.change.title}">Change password</h2>
	<p th:text="#{account.password.change.help}">Choose a new password of at least six characters.</p>
	<form th:action="@{/account/password/change}" th:object="${passwordChangeForm}" method="post">
		<div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:text="#{account.password.change.error}">
			The password could not be changed.
		</div>
		<div class="mb-3">
			<label for="currentPassword" th:text="#{account.password.current}">Current password</label>
			<input type="password" id="currentPassword" name="currentPassword" class="form-control" autocomplete="current-password"/>
		</div>
		<div class="mb-3">
			<label for="newPassword" th:text="#{account.password.new}">New password</label>
			<input type="password" id="newPassword" name="newPassword" class="form-control" autocomplete="new-password"/>
		</div>
		<div class="mb-3">
			<label for="confirmPassword" th:text="#{account.password.confirm}">Confirm password</label>
			<input type="password" id="confirmPassword" name="confirmPassword" class="form-control" autocomplete="new-password"/>
		</div>
		<button type="submit" class="btn btn-primary" th:text="#{account.password.change.submit}">Change password</button>
	</form>
</body>
</html>
