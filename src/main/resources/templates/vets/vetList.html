<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="#{staff.workspace}">Clinic workspace</p>
      <h1 th:text="#{vets}">Veterinarians</h1>
      <p class="page-subtitle" th:text="#{vets.subtitle}">Clinic veterinarians and their specialties.</p>
    </div>
  </header>
  <div class="data-card responsive-table">
    <table id="vets" class="table table-striped table-hover">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{specialties}">Specialties</th>
          <th th:text="#{appointment.nav.availability}">Vet schedules</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="vet : ${listVets}">
          <td><strong th:text="${vet.firstName + ' ' + vet.lastName}">Veterinarian</strong></td>
          <td>
            <span th:each="specialty : ${vet.specialties}" class="status-badge me-1"
              th:text="${specialty.name}">Specialty</span>
            <span th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">None</span>
          </td>
          <td>
            <a class="btn btn-outline-primary" th:href="@{/staff/availability#vet-{id}(id=${vet.id})}"
              th:text="#{appointment.availability.manage}">Manage vet schedules</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav class="pagination-modern" th:if="${totalPages > 1}" th:aria-label="#{pages}">
    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/vets.html?page=' + ${i}}" th:text="${i}">1</a>
      <span class="active" th:unless="${currentPage != i}" th:text="${i}" aria-current="page">1</span>
    </span>
  </nav>
</body>
</html>
