<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="#{staff.workspace}">Clinic workspace</p>
      <h1 th:text="#{owners}">Owners</h1>
    </div>
    <a class="btn btn-outline-primary" th:href="@{/owners/find}" th:text="#{findOwners}">Find owners</a>
  </header>
  <div class="data-card responsive-table">
    <table id="owners" class="table table-striped table-hover">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{address}">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${listOwners}">
          <td><a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}">Owner</a></td>
          <td th:text="${owner.address}">Address</td>
          <td th:text="${owner.city}">City</td>
          <td th:text="${owner.telephone}">Telephone</td>
          <td th:text="${#strings.listJoin(owner.pets, ', ')}">Pets</td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav class="pagination-modern" th:if="${totalPages > 1}" th:aria-label="#{pages}">
    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/owners?page=' + ${i}}" th:text="${i}">1</a>
      <span class="active" th:unless="${currentPage != i}" th:text="${i}" aria-current="page">1</span>
    </span>
  </nav>
</body>
</html>
