<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>
  <header class="page-header" th:object="${owner}">
    <div>
      <p class="page-eyebrow" th:text="#{ownerInformation}">Owner information</p>
      <h1 th:text="*{firstName + ' ' + lastName}">Owner name</h1>
    </div>
    <div class="button-row mt-0">
      <a th:href="@{__${owner.id}__/edit}" class="btn btn-outline-primary" th:text="#{editOwner}">Edit owner</a>
      <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add new pet</a>
    </div>
  </header>

  <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}">Success</div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

  <section class="section-card" th:object="${owner}">
    <dl class="definition-list">
      <dt th:text="#{address}">Address</dt>
      <dd th:text="*{address}">Address</dd>
      <dt th:text="#{city}">City</dt>
      <dd th:text="*{city}">City</dd>
      <dt th:text="#{telephone}">Telephone</dt>
      <dd th:text="*{telephone}">Telephone</dd>
    </dl>
  </section>

  <section class="section-card">
    <div class="section-heading">
      <h2 th:text="#{petsAndVisits}">Pets and visits</h2>
      <span class="status-badge" th:text="${#lists.size(owner.pets)}">0</span>
    </div>
    <div class="item-list">
      <article class="item-row" th:each="pet : ${owner.pets}">
        <div class="item-row-main">
          <h3 class="item-row-title" th:text="${pet.name}">Pet name</h3>
          <p class="item-row-meta"
            th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd') + ' · ' + pet.type}">Pet details</p>
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" th:text="#{editPet}">Edit pet</a>
        </div>
        <div>
          <p class="page-eyebrow" th:text="#{visitHistory}">Visit history</p>
          <ul class="list-unstyled mb-0" th:if="${!#lists.isEmpty(pet.visits)}">
            <li class="mb-2" th:each="visit : ${pet.visits}">
              <strong th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}">Visit date</strong>
              <span th:text="${visit.description}">Description</span>
            </li>
          </ul>
          <span class="item-row-meta" th:if="${#lists.isEmpty(pet.visits)}" th:text="#{visits.empty}">No visits recorded.</span>
        </div>
      </article>
    </div>
  </section>
</body>
</html>
