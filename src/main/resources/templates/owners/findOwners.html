<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body>
  <header class="page-header">
    <div>
      <p class="page-eyebrow" th:text="#{staff.workspace}">Clinic workspace</p>
      <h1 th:text="#{findOwners}">Find owners</h1>
      <p class="page-subtitle" th:text="#{owner.search.subtitle}">Search clinic records by the owner's last name.</p>
    </div>
    <a class="btn btn-primary" th:href="@{/owners/new}" th:text="#{addOwner}">Add owner</a>
  </header>
  <form th:object="${owner}" th:action="@{/owners}" method="get" class="form-card" id="search-owner-form"
    th:attr="data-loading-message=#{loading.searching}">
    <div class="mb-3">
      <label class="form-label" for="lastName" th:text="#{lastName}">Last name</label>
      <input class="form-control" th:field="*{lastName}" size="30" maxlength="80">
      <div class="field-error" th:if="${#fields.hasAnyErrors()}" role="alert">
        <span th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</span>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" th:text="#{findOwner}">Find owner</button>
  </form>
</body>
</html>
