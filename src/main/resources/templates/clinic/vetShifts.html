<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'clinic')}" xmlns:th="https://www.thymeleaf.org">
<body>
  <h2 th:text="'Vet Weekly Shifts'">Vet Weekly Shifts</h2>

  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <a class="nav-link" th:href="@{/staff/clinic/settings}" th:text="'Settings'">Settings</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/staff/clinic/parts-of-day}" th:text="'Parts of Day'">Parts of Day</a>
    </li>
    <li class="nav-item">
      <a class="nav-link active" th:href="@{/staff/clinic/vets/1/shifts}" th:text="'Vet Shifts'">Vet Shifts</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/staff/clinic/vets/1/exceptions}" th:text="'Vet Exceptions'">Vet Exceptions</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/staff/clinic/closures}" th:text="'Clinic Closures'">Clinic Closures</a>
    </li>
  </ul>

  <div class="mb-3">
    <label for="vetSelector" class="form-label" th:text="'Select Veterinarian:'">Select Veterinarian:</label>
    <select id="vetSelector" class="form-select" onchange="location = this.value;">
      <option th:each="v : ${vets}"
              th:value="@{/staff/clinic/vets/{id}/shifts(id=${v.id})}"
              th:text="${v.firstName + ' ' + v.lastName}"
              th:selected="${v.id == vet.id}">
        James Carter
      </option>
    </select>
  </div>

  <h3 th:text="${'Weekly Shifts for ' + vet.firstName + ' ' + vet.lastName}">Weekly Shifts</h3>

  <table class="table table-striped mb-4">
    <thead>
      <tr>
        <th th:text="'Day of Week'">Day of Week</th>
        <th th:text="'Start Time'">Start Time</th>
        <th th:text="'End Time'">End Time</th>
        <th th:text="'Actions'">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="shift : ${shifts}">
        <td th:text="${shift.dayOfWeek}">MONDAY</td>
        <td th:text="${shift.startTime}">08:00</td>
        <td th:text="${shift.endTime}">17:00</td>
        <td>
          <form th:action="@{/staff/clinic/vets/{vetId}/shifts/{shiftId}/delete(vetId=${vet.id},shiftId=${shift.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-sm btn-danger" th:text="'Delete'">Delete</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(shifts)}">
        <td colspan="4" th:text="'No weekly shifts configured for this vet.'">No weekly shifts configured for this vet.</td>
      </tr>
    </tbody>
  </table>

  <h4 th:text="'Add Weekly Shift'">Add Weekly Shift</h4>
  <form th:action="@{/staff/clinic/vets/{vetId}/shifts/new(vetId=${vet.id})}" method="post" class="form-inline row g-3 align-items-center">
    <div class="col-auto">
      <select class="form-select" name="dayOfWeek" required>
        <option th:each="dow : ${daysOfWeek}" th:value="${dow}" th:text="${dow}">MONDAY</option>
      </select>
    </div>
    <div class="col-auto">
      <input type="time" class="form-control" name="startTime" required />
    </div>
    <div class="col-auto">
      <input type="time" class="form-control" name="endTime" required />
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary" th:text="'Add Shift'">Add Shift</button>
    </div>
  </form>
</body>
</html>
