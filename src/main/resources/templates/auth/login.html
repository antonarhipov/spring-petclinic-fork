<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'login')}">
<body>
  <h2 th:text="#{appointment.login.title}">Sign in</h2>
  <p th:if="${param.error}" th:text="#{appointment.login.error}">Sign in failed. Please try again.</p>
  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label><span th:text="#{appointment.login.username}">Username</span> <input name="username" required></label>
    <label><span th:text="#{appointment.login.password}">Password</span> <input type="password" name="password" required></label>
    <button type="submit" th:text="#{appointment.login.submit}">Sign in</button>
  </form>
</body>
</html>
