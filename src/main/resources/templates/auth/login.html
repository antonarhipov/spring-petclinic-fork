<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'login')}">
<body>
  <section class="auth-shell">
    <div class="auth-card">
      <p class="page-eyebrow" th:text="#{app.name}">PetClinic</p>
      <h1 th:text="#{appointment.login.title}">Sign in</h1>
      <p class="page-subtitle" th:text="#{appointment.login.subtitle}">Access your appointments and clinic tools.</p>

      <div class="alert alert-danger mt-4" role="alert" th:if="${param.error}"
        th:text="#{appointment.login.error}">Sign in failed. Please try again.</div>
      <div class="alert alert-warning mt-4" role="alert" th:if="${param.expired}"
        th:text="#{appointment.login.expired}">Your session expired. Please sign in again.</div>

      <form class="mt-4" th:action="@{/login}" method="post" th:attr="data-loading-message=#{loading.signIn}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label class="form-label" for="username" th:text="#{appointment.login.username}">Username</label>
          <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password" th:text="#{appointment.login.password}">Password</label>
          <input class="form-control" id="password" type="password" name="password" autocomplete="current-password"
            required>
        </div>
        <button class="btn btn-primary" type="submit" th:text="#{appointment.login.submit}">Sign in</button>
      </form>
    </div>
  </section>
</body>
</html>
