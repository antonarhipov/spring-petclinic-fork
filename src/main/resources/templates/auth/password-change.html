<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{auth/layout :: layout (~{::body}, 'password-change')}">
<body>
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm mt-4">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">
            <span class="fa fa-lock"></span> Change Password
          </h4>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
            An error occurred.
          </div>
          <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}">
            Password changed successfully.
          </div>

          <div th:if="${passwordChangeRequired}" class="alert alert-warning">
            <strong><span class="fa fa-exclamation-triangle"></span> Action Required:</strong>
            You are logged in with a temporary password. You must set a permanent password before accessing the clinic portal.
          </div>

          <form th:action="@{/auth/password-change}" method="post">
            <div class="mb-3">
              <label for="currentPassword" class="form-label">Current / Temporary Password</label>
              <input type="password" class="form-control" id="currentPassword" name="currentPassword" required autocomplete="current-password" />
            </div>

            <div class="mb-3">
              <label for="newPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password" />
              <div class="form-text">Must be at least 8 characters long.</div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password" />
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary">
                <span class="fa fa-check"></span> Update Password
              </button>
            </div>
          </form>

          <div class="mt-3 text-center">
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
              <button type="submit" class="btn btn-link text-muted btn-sm">
                <span class="fa fa-sign-out"></span> Log Out
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
