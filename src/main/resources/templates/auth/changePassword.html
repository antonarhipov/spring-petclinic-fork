<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'password')}">
<body>
  <section class="auth-shell">
    <div class="auth-card">
      <p class="page-eyebrow" th:text="#{appointment.password.security}">Account security</p>
      <h1 th:text="#{appointment.password.title}">Change password</h1>
      <p class="page-subtitle" th:text="#{appointment.password.subtitle}">Choose a new password before continuing.</p>
      <div class="alert alert-danger mt-4" role="alert" th:if="${error}" th:text="${error}">Password error</div>
      <form class="mt-4" th:action="@{/password/change}" method="post"
        th:attr="data-loading-message=#{loading.saving}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label class="form-label" for="new-password" th:text="#{appointment.password.new}">New password</label>
          <input class="form-control" id="new-password" type="password" name="password" minlength="6"
            autocomplete="new-password" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirmation" th:text="#{appointment.password.confirm}">Confirm password</label>
          <input class="form-control" id="confirmation" type="password" name="confirmation" minlength="6"
            autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" type="submit" th:text="#{appointment.password.submit}">Change password</button>
      </form>
    </div>
  </section>
</body>
</html>
