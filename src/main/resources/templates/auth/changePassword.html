<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'password')}">
<body>
  <h2 th:text="#{appointment.password.title}">Change password</h2>
  <p th:if="${error}" th:text="${error}">Password error</p>
  <form th:action="@{/password/change}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label><span th:text="#{appointment.password.new}">New password</span> <input type="password" name="password" minlength="6" required></label>
    <label><span th:text="#{appointment.password.confirm}">Confirm password</span> <input type="password" name="confirmation" minlength="6" required></label>
    <button type="submit" th:text="#{appointment.password.submit}">Change password</button>
  </form>
</body>
</html>
