database=h2
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/${database},classpath:db/demo/${database}

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Session
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never

# Spring AI
spring.ai.retry.max-attempts=1
spring.ai.ollama.chat.options.model=gemma4:latest
spring.ai.ollama.chat.model=gemma4:latest
spring.ai.ollama.init.pull-model-strategy=never

# Scheduling deadlines and executor
petclinic.scheduling.llm-deadline=10s
petclinic.scheduling.match-deadline=5s
petclinic.scheduling.executor.core-pool-size=2
petclinic.scheduling.executor.max-pool-size=4
petclinic.scheduling.executor.queue-capacity=50
petclinic.account.bootstrap-enabled=false
# Deployed startup requires these; do not commit secrets. Demo/test profiles enable bootstrap instead.
# petclinic.account.initial-staff.username=
# petclinic.account.initial-staff.password=

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
