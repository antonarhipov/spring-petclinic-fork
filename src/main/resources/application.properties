# database init, supports mysql too
database=h2

# Flyway
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/${database}

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE
# Show the full structured LLM interpretation (including the extracted time windows) in the
# console so it can be verified against the owner's free-text request. Only this logger is set
# to DEBUG, so no other debug output is produced.
logging.level.org.springframework.samples.petclinic.scheduling.ai.AppointmentInterpreter=DEBUG

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

spring.ai.ollama.chat.model=gemma4:latest

# The HTTP client for the (slow) local Ollama chat call is configured in code, see
# org.springframework.samples.petclinic.scheduling.ai.AiHttpClientConfig. It forces the JDK
# HttpClient with a generous read timeout so long "thinking" inferences are not aborted with
# io.netty.handler.timeout.ReadTimeoutException (and avoids reactor-netty's macOS DNS resolver
# error on this path). Property-based configuration proved unreliable here.

