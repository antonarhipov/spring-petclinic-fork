# database init, supports mysql and postgres too via profiles
database=h2
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/${database}

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Security bootstrap
petclinic.security.bootstrap-staff.username=admin
petclinic.security.bootstrap-staff.password=admin12345

# Scheduling configuration
petclinic.scheduling.clinic-zone-id=UTC

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

spring.ai.ollama.chat.model=gemma4:latest
