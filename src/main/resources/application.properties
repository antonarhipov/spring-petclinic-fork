# Database
database=h2
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/${database}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Scheduling
scheduling.clinic.zone=Europe/Amsterdam
scheduling.booking-horizon-days=90
scheduling.owner-minimum-notice-minutes=120
scheduling.offer-hold-minutes=10
scheduling.offer-expiration-delay-ms=60000
scheduling.sign-in.max-attempts=5
scheduling.sign-in.lock-minutes=15
server.servlet.session.timeout=30m

# Local AI. Production environments should provide SPRING_AI_OLLAMA_BASE_URL.
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${SPRING_AI_OLLAMA_CHAT_MODEL:ministral-3:14b}
# Interpretation is bounded extraction; automatic model thinking can exhaust the request deadline.
spring.ai.ollama.chat.think=FALSE
spring.ai.ollama.chat.num-predict=128
spring.ai.ollama.chat.keep-alive=10m
timefold.solver.termination.spent-limit=5s

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.samples.petclinic.scheduling=INFO
logging.level.org.springframework.samples.petclinic.scheduling.ai=DEBUG
logging.level.org.springframework.samples.petclinic.scheduling.request.SchedulingRequestService=DEBUG
logging.level.org.springframework.samples.petclinic.scheduling.solver=DEBUG
logging.level.ai.timefold.solver=DEBUG
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
