# Database & Flyway
spring.datasource.url=jdbc:h2:file:./data/petclinic;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Web & Thymeleaf
spring.thymeleaf.mode=HTML
spring.messages.basename=messages/messages
spring.messages.use-code-as-default-message=true
spring.web.resources.cache.cachecontrol.max-age=12h

# Security Key Ring Defaults
petclinic.security.active-key-id=k2026-01
petclinic.security.key-ring.k2026-01=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Exclude legacy Timefold autoconfiguration incompatible with Boot 4 EntityScanner removal
spring.autoconfigure.exclude=ai.timefold.solver.spring.boot.autoconfigure.TimefoldSolverAutoConfiguration

# Logging
logging.level.org.springframework=INFO
