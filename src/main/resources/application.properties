# Database & Flyway
spring.datasource.url=jdbc:h2:file:./data/petclinic
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Web & Thymeleaf
spring.thymeleaf.mode=HTML
spring.messages.basename=messages/messages
spring.messages.use-code-as-default-message=true
spring.web.resources.cache.cachecontrol.max-age=12h

# Security key ring must be supplied by the runtime environment. Example:
# PETCLINIC_SECURITY_ACTIVE_KEY_ID=k2026-01
# PETCLINIC_SECURITY_KEY_RING_K2026_01=<32-byte key as hex or Base64>

# Logging
logging.level.org.springframework=INFO

petclinic.ollama.model=ministral-3:14b
