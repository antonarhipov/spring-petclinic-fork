# database init, Flyway managed
database=h2
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/${database}
petclinic.demo-seeding=true
timefold.solver.termination.spent-limit=2s
spring.ai.ollama.chat.model=ministral-3:14b
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=250ms
spring.ai.retry.backoff.max-interval=2s
petclinic.ai.interpretation.timeout=30s

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.samples.petclinic.scheduling.solver=DEBUG
logging.level.ai.timefold.solver=DEBUG
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
