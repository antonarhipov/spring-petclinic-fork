spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
petclinic.jobs.enabled=false

petclinic.security.active-key-id=k2026-01
petclinic.security.key-ring.k2026-01=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

spring.messages.basename=messages/messages
spring.messages.use-code-as-default-message=true
