          depends_on: [task-1.3, task-1.7, task-2.2, task-2.4]
          complexity: "L"
          validation: "Use deterministic fake adapters and an injected clock to test concurrent tenth/eleventh dispatches, retry instant, declined consent, exact outbound fields, strict schema binding, persistence-before-dispatch, timeout/failure/rejection fallback, polling idempotency, and ignored late tokens."
          risk: "Review hotspot 3: text replacement, absolute deadlines, executor rejection, restart, and late AI/solver results converge on conditional operation-token commits."

        - id: task-2.6
          name: "Validate, clarify, review, and confirm interpretations"
          description: "Implement the deterministic interpretation-validation order, catalog and clinical-routing outcomes, duration/window normalization, clarification loop, unrestricted-window confirmation, urgency and dispute fallback, allowlisted owner edits, review UI, confirmation-time weekday expansion, and immutable horizon snapshot transition to MATCHING."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/interpretation validation/confirmation services, owner review forms/templates, and tests"
