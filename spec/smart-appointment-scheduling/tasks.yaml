          depends_on: [task-1.6, task-1.7, task-2.1]
          complexity: "L"
          validation: "Test ownership concealment, 1/2000-code-point boundaries after canonical normalization, concurrent duplicate intake, different-pet intake, pre-routing snapshot capture, unsupported-language no-AI fallback, and English consent state."

        - id: task-2.5
          name: "Dispatch one consented AI interpretation"
          description: "Implement exact-version consent, rolling-hour dispatch ledger, bounded AI executor, persisted operation tokens/deadlines, strict allowlisted Spring AI/Ollama input/output DTOs, post-commit one-attempt dispatch, status polling, and conditional AI_UNAVAILABLE or late-result handling."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/interpretation consent, rate-limit, adapter, executor, operation, polling, and fake-adapter tests"
          covers:
            acs: [UC3-AC12, UC3-AC13, UC3-AC14, UC3-AC15, UC3-AC16, UC3-AC17, UC3-AC18, UC3-AC19, UC3-AC20, UC3-AC21, UC3-AC22, UC3-AC23, UC3-AC24, UC3-AC25, UC3-AC26, UC3-AC27, UC3-AC28, UC3-AC53, UC3-AC59]
