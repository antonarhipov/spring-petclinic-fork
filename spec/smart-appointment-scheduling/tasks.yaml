      tasks:
        - id: task-1.1
          name: "Align Java 21 builds and scheduling dependencies"
          description: "Upgrade Maven, Gradle, and both CI workflows to Java 21; add equivalent Spring Security, Flyway, Spring AI 2.0.1 Ollama, and Timefold 2.5.0 dependencies; reserve the Maven workflow for the later database matrix."
          artifact: "pom.xml, build.gradle, .github/workflows/maven-build.yml, .github/workflows/gradle-build.yml"
          covers:
            acs: []
            rules: [RULE-9, RULE-11]
          depends_on: []
          complexity: "M"
          validation: "Resolve both dependency graphs on Java 21, run the existing unit suite through both wrappers, and verify the Gradle workflow does not define the database matrix."

        - id: task-1.2
          name: "Replace SQL initialization with Flyway baselines"
          description: "Disable Spring SQL initialization; create vendor-specific V1 migrations reproducing every legacy table and sample-data semantic; add V2-or-later scheduling schema migrations, indexes, foreign keys, guard rows, and uniqueness constraints; document and test explicit V1 baselining and unknown-schema refusal."
          artifact: "src/main/resources/db/migration/{h2,mysql,postgres}/V1__legacy_baseline.sql, V2__smart_appointment_scheduling.sql, application profile properties, migration tests"
          covers:
            acs: []
            rules: [RULE-9, RULE-11]
          depends_on: [task-1.1]
          complexity: "L"
          validation: "Compare fresh Flyway databases with the current legacy schema/data, verify an explicitly baselined legacy schema migrates to scheduling, and verify an unknown non-empty schema fails."
          risk: "Review hotspot 1: three vendor-specific V1 scripts must reproduce current schema and sample-data semantics on fresh and explicitly baselined databases."

        - id: task-1.3
          name: "Add shared scheduling persistence and command kernel"
          description: "Map the account, clinic settings, request, operation, reservation, rejection, claim, appointment, conflict, notification, and audit aggregates; add optimistic versions, absolute deadlines, typed outcomes, centralized transition policies, injected Clock/ZoneId support, and one global pessimistic lock coordinator in Owner-Pet-Vet-Request-Appointment-Reservation order."
          artifact: "src/main/java/org/springframework/samples/petclinic/{security,scheduling,system}/ domain, repository, transition, time, and locking types with repository tests"
          covers:
            acs: []
            rules: [RULE-1, RULE-2, RULE-3, RULE-4, RULE-5, RULE-6, RULE-7, RULE-10, RULE-12]
          depends_on: [task-1.2]
          complexity: "L"
          validation: "Run JPA mapping tests, transition-policy tests, deadline/time-zone tests, and opposing lock-order tests proving backward-only lock acquisition and typed stale outcomes."
          risk: "Review hotspot 2: replacement, cancellation, reservation, reschedule, and cleanup must share centralized ordered locks and terminal-state checks."

        - id: task-1.4
          name: "Establish form login and the route matrix"
          description: "Configure form login, CSRF, session-fixation protection, forced-password-change routing, role-aware navigation, public liveness/readiness, STAFF protection for existing /owners routes, authentication for owner self-service, and localized login/security messages."
          artifact: "src/main/java/org/springframework/samples/petclinic/security web configuration and handlers; Thymeleaf layout/login fragments; MVC security tests"
          covers:
            acs: [UC1-AC1, UC1-AC2, UC1-AC3, UC1-AC4, UC1-AC5, UC1-AC17, UC1-AC30, UC1-AC31, UC1-AC38, UC1-AC39, UC1-AC47]
            rules: [RULE-8, RULE-10, UC1-RULE1, UC1-RULE3, UC1-RULE6]
          depends_on: [task-1.1, task-1.2, task-1.3]
          complexity: "L"
          validation: "Run an explicit public/owner/staff MockMvc route matrix, navigation assertions, CSRF rejection tests, forced-change redirects, session rotation checks, and all pre-existing controller tests under security."
          risk: "Review hotspot 5: form login and CSRF retrofit every legacy controller test and direct route, so the public/owner/staff matrix must remain explicit."

        - id: task-1.5
          name: "Implement account administration and session invalidation"
          description: "Implement normalized unique accounts, BCrypt temporary and replacement passwords, provisioning, bootstrap/demo initialization, profile conflict checks, password reset/change, login lockout, unlock, rename, deactivation, final-staff protection, immutable role/Owner links, audit hooks, and post-commit invalidation of every registered session."
          artifact: "src/main/java/org/springframework/samples/petclinic/security account services, repositories, forms, controllers, initializers, session registry integration, templates, and tests"
          covers:
            acs: [UC1-AC14, UC1-AC15, UC1-AC16, UC1-AC18, UC1-AC19, UC1-AC20, UC1-AC21, UC1-AC22, UC1-AC23, UC1-AC24, UC1-AC25, UC1-AC26, UC1-AC27, UC1-AC28, UC1-AC29, UC1-AC32, UC1-AC33, UC1-AC34, UC1-AC35, UC1-AC36, UC1-AC37, UC1-AC40, UC1-AC41, UC1-AC42, UC1-AC43, UC1-AC44, UC1-AC45, UC1-AC46]
            rules: [RULE-1, RULE-7, RULE-8, RULE-10, RULE-12, UC1-RULE2, UC1-RULE3, UC1-RULE5]
          depends_on: [task-1.4]
          complexity: "L"
          validation: "Test case-insensitive and Owner-link uniqueness, password boundaries, lockout deadlines with an injected clock, concurrent final-staff mutations, idempotent bootstrap/demo behavior, startup refusal, identity immutability, audit safety, and multi-session invalidation."

        - id: task-1.6
          name: "Add owner self-service and safe veterinarian projections"
          description: "Add ownership-scoped profile and pet forms using allowlisted DTOs, preserve deletion and reassignment prohibitions, return indistinguishable 404 results for foreign resources, and replace owner-visible veterinarian entity serialization with name/specialty-only HTML and JSON projections."
          artifact: "src/main/java/org/springframework/samples/petclinic/owner self-service services/controllers/forms; vet projections; owner templates and MVC tests"
          covers:
            acs: [UC1-AC6, UC1-AC7, UC1-AC8, UC1-AC9, UC1-AC10, UC1-AC11, UC1-AC12, UC1-AC13]
            rules: [RULE-8, UC1-RULE4, UC1-RULE6]
          depends_on: [task-1.4, task-1.5]
          complexity: "M"
          validation: "Verify owned profile/pet updates, foreign and absent identifiers both return 404, deletion/reassignment fields cannot bind, and owner HTML/JSON never contains schedules or availability."

        - id: task-1.7
          name: "Create privacy-safe audit and notification infrastructure"
          description: "Add append-only safe audit metadata, keyed notification persistence, allowlisted metadata serializers, transactional writer APIs, sensitive-field-safe toString/exception/logging conventions, and tests that prohibit mutable or sensitive payloads."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/support audit and notification infrastructure; logging configuration; privacy tests"
          covers:
            acs: [UC7-AC13, UC7-AC14, UC7-AC25]
            rules: [RULE-7, RULE-8, RULE-10, UC7-RULE2, UC7-RULE7]
          depends_on: [task-1.2, task-1.3]
          complexity: "M"
          validation: "Persist and query immutable database-neutral audit metadata, reject non-allowlisted values, verify audit retention has no delete path, and capture logs to prove passwords and request text are absent."

      checkpoint:
        id: cp-1
        description: "Review the platform migration and secure application boundary before scheduling workflows are built on it."
        criteria:
          - "Fresh and explicitly baselined H2 databases reach the scheduling schema; unknown non-empty schemas fail."
          - "The public/owner/staff route matrix, CSRF, forced password change, lockout, and session invalidation tests pass."
          - "Shared time, transition, operation, reservation, privacy, and global lock-order primitives are covered by focused tests."
          - "Both Java 21 builds run the accumulated unit and MVC suites."

