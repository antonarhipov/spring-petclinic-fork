          depends_on: [task-1.3, task-1.4, task-1.7]
          complexity: "M"
          validation: "Test defaults and every settings boundary atomically, invalid-zone startup, absence of a zone form field, optimistic-stale edits, localized urgent guidance, and grid/horizon behavior around zone and DST boundaries."

        - id: task-2.2
          name: "Implement veterinarian catalog and effective availability"
          description: "Add active/deactivated veterinarian and specialty commands, assignments, cache eviction, weekly split shifts, modified and extra hours, inclusive leave and closures, strict range validation, precedence resolution, unique-offset DST conversion, and idempotent demo schedules."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/calendar catalog/calendar services, repositories, staff MVC, cache hooks, and tests"
          covers:
            acs: [UC2-AC20, UC2-AC21, UC2-AC22, UC2-AC23, UC2-AC24, UC2-AC25, UC2-AC26, UC2-AC27, UC2-AC28, UC2-AC29, UC2-AC30, UC2-AC31, UC2-AC32, UC2-AC33, UC2-AC34, UC2-AC35, UC2-AC36, UC2-AC37, UC2-AC38, UC2-AC39, UC2-AC46, UC2-AC47, UC2-AC49]
            rules: [RULE-2, RULE-5, RULE-7, UC2-RULE2, UC2-RULE3, UC2-RULE6]
          depends_on: [task-2.1]
          complexity: "L"
          validation: "Run catalog/deactivation/cache tests and table-driven effective-availability tests for precedence, adjacency normalization, inclusive dates, overlap/grid rejection, invalid DST offsets, eligibility, and idempotent demo initialization."

        - id: task-2.3
          name: "Preserve pinned bookings and render the staff calendar"
          description: "Evaluate calendar reductions against locked BOOKED appointments, require a reason for conflicts, persist unresolved conflict records without moving appointments, distinguish appointments/guided holds/staff offers in the calendar projection, and combine captured request values with live calendar inputs."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/calendar conflict service and calendar projection; staff templates and transaction tests"
          covers:
            acs: [UC2-AC40, UC2-AC41, UC2-AC42, UC2-AC43, UC2-AC44, UC2-AC45]
            rules: [RULE-2, RULE-3, RULE-4, RULE-5, RULE-7, UC2-RULE3, UC2-RULE4, UC2-RULE5]
          depends_on: [task-1.3, task-2.1, task-2.2]
          complexity: "M"
          validation: "Verify conflict reasons and durable flags, pinned intervals, calendar entry labels, rollback atomicity, stable request snapshots after settings edits, and live calendar refresh for later attempts."

        - id: task-2.4
          name: "Create normalized scheduling requests"
          description: "Add owner request intake and status pages, localized urgent guidance and language defaults, canonical Unicode/line-ending normalization, owned-pet locking, one-nonterminal-request enforcement, captured interpretation settings, unsupported-language fallback entry, and valid-English AWAITING_CONSENT persistence."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/request intake service/controller/forms/projections; owner templates and tests"
          covers:
            acs: [UC3-AC1, UC3-AC2, UC3-AC3, UC3-AC4, UC3-AC5, UC3-AC6, UC3-AC7, UC3-AC8, UC3-AC9, UC3-AC10, UC3-AC11, UC3-AC54, UC3-AC55]
