      tasks:
        - id: task-2.1
          name: "Implement clinic settings and time configuration"
          description: "Bind and validate the application-owned clinic ZoneId, expose one versioned settings form for duration bounds, owner/staff horizons, guided-hold duration, named periods, and urgent-care contact details, and calculate future grid and exclusive local-date boundaries from the injected clock."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/config settings/time services, staff controller/forms/templates, and tests"
          covers:
            acs: [UC2-AC1, UC2-AC2, UC2-AC3, UC2-AC4, UC2-AC5, UC2-AC6, UC2-AC7, UC2-AC8, UC2-AC9, UC2-AC10, UC2-AC11, UC2-AC12, UC2-AC13, UC2-AC14, UC2-AC15, UC2-AC16, UC2-AC17, UC2-AC18, UC2-AC19, UC2-AC48, UC2-AC50, UC2-AC51]
