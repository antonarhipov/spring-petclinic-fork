          complexity: "L"
          validation: "Race replacement/cancellation against fake AI completion and held resources; verify token invalidation, complete cleanup, new snapshot capture, terminal/staff-state rejection without mutation, idempotent cancellation, and staff-claim removal."

      checkpoint:
        id: cp-2
        description: "Review a complete clinic-calendar and owner-interpretation slice before solver and staff scheduling are added."
        criteria:
