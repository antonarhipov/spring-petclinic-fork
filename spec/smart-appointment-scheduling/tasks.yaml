tasks:
  feature: "smart-appointment-scheduling"
  review_verdict: "PASS"
  organizing_principle: "risk_first then feature_slice"

  assumptions:
    - "The validated review reports PASS with no unresolved findings; all five review risk hotspots are attached to implementation tasks."
    - "New code follows the existing package-by-domain style under org.springframework.samples.petclinic, with scheduling, security, and system support packages introduced where the current codebase has no suitable boundary."
    - "Each implementation task includes focused automated tests for its acceptance criteria; phase checkpoints run the accumulated suite rather than deferring testing to the final phase."
    - "Docker is required for the MySQL and PostgreSQL migration/concurrency matrix; H2 and focused MVC/unit tests remain runnable without Docker."
    - "No acceptance criterion is deferred."

  decisions:
    - id: dec-1
      decision: "Establish the load-bearing migration, time, locking, security, and privacy boundaries before completing use-case slices."
      reason: "The review identifies five cross-cutting hotspots that would otherwise force rework across every scheduling flow."
      alternatives: ["Start with owner intake as a walking skeleton", "Implement one phase per use case"]
    - id: dec-2
      decision: "Use vendor-specific Flyway V1 legacy baselines and V2 scheduling migrations before adding JPA mappings that require the new schema."
      reason: "Flyway must become the sole schema owner while preserving fresh-database sample semantics and requiring an explicit V1 baseline for verified legacy databases."
      alternatives: ["Retain schema.sql for legacy tables", "Enable automatic Flyway baselining"]
    - id: dec-3
      decision: "Centralize state transitions, global lock acquisition, operation tokens, hard feasibility, reservations, audit, and notifications as shared application-service primitives."
      reason: "Guided matching, staff fallback, appointment lifecycle, recovery, and concurrent cleanup must use identical transactional rules."
      alternatives: ["Implement workflow logic independently in each controller", "Use database-vendor-specific interval locking"]
    - id: dec-4
      decision: "Let Maven own the H2, MySQL, and PostgreSQL migration/concurrency matrix while Gradle runs the equivalent unit and MVC security suite."
      reason: "This preserves build equivalence without duplicating the expensive database matrix."
      alternatives: ["Duplicate the database matrix in both builds", "Run database verification only against H2"]
    - id: dec-5
      decision: "Hand off from risk-first foundations to feature slices after phase-1 security and persistence checks pass."
      reason: "After the shared boundaries are proven, UC2 through UC7 can be implemented in dependency order with end-to-end feedback at every checkpoint."
      alternatives: ["Continue with a fully layered implementation", "Delay all UI work until every backend component exists"]

  coverage_deferrals: []

  phases:
