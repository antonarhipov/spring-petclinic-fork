          depends_on: [task-2.1, task-2.2, task-2.3, task-2.5]
          complexity: "L"
          validation: "Run table-driven validation-order tests for every schema/issue/catalog outcome, duration and exclusion boundaries, remaining/resolved clarifications, owner-edit allowlists, clinical disputes, and confirmation at time-zone/grid/date boundaries."
          risk: "Review hotspot 4: confirmation and first fallback use different anchor instants but one captured settings model, so horizon materialization must be tested at zone and grid boundaries."

        - id: task-2.7
          name: "Invalidate edited requests and cancel atomically"
          description: "Implement separate confirmed-fact edit, original-text replacement, and owner-cancellation commands that use global locks, invalidate active operations, release guided reservations, clear derived interpretation/suggestion/rejection/horizon state, capture replacement settings, reject late lifecycle replacement, and remove staff claims on cancellation."
          artifact: "src/main/java/org/springframework/samples/petclinic/scheduling/request edit/replacement/cancellation services, forms, and concurrency tests"
