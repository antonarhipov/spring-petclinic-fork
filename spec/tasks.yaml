          risk: "MINOR-1 (dec-3): RULE-11 fixes timefold.solver.solve.duration=1s (a total spent-limit) while RA-32 wording says '1 s unimproved'; no AC asserts which termination, so the configured spent-limit is used and the nuance is non-blocking."
          validation: "SolverHardConstraintTests asserts the model shape (single planning entity, one slot planning variable over enumerated feasible slots) and that a violating candidate is rejected at BOTH enumeration and as a Timefold hard constraint (AC-73), then one rejection per hard constraint: outside opening hours (AC-74), spanning a vet working-block gap after exceptions/leave/closures (AC-75), overlapping an appointment or active hold (AC-76), vet missing the required specialty (AC-77), inside an excluded window (AC-78), outside the preferred∪allowed union (AC-79), beyond the horizon (AC-80), overlapping the same owner's other confirmed appointment/hold across pets (AC-81). SolverRankingTests orders three candidates proving preferred-window(medium) > preferred-vet(soft) > earliest(per-minute) under HardMediumSoft (AC-82) and asserts start times on the 15-minute grid with the 1s synchronous budget inside the locked transaction (AC-83). HorizonBoundaryTests asserts three points: strictly-within allowed (AC-104), last-horizon-day allowed (AC-105), beyond-horizon excluded for owner+solver (AC-106)."
        - id: task-2.5
          name: "Suggestion/hold lifecycle: re-validation, accept concurrency, no-slots→staff + concurrency integration test"
          description: "Complete the suggestion/hold lifecycle over the per-vet-locked confirm from phase-1 (RULE-8/RULE-10/RULE-11/RULE-19). Enumerate feasible slots, rank with Timefold, offer the top slot, move to Suggestion offered and record the hold on the request row (held_vet_id/held_start/held_duration); union appointment rows with requests whose hold fields are set for calendar/overlap checks so a held slot is offered to no other owner; keep the hold with no timer, releasing only on accept/ask-again/route-to-staff/edit/abandon, when superseded, or when staff release it (AC-58/AC-59/AC-60). If no feasible slots remain move to With staff (no dead end) on confirm/ask-again (AC-61). On viewing a Suggestion offered request whose hold is invalid, immediately produce the next suggestion or move to With staff with an explanatory notice — never an error page (AC-62). Accept re-validates inside the SELECT … FOR UPDATE transaction re-checking overlaps; if valid confirm+Accepted, if the slot was lost show the next suggestion or staff hand-off with an explanation, never an error page (AC-63/AC-64). Enforce at most one active request per pet via a nullable active_pet_id column set only while non-terminal plus a unique index, surfacing a second creation as a refusal not a stack trace (RULE-9, AC-22/AC-23). Two owners can never confirm the same vet-and-time (AC-65). Add a concurrency integration test on the real DB with two simultaneous transactions and pinned isolation (AC-141 partial; full sweep in phase-5)."
          artifact: "src/main/java/.../scheduling/request/{SuggestionService,HoldService,ActiveRequestGuard}.java; src/test/java/.../scheduling/{SuggestionLifecycleTests,AcceptConcurrencyIntegrationTests}.java"
