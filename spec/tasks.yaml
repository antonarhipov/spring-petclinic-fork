    - id: phase-2
      name: "Owner guided flow thickened — UC-1 extensions, UC-2, UC-3"
      description: "Thicken the skeleton into the full owner experience: async single-thread @Async interpretation with fresh-transaction apply, abandon-discard and startup recovery behind a meta-refresh page; interpretation outcome routing, content derivation, duration clamp, preferred-vet resolution and the prompt contract with an ollama parse/retry/timeout contract test; the window model, part-of-day tokens and the two-hour lead boundary; the full Timefold hard/soft constraints and owner horizon bounds; the suggestion/hold lifecycle with re-validation, accept concurrency and no-slots→staff; and ask-for-another-option with scope chips, the ruled-out list, rejection events, edit-clears and route-to-staff. Demo: an owner can wait on the auto-refreshing page, receive a usable / failed / model-unavailable outcome, ask for another option with scope chips and see the ruled-out list, rephrase after a failure, and be routed to staff when slots run out."
      covers: [AC-22, AC-23, AC-24, AC-25, AC-26, AC-27, AC-28, AC-29, AC-30, AC-31, AC-32, AC-33, AC-34, AC-35, AC-36, AC-37, AC-38, AC-39, AC-40, AC-41, AC-42, AC-43, AC-44, AC-45, AC-46, AC-47, AC-48, AC-49, AC-50, AC-51, AC-52, AC-54, AC-57, AC-58, AC-59, AC-60, AC-61, AC-62, AC-63, AC-64, AC-65, AC-66, AC-67, AC-68, AC-69, AC-70, AC-71, AC-72, AC-73, AC-74, AC-75, AC-76, AC-77, AC-78, AC-79, AC-80, AC-81, AC-82, AC-83, AC-104, AC-105, AC-106, AC-122, AC-138, AC-141]
      entry_criteria: "phase-1 cp-1 approved: the thin UC-1 runs end to end on the isolated test environment."
      tasks:
        - id: task-2.1
          name: "Async interpretation: consent trigger, fresh-tx apply, abandon-discard, startup recovery, meta-refresh"
          description: "On explicit consent move the request to Interpreting and send the owner's text to the AI (never before consent), and on decline move to With staff without sending text (RULE-15/RULE-17). Run interpretation with Spring @Async on a dedicated single-thread executor, passing the request id, with exactly one in-flight interpretation per request; apply the result in a fresh transaction that re-checks the request state before mutating; discard the result if the request was abandoned; on application startup move every request still in Interpreting to Interpretation failed (reason interrupted); while Interpreting the only owner action allowed is abandon (route-to-staff/edit-text are deferred until the result lands) (RULE-18). Poll the request detail page with <meta http-equiv=\"refresh\" content=\"3\"> only — no JavaScript, no JSON status endpoint; the request detail URL is the single entry point rendering whatever state the request is in (RULE-40). Add targeted tests that exercise the async apply/discard/startup-recovery paths with the real executor semantics, not only the synchronous test executor."
          artifact: "src/main/java/.../scheduling/interpretation/InterpretationExecutor.java, InterpretationApplyService.java; startup recovery ApplicationRunner; templates/my/requestDetail.html (meta refresh); src/test/java/.../scheduling/AsyncInterpretationTests.java"
          covers:
            acs: [AC-24, AC-25, AC-26, AC-27, AC-28, AC-29, AC-30, AC-31]
            rules: [RULE-15, RULE-17, RULE-18, RULE-40]
          depends_on: [task-1.6]
          complexity: "L"
          risk: "Tests usually swap in a synchronous executor, so the fresh-transaction re-check (AC-31), abandon-discard (AC-29) and startup recovery (AC-30) run on a path never exercised concurrently; AsyncInterpretationTests uses the real single-thread executor to cover these paths."
          validation: "A service test asserts consent moves Awaiting consent→Interpreting and sends text to the interpreter, and that no text is sent before consent (never() on the interpreter until consent) (AC-24); decline moves→With staff with no interpreter call (AC-25). AsyncInterpretationTests asserts: exactly one in-flight interpretation per request on the single-thread @Async executor with the request id passed (AC-26); while Interpreting a route-to-staff/edit attempt is deferred and only abandon is allowed (AC-27); a result arriving for an abandoned request is discarded with no request/interpretation state change (AC-29); the apply runs in a fresh transaction re-checking state before mutating (AC-31); and a simulated restart moves every Interpreting request to Interpretation failed reason 'interrupted' (AC-30). A view test asserts the request detail page carries the meta-refresh tag and no JS/JSON polling endpoint exists (AC-28)."
        - id: task-2.2
          name: "Interpretation outcome routing + content derivation + duration clamp + preferred-vet resolution + prompt contract"
          description: "Route interpretation outcomes (RULE-19): usable (well-formed, allowed-universe-minus-excluded non-empty in horizon)→Interpreted; contradictory windows or cannotInterpret→Interpretation failed (a counted failed attempt); model unavailable (second malformed / transport error / timeout)→With staff with the reason recorded; OTHER:<text> specialty no vet offers→With staff, never downgraded to general care; and from the THIRD failed attempt onward recommend routing to staff while still allowing rephrasing (and not before the third). Malformed model output is retried exactly once; a timeout (Ollama client 60 s, configurable scheduling.ai.timeout) is not retried and maps to model unavailable (RULE-17). Derive interpretation content: estimated visit length, care type, specialty, preferred/allowed/excluded windows and an optional preferred veterinarian (RULE-17/RULE-25). Clamp estimated duration into the configured bounds: values in [15,60] unchanged, exactly 15 or 60 unchanged, below 15→15, above 60→60, missing→default 30 (RULE-20). Take the preferred veterinarian only as an id chosen by the model from the prompt list, validate the id exists, show the resolved name in the read-only review, and record null for unknown/ambiguous — never fuzzy-match names in Java (RULE-21). Build the prompt with current date/time and horizon end from the injectable Clock, weekday opening hours, part-of-day tokens, veterinarians (id, name, specialties) and offered specialties radiology/surgery/dentistry (RULE-17/RULE-37). Add an ollama-adapter contract test for parse/retry/timeout→model-unavailable behavior, independent of a live model. (Grouped per dec-4; per-AC validation below.)"
          artifact: "src/main/java/.../scheduling/interpretation/{InterpretationRouter,DurationClamp,PreferredVetResolver,PromptBuilder}.java; src/test/java/.../scheduling/{InterpretationRoutingTests,OllamaAdapterContractTests,DurationClampBoundaryTests}.java"
          covers:
            acs: [AC-32, AC-33, AC-34, AC-35, AC-36, AC-37, AC-38, AC-39, AC-40, AC-41, AC-42, AC-43, AC-44, AC-45]
            rules: [RULE-17, RULE-19, RULE-20, RULE-21, RULE-25, RULE-37]
          depends_on: [task-2.1]
          complexity: "L"
          risk: "Structured-output parsing / retry mapping (malformed-JSON-retry-once, timeout→'model unavailable') is central but hidden behind the stub; OllamaAdapterContractTests covers the ollama adapter's parse/retry/timeout behavior without a live model (double conforms to the production interface: same exceptions, nullability, Optional semantics)."
          validation: "InterpretationRoutingTests asserts each route: usable→Interpreted (AC-32); contradictory/cannotInterpret→Interpretation failed as a counted attempt (AC-33); OTHER:<text> unmatched specialty→With staff, not downgraded (AC-35); below three failed attempts no staff recommendation (AC-36), at the third the recommendation appears while rephrasing stays allowed (AC-37), beyond the third it persists (AC-38); content derivation yields duration/careType/specialty/three window lists/optional preferred vet (AC-39). OllamaAdapterContractTests asserts malformed output retried exactly once, and a second malformed / transport error / timeout maps to 'model unavailable'→With staff with the reason recorded (AC-34). DurationClampBoundaryTests asserts three-point clamp: 30 within→unchanged (AC-42), 15 and 60 at-boundary→unchanged (AC-43), 10→15 / 90→60 / missing→30 (AC-44). A resolver test asserts a valid model-supplied preferred-vet id resolves to the shown name (AC-40) and unknown/ambiguous records null with no fuzzy match (AC-41). A prompt test asserts the prompt includes clock now+horizon end, weekday opening hours, part-of-day tokens, vets(id,name,specialties) and the offered specialties (AC-45)."
        - id: task-2.3
          name: "Window model + part-of-day tokens + two-hour lead boundary"
          description: "Model a window as {weekday | specific date | date range} × {start–end time} with weekday windows recurring across the whole horizon; when any preferred or allowed window is named, hard-exclude every slot outside the union of preferred∪allowed; with no preferred and no allowed windows treat the whole horizon as allowed (RULE-22). Resolve each part-of-day token (MORNING/AFTERNOON/EVENING) per weekday against that day's opening hours and drop a token whose resolved interval is empty (e.g. Monday EVENING is empty and dropped) (RULE-23). Treat the earliest bookable slot as the first 15-minute grid point at least 2 hours after the reference time from the injectable Clock; exclude any candidate starting less than 2 hours out (RULE-24)."
          artifact: "src/main/java/.../scheduling/interpretation/WindowModel.java, PartOfDayResolver.java; .../solver/SlotEnumerator.java (lead time); src/test/java/.../scheduling/{WindowResolutionTests,LeadTimeBoundaryTests}.java"
          covers:
            acs: [AC-46, AC-47, AC-48, AC-49, AC-50, AC-51, AC-52]
            rules: [RULE-22, RULE-23, RULE-24]
          depends_on: [task-2.2]
          complexity: "M"
          validation: "WindowResolutionTests asserts a window represents {weekday|date|range}×{start–end} and recurs weekday windows across the horizon (AC-46); with named preferred/allowed windows a slot outside their union is hard-excluded (AC-47); with none named the whole horizon is allowed (AC-48); and each part-of-day token resolves per weekday against opening hours with an empty-interval token dropped (AC-49). LeadTimeBoundaryTests asserts three points against the pinned Clock: a grid point more than 2h out is offered (AC-50), the first grid point at exactly the 2h boundary is the earliest bookable (AC-51), and a candidate less than 2h out is excluded (AC-52)."
        - id: task-2.4
          name: "Full Timefold hard/soft constraints + owner horizon bounds"
          description: "Model the ranking as a single planning entity with one planning variable (the slot) over enumerated feasible slots, applying the hard constraints both at enumeration AND as Timefold hard constraints, behind the SlotRanker interface (auto-configured SolverManager) so tests never touch the library (RULE-26). Hard constraints: within clinic opening hours (AC-74); within one vet's continuous working block after exceptions/leave/closures (AC-75); no overlap with existing appointments or active holds (AC-76); required specialty present (AC-77); not inside the owner's excluded windows (AC-78); within the preferred∪allowed union (AC-79); within the booking horizon (AC-80); no overlap with the same owner's other confirmed appointments/holds across all their pets (AC-81). Soft ranking with HardMediumSoft: preferred window (medium) > preferred vet (soft, high weight) > earliest date/time (soft, per-minute tie-breaker) (AC-82). Place start times on a 15-minute grid and run the solver synchronously inside the locked transaction of RULE-10 with a 1-second termination budget (timefold.solver.solve.duration=1s) (RULE-11, AC-83). Apply the booking horizon and 15–60 duration bounds to owners and the solver only: an owner slot strictly within (AC-104) or on the last horizon day (AC-105) is allowed, beyond it excluded (AC-106); staff may book any future date with any grid-multiple duration that fits the vet's block, past days viewable but not bookable (RULE-35). (Grouped per dec-4; per-AC validation below.)"
          artifact: "src/main/java/.../scheduling/solver/{TimefoldSlotRanker,SlotConstraintProvider,SchedulingSolution}.java; src/test/java/.../scheduling/solver/{SolverHardConstraintTests,SolverRankingTests,HorizonBoundaryTests}.java"
          covers:
            acs: [AC-73, AC-74, AC-75, AC-76, AC-77, AC-78, AC-79, AC-80, AC-81, AC-82, AC-83, AC-104, AC-105, AC-106]
            rules: [RULE-11, RULE-26, RULE-35]
