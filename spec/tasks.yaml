  review_verdict: "PASS"
  organizing_principle: "walking_skeleton then feature_slice"
  replanned_after: cp-1.1
  assumptions:
    - "Phase 1 closed under cp-1.1 APPROVED WITH NOTES on 2026-09-04; its seven tasks are immutable as-built records."
    - "The accepted Timefold delta is `timefold.solver.termination.spent-limit=1s`; production defaults to Ollama and tests pin the stub."
    - "Post-cp-1 commit 9aa650c changed the configurable Ollama model default from the spec's `gemma4:latest` to `ministral-3:14b`; accepted as Δ D-4 in spec.md/rules.md (no AC fixes a concrete tag). The test copy of application.properties still carries the old tag, so SchedulingProviderPinningTests is red at HEAD; task-2.1 synchronizes it first."
    - "`/403` (GET, authenticated any role) was added to the rules' Security Surface matrix after plan review BLOCKER-5; the phase-1 route inventory entry `GET /403 → task-1.3` is therefore matrix-backed."
    - "The cp-1 legacy waiver applies only to phase-1; every later task requires one commit, exact closure evidence, plan guards, and a clean-tree gate."
    - "Pending phases exceed seven tasks because the five-AC cap, mandatory HTTP/UC tasks, and carried findings cannot be merged safely."
  decisions:
    - id: dec-1
      decision: "walking_skeleton then feature_slice"
      principle: "walking_skeleton then feature_slice"
      rung: "3, then 4 for phases 2+"
      signal: "No security/login, scheduling Flyway schema, scheduling pages, RequestInterpreter, SlotRanker, or locked booking had run end to end; remaining ACs partition by UC-1/2/3, UC-4, UC-5, and UC-6."
      reason: "The approved phase-1 is the skeleton. Pending work follows independently demoable owner automation, staff request resolution, staff appointment management, and owner cancellation slices."
      alternatives: ["layered continuation", "risk-first continuation"]
    - id: dec-2
      decision: "re-plan after phase-1 as-built"
      reason: "cp-1.1 approved phase-1 with notes under the recorded legacy waiver (status.md Deviations). AC-7, AC-16..AC-19, AC-21 and AC-58 move to phase-2 remediation and AC-140 to the terminal sweep because evidence was WEAK; AC-118 moves to phase-5 because no owner detail/cancel route exists; AC-138 moves to phase-5 because only thin UC-1 exists. AC-139 is deferred under the user waiver. Plan guards move to task-2.1. As-built test artifacts are written as `path (methods: ...)`; an as-built entry that a later task deletes carries a `(superseded: ...; deleted by task-N.M)` marker the ArtifactInventoryTest honours. The Test-environment mandatory task is satisfied as-built (src/test/resources/application.properties pins the stub provider, TestClockConfig pins the clock, SeedMigrationTests.usesOnlyAnIsolatedInMemoryDatabase proves isolation). Plan review round 1 (FAIL) was resolved in this file: BLOCKER-1 test-property sync in task-2.1; BLOCKER-2 mapping transfer in task-3.1/task-4.1; BLOCKER-3 calendar-pick branch (AC-90, AC-97) moved to task-4.3; BLOCKER-4 final SecurityMatrixWebTests in task-5.5; BLOCKER-5 /403 added to the rules matrix; MAJOR-1..4 risks, sharpened validations, RULE-44 waiting-step fixture and the localization manifest."
      alternatives: ["rewrite completed tasks", "leave weak AC claims in phase-1"]
    - id: dec-3
      decision: "Preserve legacy as-built tasks that exceed current granularity and checkpoint rules."
      reason: "task-1.2 and task-1.3 contain approved evidence sets and phase-1 has unsplit L tasks without intermediate checkpoints. Re-plan immutability forbids splitting or inserting checkpoints; every new task obeys the five-AC cap and uses S/M complexity."
      alternatives: ["invalidate completed task and commit identities by splitting them"]
    - id: dec-4
      decision: "Remediate cp-1 findings before adding new behavior."
      reason: "task-2.1 closes G-5 while installing guards; task-2.2 closes G-7 and K-1..K-4; task-2.3 closes G-2/G-6/G-8. G-4 belongs to phase-5 routes. G-3 is closed."
      alternatives: ["append a disconnected remediation phase"]
