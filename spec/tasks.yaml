            rules: [RULE-8, RULE-9, RULE-10, RULE-11, RULE-19]
          depends_on: [task-2.4]
          complexity: "L"
          risk: "H2 SELECT … FOR UPDATE row-locking granularity differs from Postgres/MySQL and under in-memory H2; AcceptConcurrencyIntegrationTests pins the isolation level and asserts the lock behavior explicitly so the guarantee is not mode-dependent."
          validation: "A service test asserts a suggestion attempted for a request not in Interpreted or Suggestion offered is refused with no state change and no hold (AC-57); confirm enumerates+ranks+offers one slot, moves to Suggestion offered and records the hold row (AC-58); a held slot is excluded from another owner's calendar/overlap via the appointment∪hold union (AC-59); the hold has no timer and is released only on the enumerated triggers (AC-60); no feasible slots→With staff with no dead end (AC-61); opening a Suggestion offered request with an invalid hold yields the next suggestion or With staff with a notice and no error page (AC-62); accept re-validates in the locked transaction and confirms→Accepted when valid (AC-63) or shows next/hand-off when the slot was lost, never an error page (AC-64). AcceptConcurrencyIntegrationTests runs two simultaneous confirms of the same vet-and-time on the real DB and asserts at most one succeeds with the loser refused and no double booking (AC-65), and two simultaneous active-request creations for one pet leave at most one active via active_pet_id + unique index, the second surfaced as a refusal (AC-22/AC-23/AC-141)."
