tasks:
  feature: "Smart Appointment Scheduling"
  review_verdict: "PASS"
  organizing_principle: "walking_skeleton then feature_slice"

  assumptions:
    - "review.md Summary verdict line reads PASS (confirmed on disk 2026-09-03); the $tasks pipeline contract refuses to write this file on FAIL, so the gate is satisfied."
    - "Runtime Ollama model tag default `gemma4:latest` (proposal §14) is unlikely to exist; a live demo must point `scheduling.ai.model` at an installed model (e.g. `gemma3`). Tests never call the live model (they use `scheduling.ai.provider=stub`), so CI is unaffected (ED-2)."
    - "Emergency phone is seeded as a placeholder, staff-editable in Clinic settings (ED-3)."
    - "MINOR-1 (solver-termination wording) is non-blocking: `timefold.solver.solve.duration=1s` is a total spent-limit; no AC asserts which Timefold termination is used. Carried as a risk on the solver task."

  decisions:
    - id: dec-1
      decision: "walking_skeleton then feature_slice"
      principle: "walking_skeleton then feature_slice"
      rung: "3, then 4 for phases 2+"
      signal: "Seams that have never run end to end in this codebase: no Spring Security config and no Flyway (review.md §Codebase Grounding: 'no existing security config and no Flyway'), no Spring AI/Ollama RequestInterpreter, no Timefold SlotRanker, no /my/** owner pages, no /staff/** pages, no users/accounts table, no @Async interpretation, no per-vet SELECT … FOR UPDATE. Nothing in scope runs end to end, so rung 3 fires; the remaining ACs partition cleanly by use case (UC-1 extensions, UC-2, UC-3, UC-4, UC-5, UC-6), so rung 4 orders phases 2+."
      reason: "Rung 1 (explicit mandate) did not fire: neither rules.md nor the invocation names a principle; the goal 'working, UI-verifiable state after each phase' is a constraint, not a named principle. Rung 2 (architectural risk) was considered and folded into the skeleton (see dec-2) so every phase stays demoable. Rung 3 fires because the feature's happy path crosses seams that have never been exercised. The skeleton delivers a thin but real end-to-end UC-1 in phase-1 (owner logs in → request → consent → interpretation → confirm → one held slot → accept → Confirmed appointment under My appointments), then each later feature slice completes one more use case with its own demo sentence and human walkthrough."
      alternatives:
        - "Pure feature_slice from phase-1 (rejected: no end-to-end skeleton exists, so an isolated slice cannot render/authenticate/persist end to end)."
        - "layered data→domain→application→presentation (rejected: rung 5 fallback only; rungs 2–4 fired first, and a layered phase-1 has no truthful demo sentence)."
    - id: dec-2
      decision: "Fold the review's architectural Risk Hotspots into the walking skeleton rather than run a leading risk_first spike."
      reason: "review.md lists Risk Hotspots (H2 SELECT … FOR UPDATE locking, Ollama model availability/structured-output parse-retry-timeout, async @Async interpretation apply/discard/startup-recovery). Their mitigations are test-doubled and local, and the user's goal requires a demoable UI after every phase; a leading spike phase has no UI to verify. Each hotspot is exercised thinly in phase-1 and deepened in phase-2, and is carried as a task `risk` annotation with a targeted test."
      alternatives:
        - "Leading risk_first spike phase proving the H2 lock + AI/solver seams before the skeleton (rejected: phase-1 would have no UI to walk through, contradicting the per-phase demo goal)."
    - id: dec-3
      decision: "Carry MINOR-1 (solver-termination wording) as a non-blocking risk on the solver task."
      reason: "RA-32 says '1 s unimproved or exhausted' while RULE-11/AC-83 fix `timefold.solver.solve.duration=1s` (a total spent-limit). No AC asserts which termination is used, so the nuance is cosmetic; annotated so the executor does not guess."
      alternatives:
        - "Block on rewording upstream (rejected: cosmetic, not in the Fix Plan, no downstream AC depends on it)."
    - id: dec-4
      decision: "Group the ten Timefold hard/soft constraint ACs (AC-73…AC-83) plus the owner-horizon boundary ACs (AC-104…AC-106) into one solver task, and group AC-32…AC-45 into one interpretation-routing/content task, exceeding the ≤7-AC soft guideline."
      reason: "RULE-26 itself covers AC-73…AC-82 with a per-AC validation table over a single Timefold model, and RULE-17/19/20/21 form one interpretation contract; splitting would fork a single cohesive artifact and its one test class. Each grouped task keeps a per-AC assertion in its `validation`, so coverage stays per assertion, not per mention. This is a justified deviation from the ≤7-AC smell, not 'write the tests for a whole phase'."
      alternatives:
        - "Split each into two or three tasks (rejected: would fork one solver model / one interpretation adapter across tasks and duplicate the fixture)."

  phases:
    - id: phase-1
      name: "Walking skeleton — auth, Flyway, lifecycle guards, thin UC-1 end to end"
      description: "Stand up the never-run seams thinly but really: Java 21 + dependencies + ArchUnit boundaries; Flyway V1..V4 with the normative seed and its by-value test; the whole URL→role SecurityFilterChain with a service-layer ownership guard; the stock layout reused for per-role menu/login/logout/landing with the urgent-care banner localized across all 11 bundles; request and appointment lifecycle service guards with refusal tests; an injectable Clock and isolated test H2; and a thin RequestInterpreter (stub+ollama) → versioned Interpretation → Timefold SlotRanker → per-vet-locked confirm, tied together by a thin UC-1 MockMvc end-to-end test and one random-port smoke test. Demo: an owner can log in, start a request for one of their pets, grant consent, see the persisted interpretation, confirm it, be offered one held slot, accept it, and see a Confirmed appointment under My appointments; staff can log in and land on the Scheduling queue."
      covers: [AC-1, AC-2, AC-3, AC-4, AC-5, AC-6, AC-7, AC-8, AC-9, AC-10, AC-11, AC-12, AC-13, AC-14, AC-15, AC-16, AC-17, AC-18, AC-19, AC-20, AC-21, AC-53, AC-58, AC-63, AC-108, AC-123, AC-124, AC-125, AC-126, AC-127, AC-128, AC-129, AC-130, AC-131, AC-132, AC-133, AC-134, AC-135, AC-136, AC-137, AC-138, AC-139, AC-140]
      entry_criteria: "review.md verdict is PASS; the stock Spring PetClinic builds on Maven with Java 17."
      tasks:
        - id: task-1.1
          name: "Repo cleanup, Java 21 bump, dependencies, ArchUnit boundaries"
          description: "Bump `<java.version>` from 17 to 21 in pom.xml (Timefold 2.x requires Java 21). Add dependencies: spring-boot-starter-security, flyway-core, spring-ai-starter-model-ollama (+ Spring AI 2.0.1 BOM), timefold-solver-spring-boot-starter 2.5.0, and com.tngtech.archunit:archunit-junit5 (test scope). Delete the unmaintained non-H2 / non-Maven assets per spec Out of scope: src/main/resources/db/mysql and db/postgres SQL, application-mysql.properties and application-postgres.properties, docker-compose.yml, the k8s/ directory, build.gradle/settings.gradle/gradlew (H2 + Maven only). Add ArchUnit tests enforcing RULE-2: (a) no type under scheduling.solver/scheduling.interpretation domain or service packages imports ai.timefold.. or org.springframework.ai.. outside the SlotRanker/RequestInterpreter adapter classes; (b) no @Controller calls a *Repository directly instead of a @Service; (c) no service/domain type under scheduling.. imports jakarta.servlet.. or org.springframework.web.. . Keep package-by-feature and public @Entity naming per RULE-1/RULE-3 (no Spring Modulith, no *Entity rename, no *API facades)."
          artifact: "pom.xml (Java 21 + deps); deleted db/mysql,db/postgres,docker-compose.yml,k8s/,Gradle files; src/test/java/.../architecture/ArchitectureBoundaryTests.java"
          covers:
            acs: []
            rules: [RULE-1, RULE-2, RULE-3, RULE-4, RULE-5, RULE-6]
          depends_on: []
          complexity: "M"
          validation: "ArchitectureBoundaryTests fails the build if any of the three RULE-2 boundary conditions is violated (a Timefold/Spring-AI import outside an adapter; a @Controller→*Repository call; a scheduling service/domain type importing servlet/web); asserted by three separate ArchUnit rules, each with a deliberately-violating fixture proving the rule bites. Build compiles on Java 21."
        - id: task-1.2
          name: "Flyway V1..V4 migrations + by-value seed migration test"
          description: "Add Flyway migrations under db/migration targeting H2 only and disable stock init (spring.sql.init.mode=never; remove schema.sql/data.sql init props) per RULE-5: V1__stock_schema (stock owner/pet/vet/visit/specialty schema), V2__stock_data (stock reference data), V3__scheduling_schema (RULE-7 tables: users(username,password,role,nullable owner_id); scheduling_request(pet,owner,state,reason_text,availability_text,nullable active_pet_id,failed_attempts,nullable held_vet_id,nullable held_start,nullable held_duration,timestamps); scheduling_request_event(request,from_state,to_state,actor,action,reason,payload,timestamp); interpretation(request,version,provenance AI|STAFF,reason_summary,estimated_minutes,care_type,specialty,nullable preferred_vet_id,cannot_interpret,raw_response CLOB,model_tag,prompt_version); interpretation_window(interpretation,kind PREFERRED|ALLOWED|EXCLUDED,date/date-range/weekday,start_time,end_time,tokens); appointment(pet,vet,start,duration,status,reason); appointment_change(appointment,actor,action,reason,timestamp); clinic-config tables: opening hours per weekday, parts-of-day, visit-duration bounds/default, booking horizon, emergency_phone, time_zone; vet weekly blocks; vet exceptions; leave ranges; clinic closures; and a nullable appointment_id added to visits), and V4__scheduling_seed seeding EXACTLY the normative rows — no more, no fewer (RULE-42): Accounts george/george123/owner/George Franklin, betty/betty123/owner/Betty Davis, eduardo/eduardo123/owner/Eduardo Rodriquez, harold/harold123/owner/Harold Davis, peter/peter123/owner/Peter McTavish, jean/jean123/owner/Jean Coleman, jeff/jeff123/owner/Jeff Black, maria/maria123/owner/Maria Escobito, david/david123/owner/David Schroeder, carlos/carlos123/owner/Carlos Estaban, admin/admin123/staff/—, staff/staff123/staff/— (passwords BCrypt-encoded; roles limited to owner and staff, RULE-14); Clinic A opening hours Mon 9:00-17:00, Tue 9:00-17:00, Wed 9:00-18:00, Thu 9:00-17:00, Fri 10:00-16:00, Sat closed, Sun closed; 17 vet weekly blocks (James Carter Mon 9-17,Tue 9-17,Wed 9-12,Fri 11-12; Helen Leary Mon 9-17,Tue 9-17,Wed 9-12; Linda Douglas Mon 9-17,Tue 9-17,Wed 9-12; Rafael Ortega Thu 9-17,Fri 10-16; Henry Stevens Thu 9-17,Fri 10-16; Sharon Jenkins Mon 13-14,Thu 9-17,Fri 10-16); vet exceptions (all unavailable) James Carter 2026-09-15, Henry Stevens 2026-09-15/2026-09-17/2026-09-21/2026-10-22, Sharon Jenkins 2026-10-22; no leave and no clinic closures; config defaults booking horizon 30 days, duration bounds/default 15-60/30, start grid 15 min, parts of day morning 09:00-12:00/afternoon 12:00-17:00/evening 17:00-18:00, time zone Europe/Amsterdam, emergency phone placeholder. The migration test runs on a fresh in-memory H2 built by V1..V4 only and does not touch the runtime H2 file (AC-135)."
          artifact: "src/main/resources/db/migration/V1..V4*.sql; src/test/java/.../migration/SeedMigrationTests.java"
          covers:
            acs: [AC-125, AC-126, AC-127, AC-128, AC-129, AC-130, AC-131, AC-132, AC-133, AC-134, AC-135]
            rules: [RULE-5, RULE-7, RULE-14, RULE-42]
          depends_on: [task-1.1]
          complexity: "L"
          validation: "SeedMigrationTests, on a fresh in-memory H2 built by Flyway V1..V4 only, asserts every seeded row BY VALUE (not by count): the 12 account rows (username, role, linked owner) with each password verified via the application's PasswordEncoder.matches (AC-127); no account/role outside {owner,staff} (AC-126); the single Clinic A opening-hours row incl. Sat/Sun closed (AC-128); all 17 vet weekly blocks and no others (AC-129/AC-130); the 6 vet-exception rows and zero leave/closure rows (AC-131/AC-132); the 6 config-default rows and no others (AC-133/AC-134); and asserts no extra rows in any seeded table. A separate assertion proves the test datasource is in-memory and the runtime H2 file is unmodified (AC-135)."
        - id: task-1.3
          name: "SecurityFilterChain over the whole URL matrix + users model + service ownership guard + negative-authz matrix test"
          description: "Add one SecurityFilterChain (form login, CSRF enabled, BCrypt PasswordEncoder, role-based success handler owner→/my/appointments, staff→/staff/queue, / redirecting by role) with EXACTLY the §Security Surface authorization matrix (RULE-12), every route mapped: permitAll only for /login (GET,POST) + /error + static resources (/resources/**,/webjars/**,/*.css,favicon); /logout (POST) authenticated any role; / authenticated redirect-by-role; /oups staff only; /owners/** (incl. /owners/new,/owners/find,/owners,/owners/{id},/owners/{id}/edit,/owners/{id}/pets/**,/owners/{id}/pets/{petId}/visits/new) staff only; /vets,/vets.html staff only; /staff/** staff only; /my/** (/my/pets,/my/appointments,/my/requests/**) owner only with owner id from session never URL; /actuator/** staff only. Model accounts as a public User @Entity mapping the users table with roles limited to owner and staff and nullable owner_id FK (RULE-14). Add a service-layer ownership guard (RULE-13): owner pages take the owner id from the authenticated session; any access to a pet/request/appointment not owned by the caller returns 404 identical to a genuinely missing id, disclosing nothing and mutating nothing, holding even if the URL matcher is bypassed. Denial semantics (RULE-13): anonymous→302 /login; wrong-role→403 page; other-owner id→404. AC-118 (owner cannot view/cancel another owner's appointment) is exercised here as part of the matrix and deepened in phase-5."
          artifact: "src/main/java/.../security/SecurityConfig.java, User.java, UserRepository.java; scheduling ownership guard service; src/test/java/.../security/SecurityMatrixWebTests.java"
          covers:
            acs: [AC-1, AC-2, AC-3, AC-4, AC-8, AC-9, AC-10, AC-11, AC-12, AC-13, AC-118]
            rules: [RULE-2, RULE-12, RULE-13, RULE-14]
          depends_on: [task-1.2]
          complexity: "L"
          validation: "SecurityMatrixWebTests, a web-slice test over the REAL SecurityFilterChain across the WHOLE URL matrix (stock routes included), asserts for each route: anonymous GET/POST redirects (302) to /login and no service collaborator is invoked (AC-1/AC-2); an owner on /owners/**, /vets*, /staff/**, /oups, /actuator/** gets 403 and the body discloses no staff data and no mutation occurs (never() on the service) (AC-8/AC-9); an owner requesting another owner's pet/request/appointment id gets 404 identical to a missing id with no disclosure and no DB change (AC-11/AC-12/AC-118). A service-level test proves the ownership guard returns the missing-id-identical 404 even when invoked directly (URL matcher bypassed) (AC-13/AC-10), and login authenticates a seeded account via the encoder establishing a role-bearing session (AC-3) while an unknown user / wrong password creates no session (AC-4)."
        - id: task-1.4
          name: "Stock layout reuse: per-role menu, login/logout/landing, urgent-care banner, 11-bundle localization"
          description: "Render every new page with the existing templates/fragments/layout.html (layout(template,menu) + menuItem), navbar, form fragments (inputField.html/selectField.html) and the stock stylesheet — no second layout/stylesheet, no inline styling (RULE-39). Show per role only its menu entries: owner → My pets, My appointments; staff → the stock pages (find owners, owner/pet/visit management, veterinarians) plus Scheduling queue, Calendar, Clinic settings. Show the signed-in username and a Logout action on every page; land owners on My appointments and staff on Scheduling queue; keep My pets read-only (owner's own owner record + pets, no edit controls); expose veterinarian names/specialties to owners only inside the scheduling request page. Render the urgent-care banner from message keys with the configured emergency_phone on every owner scheduling page and the request detail page (RULE-38). Author every new user-visible string as a message key present in ALL 11 bundles (de,en,es,fa,hi,ja,ko,pt,ru,tr + default), English text with identical English placeholder in each non-English bundle, and emit no English literal directly from feature templates/Java (RULE-41); modifying the stock navbar pulls layout.html under the no-literal check, so every new navbar/label string is keyed. This task establishes AC-140 primary; a full sweep over all feature-touched files runs in phase-5."
          artifact: "templates/my/*.html, templates/staff/*.html, templates/login.html, modified fragments/layout.html; messages/messages*.properties (11 bundles); src/test/java/.../presentation/LocalizationKeyTests.java"
          covers:
            acs: [AC-5, AC-6, AC-7, AC-14, AC-15, AC-16, AC-17, AC-18, AC-19, AC-140]
            rules: [RULE-38, RULE-39, RULE-41]
          depends_on: [task-1.3]
          complexity: "L"
          validation: "A rendered-page web-slice asserts: signed in as owner the navbar shows only My pets + My appointments (AC-14), signed in as staff the stock entries plus Scheduling queue/Calendar/Clinic settings (AC-15); every page shows the signed-in username and a Logout action and POST /logout ends the session (AC-7); owner lands on My appointments and staff on the queue on login and on / (AC-5/AC-6); My pets renders the owner's record+pets with no edit controls (AC-17); the request page shows vet names/specialties but exposes no owner-search/edit/visit/vets links to owners (AC-18); the urgent-care banner with emergency_phone appears on every owner scheduling page and the request detail page (AC-19); and pages resolve through the stock layout fragment with no second layout/stylesheet (AC-16). LocalizationKeyTests scans the feature templates (text AND attributes AND inline expressions) and MessageSource usages and fails if any referenced key is absent from any of the 11 bundles or if any English literal is emitted from a feature-introduced/modified template or Java class (AC-140)."
        - id: task-1.5
          name: "Request + appointment lifecycle service guards with refusal tests; injectable Clock + isolated test H2"
          description: "Implement the request lifecycle as a service-owned guard (RULE-15) that refuses with IllegalRequestTransitionException and NO side effect and NO event row every transition not listed, never relying on the UI hiding an action. Allowed transitions to implement: Awaiting consent → {consent→Interpreting, decline consent→With staff, edit text→Awaiting consent, abandon→Abandoned, staff book(attach)→Accepted, staff book(leave open)→Awaiting consent}; Interpreting → {abandon→Abandoned, (system) usable→Interpreted, (system) failed/contradiction/cannotInterpret→Interpretation failed, (system) model unavailable/timeout/malformed-after-retry→With staff, (system) restart-in-flight→Interpretation failed(reason interrupted), staff book(attach)→Accepted, staff book(leave open)→Interpreting}; Interpretation failed → {edit/rephrase(fresh consent)→Awaiting consent, route to staff→With staff, abandon→Abandoned, staff book(attach)→Accepted, staff book(leave open)→Interpretation failed}; Interpreted → {confirm-feasible→Suggestion offered, confirm-no-slots→With staff, edit text→Awaiting consent, route to staff→With staff, abandon→Abandoned, staff book(attach)→Accepted, staff book(leave open)→Interpreted}; Suggestion offered → {accept-valid→Accepted, accept-invalid-next→Suggestion offered, accept-invalid-none→With staff, ask-again-remain→Suggestion offered, ask-again-exhausted→With staff, (system) view-revalidate-next→Suggestion offered, (system) view-revalidate-none→With staff, route to staff→With staff, edit text→Awaiting consent, abandon→Abandoned, staff release hold→With staff, staff place suggestion→Suggestion offered, staff book(attach)→Accepted, staff book(leave open)→Suggestion offered}; With staff → {view status→With staff, abandon→Abandoned, staff create/edit interpretation(new STAFF)→With staff, staff place suggestion→Suggestion offered, staff book directly(attach)→Accepted, staff book directly(leave open)→With staff}; Accepted and Abandoned terminal. Implement the appointment lifecycle guard (RULE-16) with IllegalAppointmentTransitionException and no side effect: Confirmed → {owner cancel(before start)→Cancelled by owner, staff cancel(before start,reason)→Cancelled by staff, staff reschedule(before start,reason,in place)→Confirmed, staff mark completed(at/after start)→Completed(creates a visit), staff mark no-show(at/after start)→No-show}; Cancelled by owner/Cancelled by staff/Completed/No-show terminal; completion/no-show refused before the scheduled start. Expose an injectable Clock bean (runtime = system clock in the configured zone) used everywhere now/date/time is needed, operating in one configured time zone default Europe/Amsterdam (RULE-37, AC-108). Establish the isolated in-memory test H2 (same Flyway V1..V4), pinned Clock, and the working-tree-unchanged check as the shared test environment (RULE-44)."
          artifact: "src/main/java/.../scheduling/request/RequestLifecycleService.java, .../appointment/AppointmentLifecycleService.java, .../clinic/ClockConfig.java; src/test/java/.../scheduling/{RequestLifecycleRefusalTests,AppointmentLifecycleRefusalTests}.java; test config for isolated H2 + pinned Clock"
          covers:
            acs: [AC-108, AC-123, AC-124, AC-136, AC-137]
            rules: [RULE-15, RULE-16, RULE-37, RULE-44]
          depends_on: [task-1.2]
          complexity: "L"
          validation: "RequestLifecycleRefusalTests sets up a request persisted in each state on the isolated DB and, for every action NOT in that state's row above, asserts IllegalRequestTransitionException AND never() save AND no scheduling_request_event row written (AC-123). AppointmentLifecycleRefusalTests does the same for the appointment guard, asserting IllegalAppointmentTransitionException with no state change (AC-124) and, at the completion-timing boundary, that mark-completed/no-show is refused before start (deepened in phase-4). Tests inject the Clock pinned to Monday 2026-09-07 09:00 Europe/Amsterdam (AC-136), run against the same-Flyway in-memory H2, and a build check asserts git-tracked files are unchanged after the suite (AC-135 environment). The stub RequestInterpreter used here conforms to the production interface — same exceptions, nullability and Optional semantics — and never calls the live model (AC-137)."
        - id: task-1.6
          name: "Thin interpreter + versioned interpretation fidelity + Timefold ranker + per-vet-locked confirm"
          description: "Add the RequestInterpreter interface with two adapters selected by scheduling.ai.provider=ollama|stub (RULE-17): the ollama adapter uses spring-ai-starter-model-ollama with structured output (BeanOutputConverter) into a record carrying reasonSummary, estimatedMinutes, careType(GENERAL|SPECIALTY), specialty(closed list or OTHER:<text>), preferredVetId, cannotInterpret and preferred/allowed/excluded window lists; the stub adapter is deterministic and offline. Persist the complete interpretation as a versioned Interpretation (provenance AI|STAFF, a STAFF version never overwriting AI) plus raw model response, model tag and prompt version so a read-back is field-for-field identical (RULE-25). Implement a thin SlotRanker over a Timefold single-entity model behind the interface (RULE-26) and a per-vet-locked confirm: a single @Transactional method that first acquires SELECT … FOR UPDATE on the vet row, re-checks overlaps against appointments unioned with active holds, records the hold (held_vet_id/held_start/held_duration on the request row, no slot_hold table, no timer) and moves the request to Suggestion offered, then confirms on accept (RULE-8/RULE-10/RULE-11). Owner starts a request in Awaiting consent for a pet with no active request, and the pet selector offers only that owner's pets with no active request (RULE-9/RULE-39). This is the thin skeleton pass; async, outcome routing, full solver constraints and re-validation are thickened in phase-2."
          artifact: "src/main/java/.../scheduling/interpretation/{RequestInterpreter,OllamaRequestInterpreter,StubRequestInterpreter,Interpretation}.java; .../solver/SlotRanker.java; .../request/SuggestionService.java; src/test/java/.../scheduling/InterpretationFidelityTests.java"
          covers:
            acs: [AC-20, AC-21, AC-53, AC-58, AC-63]
            rules: [RULE-7, RULE-8, RULE-9, RULE-10, RULE-11, RULE-17, RULE-25, RULE-26, RULE-39]
          depends_on: [task-1.5]
          complexity: "L"
          risk: "H2 SELECT … FOR UPDATE pessimistic-lock semantics differ from Postgres/MySQL and under in-memory H2; the per-vet lock is verified explicitly and the isolation level pinned in the concurrency integration test (deepened in phase-2 task-2.5). Ollama model tag gemma4:latest is unlikely to exist; tests use scheduling.ai.provider=stub and the live default is documented (ED-2)."
          validation: "InterpretationFidelityTests persists an interpretation produced by the stub and reads it back, asserting field-for-field equality of all three window lists, careType, specialty, duration, preferredVet, raw model response, model tag and prompt version (AC-53). A service test asserts start-request creates a request in Awaiting consent for a pet with no active request (AC-20) and that the pet selector offers only pets without an active request (AC-21). A skeleton confirm test asserts that confirming a feasible interpretation enumerates+ranks with Timefold, offers exactly one slot, moves the request to Suggestion offered and records the hold fields on the request row (AC-58), and that accept re-validates inside the per-vet SELECT … FOR UPDATE transaction and confirms the appointment moving the request to Accepted (AC-63)."
        - id: task-1.7
          name: "Thin UC-1 main-scenario MockMvc end-to-end + random-port smoke test"
          description: "Add the UC-1 primary use-case end-to-end test thin (main success scenario, every step present, no extensions yet) driving the real filter chain with CSRF as an owner on the isolated in-memory H2 with the pinned Clock, stub interpreter and synchronous executor: UC-1 step 1 owner starts a request entering reason+availability text for a pet; step 2 owner grants explicit consent; step 3 system interprets (synchronously via the test executor) and shows the waiting page; step 4 system presents the persisted interpretation for read-only review; step 5 owner confirms; step 6 system holds and offers exactly one ranked slot; step 7 owner accepts; step 8 system confirms the appointment and shows it under My appointments (RULE-44). Add exactly one @SpringBootTest(webEnvironment=RANDOM_PORT) smoke test that loads the login page and one authenticated page to prove wiring (AC-139). AC-138's full interleaved lifecycle is completed in phase-5 task-5.2; this task establishes the thin main-scenario leg."
          artifact: "src/test/java/.../scheduling/SchedulingLifecycleE2eTests.java (ownerGuidedFlow, thin); src/test/java/.../SmokeTests.java"
          covers:
            acs: [AC-138, AC-139]
            rules: [RULE-44]
          depends_on: [task-1.6]
          complexity: "M"
          validation: "SchedulingLifecycleE2eTests.ownerGuidedFlow (thin) is a MockMvcTester HTTP test with the real SecurityFilterChain and CSRF that drives UC-1 steps 1..8 as the owner and asserts request/appointment state after every step (Awaiting consent → Interpreting → Interpreted → Suggestion offered → Accepted; one Confirmed appointment visible under My appointments), on the isolated H2 with pinned Clock + stub + synchronous executor. SmokeTests is exactly one random-port @SpringBootTest asserting the login page loads and one authenticated page is reachable (AC-139)."
      checkpoint:
        id: cp-1
        description: "Walking skeleton runs end to end: auth, seed, layout, guards and a thin UC-1 are demoable and verifiable."
        criteria:
          - "Human walkthrough: signed in as owner (e.g. george/george123), execute UC-1 main scenario by hand — start a request, grant consent, review the persisted interpretation, confirm, receive one held slot, accept, and see a Confirmed appointment under My appointments; pages render inside the stock fragments/layout.html with only the owner menu entries (My pets, My appointments), the signed-in username and a Logout action visible; the urgent-care banner with the emergency phone is visible on the scheduling pages; and the owner is denied on /owners/**, /vets*, /staff/**, /oups and /actuator/** (403), and on another owner's ids (404 identical to missing)."
          - "Human walkthrough: signed in as staff (e.g. admin/admin123), landing is the Scheduling queue and the staff navbar shows the stock entries plus Scheduling queue, Calendar, Clinic settings."
