tasks:
  feature: "Smart Appointment Scheduling"
  review_verdict: "PASS"
  organizing_principle: "risk_first then feature_slice"

  assumptions:
    - "Spring AI 2.0.1, its Ollama starter, and a Timefold build are all resolvable against Spring Boot 4.1.0; this is proven in phase 1 (task-1.1) before any downstream work (review Hotspot 2, spec D-1)."
    - "Java baseline is 21 (bumped from 17): Spring AI 2.0 and current Timefold Solver both require Java 21, while Spring Security and Flyway only need 17. Both build files already target 21 and the existing suite passes; task-1.1 assumes this baseline is in place."
    - "Phases 1-2 exercise the scheduling spine under a permissive/test security context (a test principal); real authentication and authorization land in phase 3 (task-3.2) BEFORE any owner-facing deployment. No owner-facing release happens between cp-2 and cp-3 (see dec-4)."
    - "H2 is the primary dev/test DB; every migration is validated on H2 plus Testcontainers MySQL and Postgres. (The local Postgres integration test additionally needs host port 5432 free.)"
    - "Review verdict is PASS; the three former majors (MAJOR-1/2/3) are already resolved in rules.md and are carried here as source-tagged tasks and risk annotations for traceability."

  decisions:
    - id: dec-1
      decision: "Organize risk_first for phases 1-2, then feature_slice for phases 3-6; the handoff occurs after cp-2 (phase-2 → phase-3)."
      reason: "Selection Ladder rung 2 fires: review.md lists architectural Risk Hotspots — an unproven external dependency (Spring AI 2.0.1 + Timefold + Ollama on Boot 4.1) and load-bearing async/hold concurrency. These are retired first; once the spine is proven, the remaining ACs partition into shippable slices (auth, config, guided flow, lifecycle)."
      alternatives: ["walking_skeleton then feature_slice", "layered"]
    - id: dec-2
      decision: "Use 6 phases, exceeding the soft limit of 5."
      reason: "Two risk-retirement phases (integration spine, then async/concurrency spine) plus four feature slices (auth, config, guided flow, lifecycle). Collapsing any pair would exceed 7 tasks or blur a checkpoint boundary. A split into two features was considered but the flows share the SchedulingRequest and Appointment aggregates."
      alternatives: ["merge phases 5 and 6", "split into two separate features"]
    - id: dec-3
      decision: "Model slot exclusivity as a single shared slot_occupancy table with a plain UNIQUE(vet_id, start_time)."
      reason: "A constraint cannot span the hold and appointment tables, and MySQL has no filtered indexes; one occupancy row per taken slot is portable across H2/MySQL/Postgres (resolves review MAJOR-1, MAJOR-2)."
      alternatives: ["partial/filtered unique index (not MySQL-portable)", "application-level locking only (no DB guarantee)"]
    - id: dec-4
      decision: "Defer Spring Security to phase 3, after the risky spine (phases 1-2) is proven."
      reason: "Auth is well-trodden, not a hotspot; front-loading it would delay retiring the real risks. Phases 1-2 run under a test principal / permissive context. This is a deliberate sequencing choice, not a security gap: task-3.2 applies the access zones and task-3.6 applies ownership checks to the phase-2 scheduling routes before any owner-facing release (see assumptions)."
      alternatives: ["auth first (layered/security-first)", "no auth until the end"]

  phases:
    - id: phase-1
      name: "Retire integration risk: dependencies, Flyway, AI + solver spikes"
      description: "Prove the bleeding-edge dependency stack resolves on Boot 4.1 / Java 21 and that the two riskiest integrations — Spring AI→Ollama interpretation and the Timefold solve — actually work, on a minimal persistence base. Addresses review Hotspots 1 and 2."
      covers: [AC-15, AC-17, AC-20, AC-21, AC-22, AC-23, AC-24, AC-25, AC-26, AC-27, AC-28, AC-29, AC-30, AC-32, AC-33, AC-34, AC-63, AC-64, AC-66]
      entry_criteria: "Pipeline PASS; Java 21 baseline in place; clean working tree."
      tasks:
        - id: task-1.1
          name: "Add and verify new dependencies"
          description: "Add Spring Security, Spring AI 2.0.1 (BOM + Ollama starter), Timefold (starter if Boot-4.1-compatible, else timefold-solver-core), and Flyway (core + MySQL/Postgres modules) to BOTH pom.xml and build.gradle, kept in sync. Confirm every coordinate resolves against Boot 4.1.0 on Java 21."
          artifact: "pom.xml, build.gradle"
          covers:
            acs: []
            rules: [RULE-25, RULE-4, RULE-3, RULE-13]
          depends_on: []
          complexity: "M"
          validation: "mvn dependency:resolve and gradle build both succeed with no version conflicts; Spring AI starter does not force an unexpected Boot patch."
          risk: "Spring AI 2.0.1 / Timefold / Boot 4.1 coordinate drift can fail the build (Hotspot 2); resolve exact versions here before any downstream task."
          source: "review/MAJOR-3"
        - id: task-1.2
          name: "Adopt Flyway as sole schema/seed owner"
          description: "Disable spring.sql.init; set spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}; convert existing per-vendor schema.sql/data.sql into V1 baseline migrations (H2/MySQL/Postgres), preserving current seed data unchanged."
          artifact: "src/main/resources/db/migration/{common,h2,mysql,postgres}/V1__*.sql, application*.properties"
          covers:
            acs: [AC-64, AC-63]
            rules: [RULE-3, RULE-2]
          depends_on: [task-1.1]
          complexity: "L"
          validation: "Fresh DB on H2, Testcontainers MySQL, and Postgres migrates cleanly; all existing PetClinic tests remain green."
        - id: task-1.3
          name: "Minimal SchedulingRequest aggregate"
          description: "Create just enough persistence to drive the spikes: SchedulingRequest entity + repository + V2 migration with state enum, consent flag, raw free text, embedded interpretation, and guarded state transitions in the service layer. (active_pet_key and queue fields added later in phases 5.)"
          artifact: "petclinic/scheduling/SchedulingRequest.java, SchedulingRequestRepository.java, migration"
          covers:
            acs: [AC-25]
            rules: [RULE-2, RULE-10, RULE-15]
          depends_on: [task-1.2]
          complexity: "M"
          validation: "Illegal transitions rejected in unit tests; raw text + interpretation survive restart."
        - id: task-1.4
          name: "Interpretation spike (Spring AI + Ollama)"
          description: "Interpretation record + InterpretationService using ChatClient → Ollama (model configurable, default gemma4:latest), structured output binding, duration clamp to clinic bounds (+default), symbolic-window resolution via PartOfDay defaults; absent ChatModel or LLM error/timeout → STAFF_QUEUED(AI_UNAVAILABLE). Prove with a mocked ChatModel plus one real integration path."
          artifact: "petclinic/scheduling/Interpretation.java, InterpretationService.java"
          covers:
            acs: [AC-15, AC-17, AC-20, AC-21, AC-22, AC-23, AC-24]
            rules: [RULE-7, RULE-8, RULE-16]
          depends_on: [task-1.3]
          complexity: "L"
          validation: "Mocked-ChatModel tests: valid text → structured record; duration boundary triple (within/at/beyond→clamped, absent→default); no-ChatModel → queued. One live Ollama smoke test."
          risk: "Spring AI coordinate/config drift on Boot 4.1 (Hotspot 2); pin the BOM and prove the no-model fallback path."
        - id: task-1.5
          name: "Timefold solver spike"
          description: "Planning model + ConstraintProvider (hard: availability, no-overlap, contiguous fit, specialty, horizon/not-past, excluded, previously-rejected; soft: preferred≫allowed, preferred vet, earlier-by-urgency, load-balance); 15-min grid; SolverManager async with ~1s spent-limit termination; frozen snapshot input. Prove a feasible slot is returned and an infeasible fixture reports exhaustion, against a small in-memory availability fixture."
          artifact: "petclinic/scheduling/solver/*.java"
          covers:
            acs: [AC-26, AC-27, AC-28, AC-29, AC-30, AC-32, AC-33, AC-34, AC-66]
            rules: [RULE-4, RULE-5, RULE-6, RULE-20]
          depends_on: [task-1.3]
          complexity: "L"
          validation: "Small-fixture solver tests: only hard-valid slots offered; horizon boundary (within/at/beyond) and past excluded; solve terminates within bound; infeasible → exhausted."
          risk: "Score design can loop on near-identical slots or declare infeasible early (Hotspot 1); model rejected pairs as hard constraints and assert convergence."
          source: "review/MAJOR-3"
      checkpoint:
        id: cp-1
        description: "The risky integrations are proven on Boot 4.1 / Java 21 before any product investment."
        criteria:
          - "All new dependencies resolve; Flyway owns the schema across H2/MySQL/Postgres with the existing suite green."
          - "InterpretationService returns a structured record and falls back to the queue when no ChatModel is present."
          - "The Timefold solver returns a valid slot, respects hard constraints, and terminates within the time bound."

    - id: phase-2
      name: "Retire concurrency risk: async spine + holds"
      description: "Wire interpretation and solve behind a non-blocking async flow with auto-refreshing status pages, then prove the hold/slot-occupancy concurrency and accept path end to end for one happy request. Addresses review Hotspots 3 and 4. Still under a test principal (see dec-4)."
      covers: [AC-12, AC-13, AC-14, AC-16, AC-18, AC-19, AC-36, AC-37, AC-38, AC-40, AC-41, AC-65]
      entry_criteria: "cp-1 passed."
      tasks:
        - id: task-2.1
          name: "Async orchestration"
          description: "Bounded @Async executor config; orchestrate interpretation and solve off the request thread without blocking; transactional state writes so the status page never reads a torn state."
          artifact: "petclinic/scheduling/AsyncConfig.java, orchestration service"
          covers:
            acs: [AC-65]
            rules: [RULE-9, RULE-23]
          depends_on: [task-1.4, task-1.5]
          complexity: "M"
          validation: "Submitting a request returns immediately; interpretation/solve run asynchronously; state transitions are committed atomically."
          risk: "Async read/write races on request state (Hotspot 3); assert every intermediate state is observable and consistent."
        - id: task-2.2
          name: "Request form, consent, status and confirmation screens"
          description: "Owner request form with always-visible urgent-care banner and consent; auto-refreshing status page driven by request state; confirmation screen; declining consent → STAFF_QUEUED(CONSENT_DECLINED) without an LLM call; editing free text after confirmation → DRAFT with fresh consent/interpretation."
          artifact: "petclinic/scheduling/SchedulingController.java, templates/scheduling/*.html"
          covers:
            acs: [AC-12, AC-13, AC-14, AC-16, AC-18, AC-19]
            rules: [RULE-15, RULE-23]
          depends_on: [task-2.1]
          complexity: "L"
          validation: "MockMvc: consent submit returns the status page immediately; state advances the page; decline → queued with no LLM call; text edit resets to DRAFT; every state maps to a screen."
          risk: "Async status/state races surface here as intermediate states without a screen (Hotspot 3)."
        - id: task-2.3
          name: "Slot occupancy and holds"
          description: "slot_occupancy table with plain UNIQUE(vet_id, start_time) shared by holds and appointments; place a transactional hold with countdown when a slot is offered; expose only vet/specialty/date/start/duration to the owner."
          artifact: "petclinic/scheduling/SlotOccupancy.java, Hold.java, HoldService.java, migration"
          covers:
            acs: [AC-36, AC-37, AC-38]
            rules: [RULE-11]
          depends_on: [task-2.2]
          complexity: "L"
          validation: "Concurrent hold attempts on one slot: exactly one succeeds (DB constraint arbitrates); owner view shows only suggestion fields."
          risk: "Hold-expiry vs accept race begins here (Hotspot 4); the unique constraint is the tie-breaker."
          source: "review/MAJOR-1"
        - id: task-2.4
          name: "Accept to appointment"
          description: "Accept → create BOOKED Appointment (FKs Pet/Owner/Vet/SchedulingRequest) + transition CONFIRMED; re-validate hold expiry inside the accept transaction so a lapsed hold cannot be booked."
          artifact: "petclinic/scheduling/Appointment.java, accept flow"
          covers:
            acs: [AC-40, AC-41]
            rules: [RULE-10, RULE-11]
          depends_on: [task-2.3]
          complexity: "M"
          validation: "Accept-before-expiry books and transitions CONFIRMED; accept after expiry is refused; no double-book under concurrent accepts."
          risk: "Hold-expiry vs accept race (Hotspot 4); expiry re-checked within the commit."
      checkpoint:
        id: cp-2
        description: "End-to-end scheduling spine proven; all architectural risk retired. Handoff from risk_first to feature_slice."
        criteria:
          - "A test principal completes text → consent → async interpret → confirm → async solve → hold → accept → Appointment."
          - "Concurrent holds/accepts on one slot never double-book; accept re-validates expiry."
          - "Status pages render every state without blocking."

    - id: phase-3
      name: "Authentication and accounts"
      description: "Retrofit Spring Security around the proven spine: form login, UserAccount model, access zones, first-login change, staff account management, and owner self-service scoping (including ownership checks on the phase-2 scheduling routes)."
      covers: [AC-1, AC-2, AC-3, AC-4, AC-5, AC-6, AC-7, AC-8, AC-9, AC-10, AC-11, AC-67, AC-68]
      entry_criteria: "cp-2 passed."
      tasks:
        - id: task-3.1
          name: "UserAccount model and password hashing"
          description: "UserAccount entity (username, bcrypt password, role OWNER|STAFF, must_change_password, nullable owner FK), repository, BCryptPasswordEncoder bean, and a migration for the user_account table (all vendors)."
          artifact: "petclinic/security/UserAccount.java, UserAccountRepository.java, migration"
          covers:
            acs: [AC-67]
            rules: [RULE-13, RULE-2, RULE-1]
          depends_on: [task-1.2]
          complexity: "M"
          validation: "Persisted passwords are bcrypt hashes; a unit test asserts no plaintext is stored."
        - id: task-3.2
          name: "Security config and access zones"
          description: "Form login and URL zones: /staff/** and /owners/** require ROLE_STAFF; owner self-service and scheduling routes require ROLE_OWNER; login/change-password/welcome public. Add spring-security-test."
          artifact: "petclinic/security/SecurityConfig.java"
          covers:
            acs: [AC-1, AC-2, AC-7]
            rules: [RULE-13, RULE-14]
          depends_on: [task-3.1]
          complexity: "M"
          validation: "MockMvc + spring-security-test: unauthenticated → login redirect; owner hitting /staff/** → 403."
        - id: task-3.3
          name: "First-login forced password change"
          description: "Filter/interceptor redirecting users with must_change_password to the change-password page for all routes except logout and that page; change-password screen clears the flag."
          artifact: "petclinic/security/PasswordChangeInterceptor.java, templates/security/changePassword.html"
          covers:
            acs: [AC-3]
            rules: [RULE-13]
          depends_on: [task-3.2]
          complexity: "M"
          validation: "State-setup test: a flagged user is redirected until the password is changed, then reaches normal routes."
        - id: task-3.4
          name: "Bootstrap initial staff account"
          description: "ApplicationRunner that creates/reconciles a staff UserAccount from config/system properties at startup; never seeded in Flyway."
          artifact: "petclinic/security/StaffAccountBootstrap.java"
          covers:
            acs: [AC-6]
            rules: [RULE-13]
          depends_on: [task-3.1]
          complexity: "S"
          validation: "Integration test: with bootstrap properties set, a staff account exists after startup."
        - id: task-3.5
          name: "Staff account management"
          description: "Staff can create owner accounts (staff-set username + temp password + must_change_password), create staff accounts, and reset passwords."
          artifact: "petclinic/security/AccountAdminController.java, templates"
          covers:
            acs: [AC-4, AC-5]
            rules: [RULE-13]
          depends_on: [task-3.3, task-3.4]
          complexity: "M"
          validation: "MockMvc: staff creates owner/staff accounts and resets a password; new accounts require change on first login."
        - id: task-3.6
          name: "Owner self-service and ownership checks"
          description: "Owner profile update-only screen and own-pet CRUD; move existing /owners/** owner+pet CRUD to staff-only; enforce per-handler ownership checks on profile, pets, and the phase-2 scheduling request routes."
          artifact: "petclinic/owner/* (zone move), petclinic/scheduling/ owner controllers"
          covers:
            acs: [AC-8, AC-9, AC-10, AC-11, AC-68]
            rules: [RULE-14, RULE-21]
          depends_on: [task-3.2, task-2.2]
          complexity: "L"
          validation: "MockMvc: owner edits own profile/pets; accessing another owner's profile/pet/request → 403; ID tampering blocked at handler."
      checkpoint:
        id: cp-3
        description: "Authentication and authorization enforced, including on the scheduling spine."
        criteria:
          - "All authz negative ACs (AC-2, AC-7, AC-9, AC-11) have passing negative tests."
          - "First-login change and staff account management work end to end."
          - "Existing owner/pet CRUD reachable only by staff; scheduling routes ownership-checked."

    - id: phase-4
      name: "Clinic configuration and availability"
      description: "Add clinic settings, parts-of-day, and per-vet availability with a timezone-aware availability service, then feed real availability into the solver and expose staff configuration screens."
      covers: [AC-31, AC-61, AC-62, AC-63]
      entry_criteria: "cp-3 passed."
      tasks:
        - id: task-4.1
          name: "ClinicSettings and PartOfDay"
          description: "Entities + repositories + migration for clinic_settings (single row: timeZone, min/max/defaultVisitMinutes, bookingHorizonDays, holdDurationMinutes, gridMinutes=15) and part_of_day; seed defaults via Flyway (replacing the interim defaults used by the phase-1 spike)."
          artifact: "petclinic/clinic/ClinicSettings.java, PartOfDay.java, migration"
          covers:
            acs: [AC-63]
            rules: [RULE-2, RULE-3]
          depends_on: [task-1.2]
          complexity: "M"
          validation: "Fresh DB has default settings + parts-of-day, loadable via repository."
        - id: task-4.2
          name: "Vet availability model"
          description: "Entities + migration for vet_weekly_shift (split shifts as multiple rows), vet_date_exception (LEAVE|MODIFIED_HOURS|EXTRA), and clinic_closure."
          artifact: "petclinic/vet/VetWeeklyShift.java, VetDateException.java, petclinic/clinic/ClinicClosure.java, migration"
          covers:
            acs: []
            rules: [RULE-2, RULE-1]
          depends_on: [task-4.1]
          complexity: "M"
          validation: "Entities persist; split shifts (two rows/day) round-trip correctly."
        - id: task-4.3
          name: "Timezone-aware AvailabilityService"
          description: "Compute a vet's bookable time on a date = weekly shifts minus exceptions/leave minus clinic closures, all in ClinicSettings.timeZone; expose now/horizon in the clinic zone."
          artifact: "petclinic/clinic/AvailabilityService.java"
          covers:
            acs: [AC-61, AC-31]
            rules: [RULE-20]
          depends_on: [task-4.2]
          complexity: "L"
          validation: "Unit tests including a DST-boundary date; closures and leave correctly subtract; now/past resolved in clinic zone."
          risk: "Timezone/DST off-by-one errors (Hotspot 5); test explicitly across a DST transition."
        - id: task-4.4
          name: "Wire real availability into solver + staff config screens"
          description: "Replace the phase-1 in-memory availability fixture with AvailabilityService as the solver's hard input; add Thymeleaf staff screens for clinic settings, parts-of-day, vet shifts/exceptions, and closures."
          artifact: "petclinic/clinic/ClinicConfigController.java, solver wiring, templates/clinic/*.html"
          covers:
            acs: [AC-62]
            rules: [RULE-14, RULE-21, RULE-20]
          depends_on: [task-4.3, task-1.5]
          complexity: "M"
          validation: "MockMvc: staff edits each config type and changes persist (owners 403); solver offers only slots within computed availability."
      checkpoint:
        id: cp-4
        description: "Availability configurable and correctly computed in the clinic time zone; the solver uses it."
        criteria:
          - "AvailabilityService passes shift/exception/closure and DST tests."
          - "The solver now offers only slots within real computed availability."
          - "Staff can edit all configuration; owners cannot."

    - id: phase-5
      name: "Full guided flow and staff fallback"
      description: "Thicken the spine into the complete guided flow: rejection/exclusion loop, hold expiry and sweeper, one-active-request-per-pet, urgency/emergency handling, failure routing, and the staff fallback queue."
      covers: [AC-35, AC-39, AC-42, AC-43, AC-44, AC-45, AC-46, AC-47, AC-48, AC-49, AC-50, AC-59, AC-60]
      entry_criteria: "cp-4 passed."
      tasks:
        - id: task-5.1
          name: "Reject / ask-again exclusion loop"
          description: "On reject, release the hold, permanently exclude the exact (vet_id, start_time) for the request, transition to SUGGESTING, and re-solve against the updated exclusions."
          artifact: "petclinic/scheduling/ (exclusion handling + solver wiring)"
          covers:
            acs: [AC-42]
            rules: [RULE-10, RULE-11, RULE-5]
          depends_on: [task-2.4]
          complexity: "M"
          validation: "Reject then ask-again never re-offers the excluded pair; the loop converges toward exhaustion."
          risk: "Re-solve loop convergence (Hotspot 1)."
        - id: task-5.2
          name: "Hold expiry and scheduled sweeper"
          description: "Lazy expiry validation on each owner action (expired hold releases without excluding, returns to SUGGESTING); a @Scheduled sweeper reclaims abandoned holds/occupancy rows."
          artifact: "petclinic/scheduling/HoldSweeper.java, HoldService updates"
          covers:
            acs: [AC-39, AC-43, AC-44]
            rules: [RULE-11, RULE-12]
          depends_on: [task-5.1]
          complexity: "M"
          validation: "Action at/after expiry is treated as expired; the sweeper frees stale slots; timeout does not exclude."
          risk: "Hold-expiry vs accept race (Hotspot 4)."
        - id: task-5.3
          name: "One active request per pet"
          description: "Enforce at most one non-terminal SchedulingRequest per pet via a nullable active_pet_key column (plain UNIQUE) plus a transactional service check; allow one active request per distinct pet."
          artifact: "petclinic/scheduling/ (guard + migration)"
          covers:
            acs: [AC-59, AC-60]
            rules: [RULE-22]
          depends_on: [task-1.3]
          complexity: "M"
          validation: "A second active request for a pet is blocked and the existing one surfaced; concurrent requests for different pets allowed; verified on MySQL."
          source: "review/MAJOR-2"
        - id: task-5.4
          name: "Urgency, emergency, and failure routing"
          description: "Weight earlier-is-better up for URGENT (stay automated); EMERGENCY short-circuits the solver to STAFF_QUEUED(EMERGENCY) top priority; route NO_SPECIALTY_VET, SUGGESTIONS_EXHAUSTED (infeasible solve), and SOLVER_UNAVAILABLE (solver error) to the queue."
          artifact: "petclinic/scheduling/ (routing + constraint weighting)"
          covers:
            acs: [AC-35, AC-45, AC-46, AC-47, AC-48]
            rules: [RULE-5, RULE-10, RULE-17]
          depends_on: [task-5.1, task-4.3]
          complexity: "M"
          validation: "Each condition transitions to the correct STAFF_QUEUED reason; URGENT stays automated and offers the earliest feasible slot."
        - id: task-5.5
          name: "Staff fallback queue"
          description: "Queue view over SchedulingRequest where state=STAFF_QUEUED, ordered emergency-first then FIFO with reason/queued time; staff verify/complete the interpretation and book on the owner's behalf."
          artifact: "petclinic/scheduling/StaffQueueController.java, templates/scheduling/queue*.html"
          covers:
            acs: [AC-49, AC-50]
            rules: [RULE-21, RULE-18]
          depends_on: [task-5.4, task-3.2]
          complexity: "M"
          validation: "MockMvc: queue ordering correct; staff completes interpretation and books; owners cannot reach the queue."
      checkpoint:
        id: cp-5
        description: "Complete guided flow including rejection, expiry, concurrency, emergencies, and staff fallback."
        criteria:
          - "Reject/ask-again, expiry, and sweeper behave per ACs."
          - "All STAFF_QUEUED routing reasons are reachable and correctly labeled."
          - "One-active-request-per-pet enforced on all three DBs."

    - id: phase-6
      name: "Appointment lifecycle and management"
      description: "Complete the BookingService: staff direct booking/reschedule/cancel with reasons, completion-to-Visit and no-show, and owner self-service view/cancel."
      covers: [AC-51, AC-52, AC-53, AC-54, AC-55, AC-56, AC-57, AC-58]
      entry_criteria: "cp-5 passed."
      tasks:
        - id: task-6.1
          name: "Staff direct booking, reschedule, cancel"
          description: "BookingService paths for staff to book directly (null SchedulingRequest), reschedule (re-validate availability + non-overlap via slot_occupancy), and cancel; record changeReason for staff-initiated changes."
          artifact: "petclinic/scheduling/BookingService.java, staff appointment controller/templates"
          covers:
            acs: [AC-51, AC-52, AC-53]
            rules: [RULE-18]
          depends_on: [task-2.4]
          complexity: "L"
          validation: "Reschedule to an occupied slot is rejected; changeReason persisted; direct booking has no request."
        - id: task-6.2
          name: "Completion-to-Visit and no-show"
          description: "Mark a BOOKED appointment COMPLETED (transactionally create a Visit in the pet's history) or NO_SHOW (no Visit); both statuses terminal."
          artifact: "petclinic/scheduling/BookingService.java (lifecycle), templates"
          covers:
            acs: [AC-54, AC-55]
            rules: [RULE-18, RULE-19]
          depends_on: [task-6.1]
          complexity: "M"
          validation: "Completion writes exactly one Visit; no-show writes none; both statuses terminal."
        - id: task-6.3
          name: "Owner view and cancel own appointments"
          description: "Owner screen listing own upcoming appointments; cancel allowed while start is in the future (frees the slot); at/after start not shown as upcoming and not cancellable; other owners' appointments inaccessible."
          artifact: "petclinic/scheduling/OwnerAppointmentController.java, templates"
          covers:
            acs: [AC-56, AC-57, AC-58]
