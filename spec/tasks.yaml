    - id: phase-4
      name: "Staff calendar & appointment lifecycle — UC-5"
      description: "Give staff the full day-view calendar and appointment management: the five-layer per-vet day view; editable clinic settings incl. time zone; the vet-availability model with effective-blocks precedence, conflict handling and the out-of-hours warning; and appointment reschedule/cancel/complete with audit, the completion-timing boundary, the completed→visit link and the owner clinic-change marker. Demo: staff open the day-view calendar, edit clinic settings and vet availability (conflicts with confirmed appointments refused, hold-only conflicts invalidated), reschedule/cancel with a reason, and after start-time mark completed to create a prefilled visit."
      covers: [AC-96, AC-98, AC-99, AC-100, AC-101, AC-102, AC-103, AC-107, AC-109, AC-110, AC-111, AC-112, AC-113, AC-114, AC-115, AC-119, AC-120, AC-138]
      entry_criteria: "phase-3 cp-3 approved: staff can resolve queued requests."
      tasks:
        - id: task-4.1
          name: "Full day-view calendar (five layers)"
          description: "Render the staff calendar as a server-side day view, one column per veterinarian, one row per 15-minute grid step, cells coloured closed/off-shift/free/booked/held, with prev/next-day navigation and a date picker over a range covering the horizon (RULE-33, AC-96). Per vet per day show the five layers: opening hours or closure, effective working blocks, booked appointments, held slots and remaining free capacity (AC-98)."
          artifact: "src/main/java/.../scheduling/web/StaffCalendarController.java, .../clinic/CalendarViewService.java; templates/staff/calendar.html; src/test/java/.../scheduling/CalendarViewTests.java"
          covers:
            acs: [AC-96, AC-98]
            rules: [RULE-33]
          depends_on: [task-3.3]
          complexity: "M"
          validation: "CalendarViewTests asserts the day view renders one column per vet and one row per 15-minute step with cells coloured closed/off-shift/free/booked/held and prev/next-day + date-picker navigation across the horizon (AC-96), and that per vet per day it presents all five layers — opening hours/closure, effective working blocks, booked appointments, held slots and remaining free capacity (AC-98)."
        - id: task-4.2
          name: "Clinic settings + injectable time zone editing"
          description: "Make clinic settings staff-editable in the UI starting from seeded defaults (RULE-37, AC-99): opening hours per weekday, visit-duration bounds and default, booking horizon, parts of day, emergency phone, and time zone. The single configured time zone (default Europe/Amsterdam) drives the injectable Clock everywhere now/date/time is needed (AC-108 was established in phase-1; this task exposes the editable setting)."
          artifact: "src/main/java/.../scheduling/web/ClinicSettingsController.java, .../clinic/ClinicSettingsService.java; templates/staff/settings.html; src/test/java/.../scheduling/ClinicSettingsTests.java"
          covers:
            acs: [AC-99]
            rules: [RULE-37]
          depends_on: [task-4.1]
          complexity: "M"
          validation: "ClinicSettingsTests asserts staff can edit each clinic setting (opening hours per weekday, duration bounds/default, booking horizon, parts of day, emergency phone, time zone) in the UI starting from the seeded defaults, and that a saved change is persisted and reflected on next render (AC-99)."
        - id: task-4.3
          name: "Vet availability model + effective-blocks precedence + conflict handling + out-of-hours warning"
          description: "Support per vet a recurring weekly schedule with split shifts, date exceptions (a date with zero or more replacement blocks; zero = unavailable all day), leave (inclusive whole-day date range) and clinic-wide closures (single date) (RULE-34, AC-100). Compute a day's effective blocks as closure ? none : leave ? none : exception ? its blocks : weekly blocks, all intersected with opening hours, precedence closure > leave > exception > weekly (AC-101). An availability edit (exception, leave, closure or opening hours) that conflicts with a confirmed appointment is refused with the conflict list and changes nothing until staff reschedule/cancel (AC-102); one that conflicts only with holds invalidates those holds and applies (AC-103). Weekly blocks entered outside opening hours are accepted with a page warning and intersected at runtime (AC-107)."
          artifact: "src/main/java/.../scheduling/clinic/{VetAvailabilityService,EffectiveBlocksCalculator}.java; templates/staff/availability.html; src/test/java/.../scheduling/{EffectiveBlocksTests,AvailabilityConflictTests}.java"
          covers:
            acs: [AC-100, AC-101, AC-102, AC-103, AC-107]
            rules: [RULE-34]
          depends_on: [task-4.2]
          complexity: "L"
          validation: "EffectiveBlocksTests asserts the availability model supports weekly split shifts, date exceptions (zero = unavailable all day), leave ranges and clinic closures (AC-100) and computes effective blocks by the precedence closure > leave > exception > weekly intersected with opening hours (AC-101). AvailabilityConflictTests asserts an edit conflicting a CONFIRMED appointment is refused with the conflict list and mutates nothing until reschedule/cancel (AC-102), an edit conflicting only holds invalidates those holds and applies (AC-103), and weekly blocks outside opening hours are accepted with a page warning and intersected at runtime (AC-107)."
        - id: task-4.4
          name: "Appointment reschedule / cancel + audit + clinic-change marker + retained cancellations"
          description: "Implement staff appointment management (RULE-36/RULE-16): staff reschedule before start mutates the appointment in place and records the old time in appointment_change (AC-109); staff cancel before start with a reason sets CANCELLED_BY_STAFF and records the reason (AC-110); every staff book/reschedule/cancel writes an appointment_change row (appointment, actor, action, reason, timestamp) shown per appointment on the calendar (AC-115); rescheduled/cancelled items show owners a 'changed by the clinic' marker with the staff reason and original time (AC-119); cancelled appointments are retained as rows and shown under past items (AC-120)."
          artifact: "src/main/java/.../scheduling/appointment/AppointmentManagementService.java; templates/my/appointments.html (clinic-change marker); src/test/java/.../scheduling/AppointmentManagementTests.java"
          covers:
            acs: [AC-109, AC-110, AC-115, AC-119, AC-120]
            rules: [RULE-16, RULE-36]
          depends_on: [task-4.3]
          complexity: "M"
          validation: "AppointmentManagementTests asserts staff reschedule before start mutates the appointment in place and writes the old time to appointment_change (AC-109); staff cancel before start with a reason sets CANCELLED_BY_STAFF and records the reason (AC-110); each staff book/reschedule/cancel writes an appointment_change row shown per appointment on the calendar (AC-115); rescheduled/cancelled items render an owner-facing 'changed by the clinic' marker with the staff reason and original time (AC-119); and cancelled appointments are retained as rows under past items, not deleted (AC-120)."
        - id: task-4.5
          name: "Completion-timing boundary + completed→linked visit"
          description: "Enforce the completion-timing boundary in the appointment guard (RULE-16): mark-completed/no-show is refused before the scheduled start (AC-111), allowed exactly at the start boundary once it has just passed (AC-112) and while the start is in the past (AC-113). On completion create a visits row linked by appointment_id, description prefilled from the owner's reason or the staff booking reason and editable, visit date = appointment date (RULE-36, AC-114)."
          artifact: "src/main/java/.../scheduling/appointment/CompletionService.java; src/test/java/.../scheduling/{CompletionBoundaryTests,CompletionVisitTests}.java"
          covers:
            acs: [AC-111, AC-112, AC-113, AC-114]
            rules: [RULE-16, RULE-36]
          depends_on: [task-4.4]
          complexity: "M"
          validation: "CompletionBoundaryTests asserts three points against the pinned Clock: mark-completed/no-show before start is refused with IllegalAppointmentTransitionException and no state change (AC-111), allowed exactly when the start has just passed (AC-112), and allowed while the start is in the past (AC-113). CompletionVisitTests asserts completion creates a visits row linked by appointment_id with the description prefilled from the owner's reason (or staff booking reason), editable, and visit date = appointment date (AC-114)."
        - id: task-4.6
          name: "UC-5 staff-manage-appointment MockMvc end-to-end"
          description: "Add SchedulingLifecycleE2eTests.staffManageAppointment (RULE-44) on isolated H2 + pinned Clock + stub + synchronous executor with the real filter chain and CSRF as staff: step 1 staff open the appointment on the day-view calendar; step 2 staff reschedule or cancel it before start recording a reason; step 3 after the start time passes staff mark it completed or no-show; step 4 on completion the system creates a visit prefilled and editable; plus ext 5a availability edit conflicts a confirmed appointment→refused and ext 5b conflicts only holds→invalidated."
          artifact: "src/test/java/.../scheduling/SchedulingLifecycleE2eTests.java (staffManageAppointment)"
          covers:
            acs: [AC-138]
            rules: [RULE-44]
          depends_on: [task-4.5]
          complexity: "M"
          validation: "SchedulingLifecycleE2eTests.staffManageAppointment drives UC-5 steps 1..4 at the HTTP level as staff, asserting state after each step (Confirmed → rescheduled-in-place/CANCELLED_BY_STAFF with reason → completed/no-show after start → linked visits row on completion), and includes the state-changing legs 5a (availability edit conflicting a confirmed appointment refused with the conflict list, nothing mutated) and 5b (edit conflicting only holds invalidates them and applies)."
      checkpoint:
        id: cp-4
        description: "Staff can manage the calendar and appointment lifecycle end to end; availability conflict semantics hold."
        criteria:
          - "Human walkthrough: signed in as staff, execute UC-5 main scenario by hand (open an appointment on the day-view calendar, reschedule/cancel before start with a reason, after start mark completed to create a prefilled editable visit) and the extension legs (availability edit refused on a confirmed conflict; hold-only conflict invalidated)."
          - "AvailabilityConflictTests shows an availability edit conflicting a confirmed appointment is refused with the conflict list and mutates nothing; a hold-only conflict invalidates the holds and applies."
          - "CompletionBoundaryTests shows mark-completed/no-show is refused before start and allowed at/after start (three points)."
          - "AppointmentManagementTests shows every staff book/reschedule/cancel writes an appointment_change row and the owner sees the 'changed by the clinic' marker with reason and original time."
          - "git status shows no tracked file modified by the run."

    - id: phase-5
      name: "Owner cancel + terminal verification — UC-6"
      description: "Complete the owner self-service cancel and lock in the terminal verification: owner cancel of an upcoming appointment with the past/no-show refusal and the other-owner 404; the mandatory full AC-138 interleaved owner+staff lifecycle including the declined-consent→staff-book→no-show leg; and the full concurrency guarantees plus the localization no-literal sweep over every feature-touched file. Demo: an owner cancels an upcoming appointment and sees it retained under past items with the clinic-change marker; the complete interleaved owner+staff lifecycle passes end to end."
      covers: [AC-116, AC-117, AC-118, AC-138, AC-140, AC-141]
      entry_criteria: "phase-4 cp-4 approved: staff calendar and appointment lifecycle are complete."
      tasks:
        - id: task-5.1
          name: "Owner cancel upcoming + refuse past/no-show + other-owner 404"
          description: "Let an owner cancel their own upcoming confirmed appointment before its start: move it to CANCELLED_BY_OWNER, keep it as a past record and leave the request closed (RULE-36/RULE-16, AC-116). Refuse cancelling a past visit or a no-show with no state change (AC-117). An owner attempting to cancel or view another owner's appointment gets 404, no DB change, and discloses nothing about that appointment (RULE-13, AC-118)."
          artifact: "src/main/java/.../scheduling/web/OwnerAppointmentController.java, .../appointment/OwnerCancelService.java; src/test/java/.../scheduling/OwnerCancelTests.java"
          covers:
            acs: [AC-116, AC-117, AC-118]
            rules: [RULE-13, RULE-16, RULE-36]
          depends_on: [task-4.4]
          complexity: "M"
          validation: "OwnerCancelTests asserts an owner cancelling their own upcoming confirmed appointment before start moves it to CANCELLED_BY_OWNER, keeps the row under past items and leaves the request closed (AC-116); attempting to cancel a past visit or a no-show is refused with no state change (AC-117); and cancelling/viewing another owner's appointment returns 404 identical to a missing id with no DB change and no disclosure (AC-118)."
        - id: task-5.2
          name: "Mandatory full AC-138 interleaved owner+staff lifecycle"
          description: "Complete the single mandatory MockMvc lifecycle test (RULE-44, AC-138) with the real filter chain, CSRF and interleaved owner+staff sessions on isolated H2 + pinned Clock + stub + synchronous executor, driving the full chain and asserting state after each step: request → consent → interpretation → suggestion → ask again → staff hand-off → staff suggestion → accept → completed visit, PLUS a declined-consent request booked by staff and closed as no-show. This unifies the per-UC legs authored in phases 1–4 into the one mandatory interleaved run."
          artifact: "src/test/java/.../scheduling/SchedulingLifecycleE2eTests.java (fullInterleavedLifecycle)"
          covers:
            acs: [AC-138]
            rules: [RULE-44]
          depends_on: [task-5.1]
          complexity: "L"
          validation: "SchedulingLifecycleE2eTests.fullInterleavedLifecycle is the mandatory MockMvcTester test with the real filter chain and CSRF that interleaves an owner session and a staff session and drives request → consent → interpretation → suggestion → ask again → staff hand-off → staff suggestion → accept → completed visit, asserting request/appointment state after EVERY named step, and additionally drives a declined-consent request booked by staff and closed as no-show, asserting the terminal No-show state — all on the isolated H2 with the pinned Clock, stub interpreter and synchronous executor."
        - id: task-5.3
          name: "Full concurrency guarantees + localization no-literal sweep"
          description: "Assert the full concurrency guarantees under simultaneous submission (RULE-9/RULE-10/RULE-44, AC-141): two owners can never confirm the same vet-and-time and a pet can never end up with two active requests, with the H2 isolation pinned. Run the localization sweep over ALL feature-introduced/modified files (RULE-41, AC-140): every user-visible string — page text, labels, placeholders, other attributes and Java-produced status/flash messages — resolves through a message key present in all 11 bundles, authored in English with identical English placeholder text in each non-English bundle, with no English literal emitted from any feature-introduced/modified template or Java class (including the modified stock layout.html/navbar)."
          artifact: "src/test/java/.../scheduling/ConcurrencyGuaranteeTests.java; src/test/java/.../presentation/LocalizationSweepTests.java"
          covers:
            acs: [AC-140, AC-141]
            rules: [RULE-9, RULE-10, RULE-41, RULE-44]
          depends_on: [task-5.2]
          complexity: "M"
          validation: "ConcurrencyGuaranteeTests runs two simultaneous transactions on the real DB and asserts at most one owner confirms a given vet-and-time (loser refused, no double booking) and at most one active request is created per pet under simultaneous creation, with the isolation level pinned (AC-141). LocalizationSweepTests enumerates every feature-introduced/modified template and Java file and fails if any referenced message key is absent from any of the 11 bundles or if any English literal is emitted from those files, covering template text, attributes, inline expressions and MessageSource-produced messages (AC-140)."
      checkpoint:
        id: cp-5
        description: "Terminal checkpoint: the whole feature passes end to end with a clean working tree."
        criteria:
          - "Human walkthrough: signed in as owner, execute UC-6 main scenario by hand (cancel an upcoming appointment and see it retained under past items with the 'changed by the clinic' marker where applicable) and the extension legs (cancelling a past visit/no-show is refused; another owner's appointment returns 404)."
          - "SchedulingLifecycleE2eTests.fullInterleavedLifecycle drives every named step of request → consent → interpretation → suggestion → ask again → staff hand-off → staff suggestion → accept → completed visit plus the declined-consent→staff-book→no-show leg, asserting state after each step."
          - "ConcurrencyGuaranteeTests proves no double booking and no second active request per pet under simultaneous submission; LocalizationSweepTests proves every feature key exists in all 11 bundles with no English literal in any feature-touched file."
          - "Full suite green; git status shows no tracked file modified by the run."
